<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>TRI-swim-strength</title>
<meta name="description" content="Two resistance band dryland sessions for swimmers: a 20-minute pre-swim primer and a 35-minute strength session, with progress tracking." />
<meta name="theme-color" content="#182542" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Swim Strength" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="shell">

  <header class="topbar">
    <a class="brand" href="#top" aria-label="TRI-swim-strength home">
      <b>TRI-swim-strength</b>
    </a>
    <button class="text-button" id="resetButton" type="button">Reset session</button>
  </header>

  <div class="session-tabs" role="tablist" aria-label="Choose a session">
    <button class="session-tab" role="tab" id="tab-primer" data-session="primer" aria-selected="true" aria-controls="sessionPanel" type="button">
      <span class="session-tab-name">Pre-swim primer</span>
      <span class="session-tab-meta">20 min</span>
    </button>
    <button class="session-tab" role="tab" id="tab-strength" data-session="strength" aria-selected="false" aria-controls="sessionPanel" tabindex="-1" type="button">
      <span class="session-tab-name">Strength</span>
      <span class="session-tab-meta">35 min</span>
    </button>
  </div>

  <div class="completion-banner hidden" id="completionBanner" role="status">
    <p class="completion-title" id="completionTitle">Well done! Session complete</p>
    <p class="completion-sub" id="completionSub"></p>
    <button class="primary-button" id="completionResetButton" type="button">Reset &amp; go again</button>
  </div>

  <div id="sessionPanel" role="tabpanel" aria-labelledby="tab-primer">

    <section class="hero" id="top">
      <div class="hero-copy">
        <p class="eyebrow" id="heroEyebrow"></p>
        <h1 id="heroTitle"></h1>
        <p id="heroSub"></p>

        <div class="session-meta" id="sessionMeta"></div>

        <div class="progress-block">
          <div class="progress-top">
            <span class="progress-count"><span id="progressDone">0</span> / <span id="progressTotal">0</span> sets logged</span>
            <span class="progress-pct" id="progressPct">0%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <p class="sessions-completed" id="sessionsCompletedLabel"></p>
        </div>
      </div>
    </section>

    <div id="phases"></div>

    <section class="info-card" aria-labelledby="remindersTitle">
      <h2 id="remindersTitle">Rules for this session</h2>
      <ol class="reminder-list" id="reminderList"></ol>
    </section>

  </div>

</main>

<script src="app.js"></script>
</body>
</html>
