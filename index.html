  function clear(node){ while(node.firstChild){ node.removeChild(node.firstChild); } }
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls){ n.className = cls; }
    if(text !== undefined && text !== null){ n.textContent = text; }
    return n;
  }

  function go(i, announce){
    clearAutoProgress();
    var list = steps();
    var target = Math.max(0, i);
    if(i >= list.length){
      state.mode = 'review';
      render();
      focusHeading();
      if(announce){
        var totalQuestions = allQuestions(list).length;
        say('Review and save. ' + totalQuestions + ' question' + (totalQuestions===1?'':'s') + ' in this check-in.');
      }
      return;
    }
    state.step = target;
    state.mode = 'ask';
    render();
    focusHeading();
    if(announce){
      var legends = list[state.step].map(function(q){ return q.legend; }).join(' ');
      say('Step ' + (state.step + 1) + ' of ' + list.length + '. ' + legends);
    }
  }
  function focusHeading(){
    var h = document.getElementById('step-h');
    if(h){ h.focus({preventScroll:true}); }
    window.scrollTo(0, 0);
  }
  function pick(q, value){
    state.ans[q.k] = value;
    if(q.k === 'duration' && !isLong(value)){ delete state.ans.a3; }
    renderChrome();
    scheduleAutoProgress();
  }

  // ── Auto-progress ─────────────────────────────────────────────
  //
  // A page can hold more than one question (see PAGE_GROUPS). Answering one
  // no longer requires a manual "Next" tap: it scrolls/focuses the next
  // unanswered question on the same page, or — once every question on the
  // page has an answer — advances to the next page (or Review, past the
  // last page) exactly as tapping Next would. Debounced rather than
  // immediate, because a radio group also fires 'change' on every arrow-key
  // press while a keyboard user is still choosing between options — an
  // immediate jump would fling them onward mid-navigation. The timer is
  // cancelled by any manual navigation (go() clears it first), so a tap on
  // Back/Next/a review row can never race a still-pending auto-advance.
  var AUTO_PROGRESS_DELAY = 450;
  var autoProgressTimer = null;
  function clearAutoProgress(){
    if(autoProgressTimer){ clearTimeout(autoProgressTimer); autoProgressTimer = null; }
  }
  function scheduleAutoProgress(){
    clearAutoProgress();
    autoProgressTimer = setTimeout(function(){
      autoProgressTimer = null;
      runAutoProgress();
    }, AUTO_PROGRESS_DELAY);
  }
  function runAutoProgress(){
    if(state.mode !== 'ask'){ return; }
    var page = steps()[state.step];
    if(!page){ return; }
    for(var i = 0; i < page.length; i++){
      if(!state.ans[page[i].k]){ focusQuestion(page[i]); return; }
    }
    go(state.step + 1, true);
  }
  // Moves attention to a question further down the current page — mirrors
  // focusHeading()'s scroll-to-top-and-focus pattern, but for a mid-page
  // target rather than the page's own h1.
  function focusQuestion(q){
    var h = document.getElementById('step-h-' + q.k);
    if(!h){ return; }
    h.focus({preventScroll: true});
    h.scrollIntoView({behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'center'});
  }

  // ── Plan → check-in pre-fill ──────────────────────────────────
  //
  // The plan stores real minutes; the check-in asks for one of three buckets
  // ('30' | '60' | '120', the option values on the duration question — note
  // they are strings, because that is what pick() writes and what the radios
  // compare against). Boundaries follow the bucket labels exactly:
  // "≤ 45 min" / "45–90 min" / "90 min +".
  function planDurationBucket(mins){
    var n = parseInt(mins, 10);
    if(isNaN(n)){ return null; }
    if(n <= 45){ return '30'; }
    if(n <= 90){ return '60'; }
    return '120';
  }
  // ═══ a1 IS DELIBERATELY ABSENT FROM THIS FUNCTION — DO NOT ADD IT ═══
  //
  // a1 ("did it finish at the effort you intended?") is the sole input to the
  // intensity-drift signal, and it only means anything as an unprompted
  // self-report. The plan's `intensity` is the *intent* the athlete set in
  // advance; a1 is whether they actually held it. Seeding a1 from the plan
  // would make the app answer its own question and would report zero drift
  // forever, silently, with no error to notice. The same reasoning rules out
  // a2, a3, b2, b3 and rpe: all five are outcome reports, not plan facts.
  // Only disc / intensity / duration are re-statements of something the plan
  // already knows, and even those stay freely editable afterwards — this is a
  // shortcut into the form, never an assertion about what happened.
  function applyPlanPrefill(item){
    if(!item){ return; }
    if(item.disc){ state.ans.disc = item.disc; }
    if(item.intensity){ state.ans.intensity = item.intensity; }
    var bucket = planDurationBucket(item.duration);
    if(bucket){
      state.ans.duration = bucket;
      // Mirror pick()'s own rule: dropping to a short bucket un-asks the
      // fuelling question, so a stale a3 must not survive.
      if(!isLong(bucket)){ delete state.ans.a3; }
    }
  }
  // Land on the first question the pre-fill did not answer, rather than
  // re-rendering the page just tapped. Falls through to the review screen if
  // everything happens to be answered already (only reachable when the athlete
  // taps a planned card after back-tracking through a finished flow).
  function goToNextUnanswered(){
    var list = steps();
    for(var i = 0; i < list.length; i++){
      for(var j = 0; j < list[i].length; j++){
        if(!state.ans[list[i][j].k]){ go(i, true); return; }
      }
    }
    go(list.length, true);
  }
  function usePlannedSession(item){
    applyPlanPrefill(item);
    goToNextUnanswered();
    say('Pre-filled from your plan: ' + splashTodayName(item) + '. Every answer can still be changed.');
  }
  // Entry point from the splash card — both the Today rows and the "Earlier
  // this week" rows share this one function: a fresh check-in, dated the
  // tapped session's own day (item.date, not necessarily today), seeded from
  // the tapped session. Check-in is the one tab that requires a phase
  // (a logged session is stamped with it), so an athlete who has never set one
  // goes through the picker first and the pre-fill is held until they return —
  // same rule the Check-in nav tab follows.
  var pendingPlanPrefill = null;
  function startCheckInFromPlan(item){
    exitSplash();
    if(!state.periodisation){
      pendingPlanPrefill = item;
      els.appMain.hidden = true;
      els.periodScreen.hidden = false;
      phaseReturnView = 'flow';
      // The athlete already named a session by tapping the card, so the
      // landing screen's question is answered — the pendingPlanPrefill branch
      // in choosePeriod takes them straight to the pre-filled flow.
      phaseReturnWantsLanding = false;
      var h = document.getElementById('period-h');
      if(h){ h.focus({preventScroll:true}); }
      return;
    }
    exitPeriodScreen();
    state.ans = {date: item.date}; state.note = ''; state.step = 0; state.mode = 'ask';
    applyPlanPrefill(item);
    showView('flow');
    goToNextUnanswered();
  }

  // ── Check-in landing (state.mode === 'plan') ───────────────────────
  // Check-in is the app's primary interaction, and when today has a planned
  // session the honest default is "did you do the one you planned?", not a
  // blank date/discipline form. This screen is that default. It only ever
  // appears on a *fresh* open of Check-in with at least one session planned
  // for today — never mid-flow, never on "Log another", never after a date
  // change, and never when the athlete already named a session by tapping the
  // splash Today card (that tap has already made this screen's choice).
  function todayPlanItems(){ return planItemsFor(todayISO()); }
  // Splits a day's planned sessions into the ones still to log and the ones
  // already logged — using the *same* greedy matcher the Adherence signal
  // runs on (planDayResults), never a second rule that could disagree with
  // it. Offering an already-logged session as an equal "check in on this"
  // option is not just a cosmetic repeat: tapping it writes a duplicate
  // entry, the matcher then has two logged entries for one planned session,
  // and the spare is reported as `extra` — an unplanned session — which
  // corrupts the exact signal this screen exists to feed. Generalised from
  // today-only to any dateISO so the splash's "Earlier this week" rows
  // (splashPreviousOpenItems) can run the identical check against past days
  // rather than a hand-rolled one.
  function dayPlanSplit(dateISO){
    // buildWeek()'s own day object, not a hand-rolled one, so what
    // planDayResults() is handed here is identical in shape to what every
    // other caller hands it — and a brand-new object per call, which is
    // exactly the invariant PLAN_MATCH_CACHE documents as its safety
    // condition.
    var day = currentWeekDays().filter(function(d){ return d.date === dateISO; })[0];
    if(!day){ return {open: planItemsFor(dateISO), logged: []}; }
    var r = planDayResults(day);
    var open = [], logged = [];
    r.results.forEach(function(res){
      // Keyed on `entry`, not on `cat`. A session logged as 'didnt' scores
      // cat 'bad' but still has a real row in the log, and re-logging it
      // would duplicate it exactly as a 'good' one would.
      (res.entry ? logged : open).push(res.item);
    });
    return {open: open, logged: logged};
  }
  function todayPlanSplit(){ return dayPlanSplit(todayISO()); }
  function renderPlanLanding(){
    var split = todayPlanSplit();
    var items = split.open;
    var logged = split.logged;
    var total = items.length + logged.length;
    var h = el('h1', null, items.length === 1 ? 'Ready to check in?' : 'Which session?');
    h.id = 'step-h'; h.tabIndex = -1;
    els.body.appendChild(h);
    var hintText;
    if(!logged.length){
      hintText = items.length === 1
        ? 'This is what you had planned for today.'
        : 'You had ' + items.length + ' sessions planned for today.';
    } else {
      hintText = items.length === 1
        ? 'One of your ' + total + ' planned sessions today is still to log.'
        : items.length + ' of your ' + total + ' planned sessions today are still to log.';
    }
    els.body.appendChild(el('p', 'hint', hintText));

    var ul = el('ul', 'flow-plan-list flow-landing-list');
    items.forEach(function(item){
      var li = document.createElement('li');
      li.appendChild(flowPlanCard(item, 'Check in on this →'));
      ul.appendChild(li);
    });
    // Shown rather than hidden, and always after the ones still to log: the
    // athlete gets the whole day at a glance, and the reason a session isn't
    // offered is on the card itself instead of being silently absent. Passing
    // no CTA is what makes it a static, untappable record — see flowPlanCard.
    logged.forEach(function(item){
      var li = document.createElement('li');
      li.appendChild(flowPlanCard(item, null));
      ul.appendChild(li);
    });
    els.body.appendChild(ul);

    // The escape hatch, deliberately named and deliberately secondary — a
    // session that wasn't on the plan is a normal thing to log, not an error
    // state, and Adherence already counts it as `extra` rather than scoring
    // it bad. Copy matches the app's plain button voice ("Add a race",
    // "+ Add session"): no exclamation, no apology.
    var other = el('button', 'flow-landing-other', 'Log an unplanned session');
    other.type = 'button';
    other.addEventListener('click', startUnplannedCheckIn);
    els.body.appendChild(other);
  }
  // Drops into the manual flow exactly as it behaved before any plan
  // integration existed: fresh answers, dated today, step 0, nothing
  // pre-filled — in particular no disc/intensity/duration, and (as
  // everywhere) no a1. Phase 2's per-date planned cards still appear on the
  // date page and still follow a date change; suppressing them here would
  // regress behaviour that is explicitly meant to keep working, and they are
  // a hint rather than a default in that position anyway.
  function startUnplannedCheckIn(){
    state.ans = {date: todayISO()}; state.note = ''; state.step = 0; state.mode = 'ask';
    render();
    focusHeading();
    say('Logging an unplanned session. Nothing pre-filled.');
  }
  // "Nothing has been entered yet" — the flow is sitting at its initial state
  // rather than part-way through a check-in. `state.ans` is seeded with a
  // `date` and nothing else, so any other key means the athlete has answered
  // something. Review and saved are never pristine by definition.
  function flowIsPristine(){
    if(state.mode === 'review' || state.mode === 'saved'){ return false; }
    if(state.note){ return false; }
    // A deliberately changed date IS an entered answer. `date` is skipped by
    // the loop below only because state.ans is *seeded* with today's — but
    // anything other than that seed was typed by the athlete, and calling it
    // pristine let startCheckIn() reset state.ans back to {date: todayISO()},
    // silently discarding a date chosen to log a missed session from earlier
    // in the week. This is startCheckIn()'s only caller, so tightening the
    // definition here has no other reader to surprise.
    if(state.ans.date && state.ans.date !== todayISO()){ return false; }
    var keys = Object.keys(state.ans);
    for(var i = 0; i < keys.length; i++){
      if(keys[i] !== 'date' && state.ans[keys[i]] !== undefined){ return false; }
    }
    return true;
  }
  // The single decision about where a Check-in open lands. Every entry point
  // that opens Check-in without naming a session goes through here, so the nav
  // tab and the return-from-phase-picker path cannot diverge.
  //
  // Two things this deliberately does NOT do. It does not reset a check-in
  // that is already part-way through — tapping away to Review and back has
  // always resumed where you were, and discarding half-entered answers to show
  // a landing screen would be a far worse regression than the screen is an
  // improvement. And it does not touch the no-plan case at all: with nothing
  // planned today there is nothing to frame around, so it falls through to
  // exactly the previous behaviour.
  function startCheckIn(){
    // `.open`, not the raw planned count: with every planned session for
    // today already logged there is nothing left to offer, so the landing
    // screen would be a list of things you cannot do. Falls through to
    // showView('flow') — exactly the pre-landing behaviour.
    if(flowIsPristine() && todayPlanSplit().open.length){
      state.ans = {date: todayISO()}; state.note = ''; state.step = 0; state.mode = 'plan';
      showView('flow');
      // showView only refreshes the chrome, not the body — without this the
      // landing would be announced by the header while the previous screen's
      // questions were still on it.
      render();
      focusHeading();
      return;
    }
    showView('flow');
  }

  function setFlowPhaseLabel(){
    els.phaseLabel.textContent = PERIOD_LABEL[state.periodisation] || 'Phase not set';
    var pillClass = PERIOD_PILL_CLASS[state.periodisation];
    els.phaseLabel.className = 'month-week-pill' + (pillClass ? ' ' + pillClass : '');
  }

  function renderChrome(){
    var list = steps();
    var idx = Math.min(state.step, list.length - 1);
    if(state.mode === 'plan'){
      // No step counter and an empty progress bar: the landing screen sits
      // *before* the flow, so "1 / 6" would be a lie about where they are.
      els.eyebrow.textContent = 'Today';
      els.counter.textContent = '';
      els.barFill.style.width = '0%';
      els.phaseRow.hidden = false;
      setFlowPhaseLabel();
    } else if(state.mode === 'saved'){
      els.eyebrow.textContent = (PERIOD_LABEL[state.periodisation] || 'Phase not set');
      els.counter.textContent = 'logged';
      els.barFill.style.width = '100%';
      els.phaseRow.hidden = true;
    } else if(state.mode === 'review'){
      var gaps = missing().length;
      var totalQuestions = allQuestions(list).length;
      els.eyebrow.textContent = 'Just finished';
      els.counter.textContent = 'review · ' + (totalQuestions - gaps) + '/' + totalQuestions;
      els.barFill.style.width = '100%';
      els.phaseRow.hidden = false;
      setFlowPhaseLabel();
    } else {
      els.eyebrow.textContent = 'Just finished';
      els.counter.textContent = (idx + 1) + ' / ' + list.length;
      els.barFill.style.width = Math.round(idx / list.length * 100) + '%';
      els.phaseRow.hidden = false;
      setFlowPhaseLabel();
    }
    renderFoot(list, idx);
    return {list: list, idx: idx};
  }
  function renderFoot(list, idx){
    // The landing screen's actions are the cards and the unplanned link, so
    // the sticky Back/Next pair is hidden outright rather than disabled — a
    // greyed "Next" on a screen with no next step reads as something broken.
    els.foot.hidden = state.mode === 'plan';
    if(state.mode === 'plan'){ return; }
    if(state.mode === 'saved'){
      els.back.disabled = true;
      els.back.textContent = 'Back';
      els.next.textContent = 'Log another';
    } else if(state.mode === 'review'){
      els.back.disabled = false;
      els.back.textContent = 'Back';
      els.next.textContent = 'Save';
    } else {
      els.back.disabled = idx === 0;
      els.back.textContent = 'Back';
      els.next.textContent = idx === list.length - 1 ? 'Review' : 'Next';
    }
  }
  function render(){
    var c = renderChrome();
    clear(els.body);
    if(state.mode === 'plan'){ renderPlanLanding(); }
    else if(state.mode === 'ask'){ renderAsk(c.list[c.idx]); }
    else if(state.mode === 'review'){ renderReview(c.list); }
    else { renderSaved(); }
    // Prepended after the questions exist, and only on the date page — see
    // renderFlowPlanCards(), which no-ops everywhere else.
    renderFlowPlanCards();
  }
  function choiceGroup(q, idPrefix){
    var wrap = el('div', 'choices-wrap');
    var cls = 'choices';
    if(q.layout === 'grid3'){ cls += ' grid3'; }
    else if(q.layout === 'grid2'){ cls += ' grid2'; }
    var group = el('div', cls);
    q.opts.forEach(function(o){
      var id = idPrefix + '-' + q.k + '-' + o.v;
      var opt = el('div', 'opt');
      var input = document.createElement('input');
      input.type = 'radio';
      input.name = idPrefix + '-q-' + q.k;
      input.id = id;
      input.value = o.v;
      input.checked = state.ans[q.k] === o.v;
      input.addEventListener('change', function(){ pick(q, o.v); });
      opt.appendChild(input);
      var label = el('label', 'choice');
      label.htmlFor = id;
      if(q.tick){
        var tick = el('span', 'tick', '✓');
        tick.setAttribute('aria-hidden', 'true');
        label.appendChild(tick);
      }
      if(o.sev){
        var sev = el('span', 'sev ' + o.sev);
        sev.setAttribute('aria-hidden', 'true');
        label.appendChild(sev);
      }
      label.appendChild(document.createTextNode(o.label));
      opt.appendChild(label);
      group.appendChild(opt);
    });
    wrap.appendChild(group);
    return wrap;
  }
  function dateField(q){
    var wrap = el('div', 'choices-wrap');
    var input = document.createElement('input');
    input.type = 'date';
    input.className = 'date-input';
    input.id = 'o-' + q.k;
    input.max = todayISO();
    input.value = state.ans[q.k] || todayISO();
    input.addEventListener('change', function(){
      if(input.value){ state.ans[q.k] = input.value; }
      renderChrome();
      // The planned-session cards are scoped to the selected date, so they
      // have to follow it. Rebuilt in place rather than via render(), which
      // would recreate this very input and take focus off it mid-edit.
      renderFlowPlanCards();
    });
    wrap.appendChild(input);
    return wrap;
  }
  // Planned sessions for the date currently selected in the flow, shown at the
  // top of the first page. `notes` is rendered in full and unexpanded — the HR
  // cap or the squad set is the reason the plan was typed in at all, and it is
  // wanted at exactly this moment, so it does not sit behind a disclosure the
  // way the Plan view's own card puts it.
  function renderFlowPlanCards(){
    var old = document.getElementById('flow-plan-cards');
    if(old && old.parentNode){ old.parentNode.removeChild(old); }
    if(state.mode !== 'ask'){ return; }
    var list = steps();
    var page = list[Math.min(state.step, list.length - 1)] || [];
    var onDatePage = page.some(function(q){ return q.k === 'date'; });
    if(!onDatePage){ return; }

    var dateISO = state.ans.date || todayISO();
    var items = planItemsFor(dateISO);
    if(!items.length){ return; }

    var wrap = el('section', 'flow-plan');
    wrap.id = 'flow-plan-cards';
    var eyebrowId = 'flow-plan-eyebrow';
    var eyebrow = el('p', 'flow-plan-eyebrow',
      'Planned for ' + (formatDateLabel(dateISO) || '').toLowerCase());
    eyebrow.id = eyebrowId;
    wrap.appendChild(eyebrow);

    var ul = el('ul', 'flow-plan-list');
    ul.setAttribute('aria-labelledby', eyebrowId);
    items.forEach(function(item){
      var li = document.createElement('li');
      li.appendChild(flowPlanCard(item, 'Use these details →'));
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
    els.body.insertBefore(wrap, els.body.firstChild);
  }
  // One planned-session card, shared by the in-flow hint list above and the
  // check-in landing screen below, so the two can never drift into showing
  // different fields for the same session. Only the call-to-action wording
  // differs — a hint offers to fill the form in, the landing screen *is* the
  // way in — so that is the one thing passed in.
  // A null `ctaText` renders the card as a static, untappable record of a
  // session that has already been logged, marked "Logged" where the CTA would
  // be. A <div>, not a disabled <button>, on purpose: there is no action here
  // to re-enable, and a disabled control invites a hunt for the thing that
  // would turn it back on.
  function flowPlanCard(item, ctaText){
    var isLogged = !ctaText;
    var btn = el(isLogged ? 'div' : 'button', 'flow-plan-card' + (isLogged ? ' is-logged' : ''));
    if(!isLogged){ btn.type = 'button'; }

    var hd = el('div', 'flow-plan-hd');
    var dot = el('span', 'flow-plan-dot');
    dot.style.background = 'var(--' + item.disc + ')';
    dot.setAttribute('aria-hidden', 'true');
    hd.appendChild(dot);
    hd.appendChild(el('span', 'flow-plan-title', splashTodayName(item)));
    if(item.key){ hd.appendChild(el('span', 'flow-plan-key', 'Key')); }
    btn.appendChild(hd);

    var meta = planMetaLine(item, false);   // the Key pill above covers it
    if(meta){ btn.appendChild(el('span', 'flow-plan-meta', meta)); }
    if(item.notes){ btn.appendChild(el('span', 'flow-plan-notes', item.notes)); }
    if(isLogged){
      btn.appendChild(el('span', 'flow-plan-logged', 'Logged'));
      return btn;
    }
    btn.appendChild(el('span', 'flow-plan-cta', ctaText));

    // usePlannedSession → applyPlanPrefill, which is the a1-guarded function.
    // Both entry points go through it; neither writes state.ans directly.
    btn.addEventListener('click', function(){ usePlannedSession(item); });
    return btn;
  }
  // qList is a page — one or more questions rendered together. Each keeps
  // its own heading/hint/choices exactly as when it was a lone step; only
  // the first question's heading is the h1 (and the focus/aria-describedby
  // target) so a multi-question page still has one page-level heading.
  function renderAsk(qList){
    qList.forEach(function(q, i){
      var fs = el('fieldset', 'q-set' + (q.hint ? '' : ' no-hint'));
      var lg = document.createElement('legend');
      var h = el(i === 0 ? 'h1' : 'h2', null, q.legend);
      h.id = i === 0 ? 'step-h' : 'step-h-' + q.k;
      h.tabIndex = -1;
      lg.appendChild(h);
      fs.appendChild(lg);
      if(q.hint){
        var hintId = 'step-hint-' + q.k;
        var hint = el('p', 'hint', q.hint);
        hint.id = hintId;
        fs.setAttribute('aria-describedby', hintId);
        fs.appendChild(hint);
      }
      fs.appendChild(q.type === 'date' ? dateField(q) : choiceGroup(q, 'o'));
      els.body.appendChild(fs);
    });
  }
  function renderReview(list){
    var h = el('h1', null, 'Check and save');
    h.id = 'step-h'; h.tabIndex = -1;
    els.body.appendChild(h);
    els.body.appendChild(el('p', 'hint', 'Tap any line to change it. Nothing is saved until you save.'));
    var rows = el('div', 'choices-wrap');
    list.forEach(function(page, pageIdx){
      page.forEach(function(q){
        var btn = el('button', 'review-row');
        btn.type = 'button';
        btn.appendChild(el('span', 'review-q', q.legend.replace(/\?$/, '')));
        var label = q.type === 'date' ? formatDateLabel(state.ans[q.k]) : (optionFor(q, state.ans[q.k]) || {}).label;
        var a = el('span', 'review-a' + (label ? '' : ' none'), label || 'Not answered');
        btn.appendChild(a);
        btn.addEventListener('click', function(){ go(pageIdx, true); });
        rows.appendChild(btn);
      });
    });
    els.body.appendChild(rows);
    rows.appendChild(noteBlock());
  }
  function noteBlock(){
    var frag = document.createDocumentFragment();
    var lbl = el('label', 'note-lbl');
    lbl.htmlFor = 'note';
    lbl.appendChild(document.createTextNode('Anything to add? '));
    lbl.appendChild(el('span', 'sub', 'Optional — not scored, just surfaced back to you.'));
    frag.appendChild(lbl);
    var ta = document.createElement('textarea');
    ta.id = 'note'; ta.rows = 2; ta.maxLength = 280;
    ta.placeholder = 'e.g. left calf tight from 20 min · gut off after gel 4';
    ta.value = state.note;
    ta.addEventListener('input', function(){ state.note = ta.value; });
    frag.appendChild(ta);
    return frag;
  }
  function renderSaved(){
    var flag = el('p', 'saved-flag');
    var g = el('span', 'g', '✓');
    g.setAttribute('aria-hidden', 'true');
    flag.appendChild(g);
    flag.appendChild(document.createTextNode('Session logged'));
    els.body.appendChild(flag);
    var h = el('h1', null, 'Your week so far');
    h.id = 'step-h'; h.tabIndex = -1; h.style.marginTop = '10px';
    els.body.appendChild(h);
    var n = loggedCountThisWeek();
    var lead = n >= WEEK_FLOOR
      ? 'That is ' + n + ' logged this week — enough for the roll-up to compute rather than rely on recall.'
      : 'This one is number ' + n + ' this week. ' + (WEEK_FLOOR - n) + ' more and the week computes rather than gets recalled.';
    els.body.appendChild(el('p', 'week-lead', lead));
    var days = currentWeekDays();
    var todayStr = todayISO();
    var ul = el('ul', 'week-list');
    ul.setAttribute('aria-label', 'Your week');
    days.forEach(function(d){
      var isToday = d.date === todayStr;
      var li = el('li', 'week-row' + (isToday && d.state === 'logged' ? ' is-now' : ''));
      if(isToday){ li.setAttribute('aria-current', 'true'); }
      li.appendChild(el('span', 'week-day', d.day));
      if(d.what){ li.appendChild(el('span', 'week-what', d.what)); }
      var stateText = '', stateCls = 'week-state';
      if(d.state === 'logged'){ stateText = (isToday ? '✓ logged today' : '✓ logged'); stateCls += ' done'; }
      else if(d.state === 'upcoming'){ stateText = 'not yet'; }
      else { stateText = 'not logged'; }
      li.appendChild(el('span', stateCls, stateText));
      ul.appendChild(li);
    });
    els.body.appendChild(ul);
    var card = el('div', 'floor-card');
    var top = el('div', 'floor-top');
    top.appendChild(el('p', 'floor-title', 'Toward a computed week'));
    top.appendChild(el('p', 'floor-count', n + ' / ' + WEEK_FLOOR + ' sessions'));
    card.appendChild(top);
    var bar = el('div', 'bar');
    bar.setAttribute('aria-hidden', 'true');
    var fill = document.createElement('i');
    fill.style.width = Math.min(100, Math.round(n / WEEK_FLOOR * 100)) + '%';
    bar.appendChild(fill);
    card.appendChild(bar);
    card.appendChild(el('p', 'floor-note', n >= WEEK_FLOOR
      ? 'Drift, execution, fuelling and state all have enough to run on.'
      : WEEK_FLOOR + ' logged sessions is the floor for a computed week — ' + Math.round(WEEK_FLOOR_FRACTION*100) + '% of a notional ' + PLANNED_SESSIONS_PER_WEEK + '-session week. Under that, the roll-up degrades to recall.'));
    els.body.appendChild(card);
  }

  // ═══════════════════════════════════════════════════════════════
  // SAVE
  // ═══════════════════════════════════════════════════════════════
  function save(){
    var gaps = missing();
    if(gaps.length){
      var list = steps();
      var first = pageIndexOfKey(list, gaps[0].k);
      go(first, false);
      say('Cannot save yet — ' + gaps.length + ' question' + (gaps.length===1?'':'s') + ' unanswered. Taken to the first one.');
      return;
    }
    var a = state.ans;
    var dur = parseInt(a.duration, 10);
    var entry = {
      date: a.date || todayISO(),
      disc: a.disc, intensity: a.intensity, duration: dur,
      a1: a.a1, a2: a.a2, a3: dur > 45 ? a.a3 : null,
      rpe: parseInt(a.rpe, 10), b2: a.b2, b3: a.b3,
      note: state.note.trim(), phase: state.periodisation,
      loggedAt: Date.now()
    };
    log.push(entry);
    persistLog();
    submitSessionToSheet(entry);
    state.mode = 'saved';
    render();
    var n = loggedCountThisWeek();
    showView('dashboard', 'Session saved. ' + n + ' of ' + WEEK_FLOOR + ' sessions logged this week. Showing this week’s dashboard.');
  }
  function startNew(){
    state.ans = {date: todayISO()}; state.note = ''; state.step = 0; state.mode = 'ask';
    render(); focusHeading();
    say('New session started. Step 1 of ' + steps().length + '.');
  }

  // ═══════════════════════════════════════════════════════════════
  // VIEW SWITCHING
  // ═══════════════════════════════════════════════════════════════
  function showView(view, announceMsg){
    var isDash = view === 'dashboard';
    var isTrends = view === 'trends';
    var isStrength = view === 'strength';
    var isWarmup = view === 'warmup';
    var isRaces = view === 'races';
    var isPlan = view === 'plan';
    // isFlow is "none of the named views" — every new view must be added to
    // this chain, or the check-in flow renders underneath it as well.
    var isFlow = !isDash && !isTrends && !isStrength && !isWarmup && !isRaces && !isPlan;
    els.viewFlow.hidden = !isFlow;
    els.viewDash.hidden = !isDash;
    els.viewTrends.hidden = !isTrends;
    els.viewStrength.hidden = !isStrength;
    els.viewWarmup.hidden = !isWarmup;
    els.viewRaces.hidden = !isRaces;
    els.viewPlan.hidden = !isPlan;
    els.tabFlow.setAttribute('aria-selected', String(isFlow));
    els.tabDash.setAttribute('aria-selected', String(isDash));
    els.tabStrength.setAttribute('aria-selected', String(isStrength));
    els.tabWarmup.setAttribute('aria-selected', String(isWarmup));
    els.tabRaces.setAttribute('aria-selected', String(isRaces));
    if(isDash){ renderDashboard(); }
    if(isTrends){ renderTrends(); }
    if(isStrength){ sizeStrengthFrame(); }
    if(isWarmup){ renderWarmup(); }
    if(isRaces){ renderRaces(); }
    if(isPlan){ renderPlan(); }
    // The flow's own chrome (eyebrow, phase row) reads state.periodisation,
    // which can change out from under it — e.g. via "Change phase" mid-flow
    // — so refresh it whenever this view is (re)shown, not just on render().
    if(isFlow){ renderChrome(); }
    window.scrollTo(0, 0);
    var h = document.getElementById(isDash ? 'dash-h' : (isTrends ? 'trends-h' : (isStrength ? 'strength-h' : (isWarmup ? 'warmup-h' : (isRaces ? 'races-h' : (isPlan ? 'plan-h' : 'step-h'))))));
    if(h){ h.focus({preventScroll:true}); }
    if(announceMsg){ say(announceMsg); }
    refreshVisibleViewFromSheet();
  }
  // This week / Month / Races all reflect state that can change on another
  // device, so pull the current source of truth every time the relevant
  // view is opened, then silently redraw in place if it changed anything
  // (no scroll/focus jump — the user is already looking at this view).
  // Also called on visibilitychange (see Init below): an installed PWA can
  // be resumed from a frozen background state on iOS rather than doing a
  // fresh page load, so neither the tab-click handler nor the app-boot
  // fetch fires — without this, a phone left sitting on Races (or This
  // week/Month) would keep showing whatever was cached from before another
  // device added or removed something.
  function refreshVisibleViewFromSheet(){
    // The splash can still be up here: an installed PWA resumed from a frozen
    // background never re-boots, so nothing else would re-check the Sheet
    // while the athlete is sitting on it. That matters more than it used to —
    // the Today card now decides whether to *offer* a session based on the
    // log, so a stale card is not merely out of date, it re-opens the exact
    // duplicate-entry defect the open/logged split exists to close.
    if(!els.splashScreen.hidden){
      refreshLogFromSheet().then(function(changed){
        if(changed && !els.splashScreen.hidden){ renderSplashToday(); }
      });
      refreshPlanFromSheet().then(function(changed){
        if(changed && !els.splashScreen.hidden){ renderSplashToday(); }
      });
    }
    if(!els.viewDash.hidden || !els.viewTrends.hidden){
      refreshLogFromSheet().then(function(changed){
        if(!changed){ return; }
        if(!els.viewDash.hidden){ renderDashboard(); }
        if(!els.viewTrends.hidden){ renderTrends(); }
      });
    }
    if(!els.viewRaces.hidden){
      refreshRacesFromSheet().then(function(changed){
        if(changed && !els.viewRaces.hidden){ renderRaces(); }
        renderSplashCountdown();
      });
    }
    if(!els.viewPlan.hidden){
      refreshPlanFromSheet().then(function(changed){
        if(!changed || els.viewPlan.hidden){ return; }
        // Fresh data is already in `plan` and persisted by here — but hold
        // the redraw while the athlete is part-way through something.
        // planFormOpenFor / planCopyOpen keep those panels *open* across a
        // rebuild, but nothing would keep the half-typed values or the
        // ticked target weeks inside them, so re-rendering underneath the
        // athlete mid-entry would wipe the work. The view picks the new
        // data up as soon as the panel is submitted or closed.
        if(planFormOpenFor || planCopyOpen){ return; }
        renderPlan();
      });
    }
  }
  function goToMonth(signal){ state.monthSignal = signal; showView('trends'); }

  // The swim-strength mini-app is same-origin (a sibling folder), so its
  // document height can be read directly — no postMessage handshake needed.
  // Sized on load and whenever the tab is shown, since [hidden] suppresses
  // iframe layout and a stale height would otherwise stick.
  function sizeStrengthFrame(){
    var f = els.strengthFrame;
    if(!f) return;
    try{
      var doc = f.contentDocument;
      // documentElement.scrollHeight collapses to 0 while the iframe's own
      // box is still 0-tall (e.g. first load behind [hidden]); body.scrollHeight
      // reflects the real laid-out content height regardless, so prefer it.
      var h = doc && doc.body ? Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight) : 0;
      if(h > 0){ f.style.height = h + 'px'; }
    } catch(e){ /* cross-origin fallback: leave last-known height */ }
  }

  // The tab bar is visible even on the splash and the one-time phase screen —
  // tapping a tab from either dismisses it (without forcing a phase choice)
  // and jumps straight to the requested view. There's no timer on the splash;
  // it only goes away once a tab is tapped.
  function revealPostSplashScreen(){
    if(state.periodisation){ els.appMain.hidden = false; }
    else{ els.periodScreen.hidden = false; }
  }
  function exitSplash(){
    if(!els.splashScreen.hidden){
      els.splashScreen.hidden = true;
      revealPostSplashScreen();
    }
  }
  function exitPeriodScreen(){
    if(!els.periodScreen.hidden){
      els.periodScreen.hidden = true;
      els.appMain.hidden = false;
    }
  }
  // Check-in is the one tab that needs a phase to make sense of what it logs,
  // so — unlike the other three tabs — it doesn't bypass the phase question.
  // If no phase is set yet, tapping Check-in (from the splash or anywhere
  // else) lands on the phase question first; choosing one there returns
  // straight to Check-in via phaseReturnView.
  els.tabFlow.addEventListener('click', function(){
    exitSplash();
    if(!state.periodisation){
      els.appMain.hidden = true;
      els.periodScreen.hidden = false;
      phaseReturnView = 'flow';
      // The picker is a gate on the way *in* here, so the landing decision
      // still applies once a phase is chosen — unlike the in-flow
      // "Change phase" link, which clears this.
      phaseReturnWantsLanding = true;
      var h = document.getElementById('period-h');
      if(h){ h.focus({preventScroll:true}); }
      return;
    }
    exitPeriodScreen();
    // Not showView('flow') directly — startCheckIn decides whether today's
    // plan earns the landing screen. This is also the path a Check-in tap
    // from the splash takes, since the nav sits under it.
    startCheckIn();
  });
  els.tabDash.addEventListener('click', function(){ exitSplash(); exitPeriodScreen(); showView('dashboard'); });
  els.tabStrength.addEventListener('click', function(){ exitSplash(); exitPeriodScreen(); showView('strength'); });
  els.tabWarmup.addEventListener('click', function(){ exitSplash(); exitPeriodScreen(); showView('warmup'); });
  els.tabRaces.addEventListener('click', function(){ exitSplash(); exitPeriodScreen(); showView('races'); });
  els.strengthFrame.addEventListener('load', sizeStrengthFrame);
  window.addEventListener('resize', function(){ if(!els.viewStrength.hidden){ sizeStrengthFrame(); } });

  // Strength tab holds two same-origin mini-apps (swim dryland vs. ride/run
  // circuit) in one iframe; switching disciplines just swaps the src rather
  // than juggling two iframes, since only one is ever visible at a time.
  var STRENGTH_APPS = {
    swim: { src: 'TRI-swim-strength mobile app/index.html', title: 'Swim strength session' },
    run:  { src: 'TRI-run-strength mobile app/index.html', title: 'Ride and run strength session' }
  };
  function setStrengthDiscipline(disc){
    var cfg = STRENGTH_APPS[disc];
    if(els.strengthFrame.getAttribute('src') !== cfg.src){
      els.strengthFrame.src = cfg.src;
      els.strengthFrame.title = cfg.title;
    }
    els.tabStrengthSwim.setAttribute('aria-selected', String(disc === 'swim'));
    els.tabStrengthRun.setAttribute('aria-selected', String(disc === 'run'));
  }
  els.tabStrengthSwim.addEventListener('click', function(){ setStrengthDiscipline('swim'); });
  els.tabStrengthRun.addEventListener('click', function(){ setStrengthDiscipline('run'); });

  // ═══════════════════════════════════════════════════════════════
  // TRAINING PHASE PICKER — asked once on first use; re-openable from the
  // dashboard's "Change phase" link at any time.
  // ═══════════════════════════════════════════════════════════════
  function buildPeriodChoices(){
    clear(els.periodChoices);
    PERIOD.forEach(function(p){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice';
      btn.textContent = p.label;
      btn.addEventListener('click', function(){ choosePeriod(p.v); });
      els.periodChoices.appendChild(btn);
    });
  }
  function openPhasePicker(){
    // Reached from the in-flow "Change phase" link, so this is a detour out of
    // a check-in already in progress, not a way into one. Decision 19's rule
    // is that it returns to the question you were on — so it must NOT come
    // back through the landing screen, even when the flow happens to be
    // pristine and today has a plan.
    phaseReturnWantsLanding = false;
    phaseReturnView = els.viewDash.hidden ? (els.viewTrends.hidden ? 'flow' : 'trends') : 'dashboard';
    els.appMain.hidden = true;
    els.periodScreen.hidden = false;
    var h = document.getElementById('period-h');
    if(h){ h.focus({preventScroll:true}); }
  }
  function choosePeriod(v){
    state.periodisation = v;
    persistPhase(v);
    els.periodScreen.hidden = true;
    els.appMain.hidden = false;
    say('Training phase set to ' + PERIOD_LABEL[v] + '.');
    // A splash card tap (Today or Earlier-this-week) by an athlete with no
    // phase set yet is held in pendingPlanPrefill across the picker, so the
    // tap still lands where it was aimed instead of dropping them on a blank
    // check-in. Dated from the held session's own day, same as
    // startCheckInFromPlan() — not always today, once Earlier-this-week rows
    // can hold it too.
    if(pendingPlanPrefill && phaseReturnView === 'flow'){
      var held = pendingPlanPrefill;
      pendingPlanPrefill = null;
      state.ans = {date: held.date}; state.note = ''; state.step = 0; state.mode = 'ask';
      applyPlanPrefill(held);
      showView('flow');
      goToNextUnanswered();
      return;
    }
    pendingPlanPrefill = null;
    // Only when the picker was a gate *on the way into* Check-in (the nav tab
    // with no phase set yet) does the landing decision apply — otherwise an
    // athlete who set their phase on the way in would silently miss the screen
    // an athlete who already had one would see. The in-flow "Change phase"
    // link clears this flag, so it still returns to the question you were on.
    if(phaseReturnView === 'flow' && phaseReturnWantsLanding){
      phaseReturnWantsLanding = false;
      startCheckIn();
      return;
    }
    phaseReturnWantsLanding = false;
    showView(phaseReturnView);
  }

  // ═══════════════════════════════════════════════════════════════
  // WIRING
  // ═══════════════════════════════════════════════════════════════
  els.back.addEventListener('click', function(){
    // The foot is hidden in 'plan' mode, but guard the handlers too — a
    // hidden button is still reachable programmatically, and Back from the
    // landing screen would drop into step 0 with no pre-fill, silently
    // bypassing the choice the screen exists to offer.
    if(state.mode === 'plan'){ return; }
    if(state.mode === 'saved'){ return; }
    var list = steps();
    if(state.mode === 'review'){ go(list.length - 1, true); }
    else { go(state.step - 1, true); }
  });
  els.next.addEventListener('click', function(){
    if(state.mode === 'plan'){ return; }   // see the Back handler above
    if(state.mode === 'saved'){ startNew(); return; }
    if(state.mode === 'review'){ save(); return; }
    go(state.step + 1, true);
  });
  els.phaseChange.addEventListener('click', function(){ openPhasePicker(); });

  // ── Init ──────────────────────────────────────────────────────
  buildPeriodChoices();
  render();
  // The splash (visible by default in markup) covers the period/app-main
  // screens until a nav tap dismisses it — see exitSplash — so neither is
  // revealed here.
  // Warm the cache from the Sheet right away so This week/Month have fresh
  // data as soon as they're opened, even though the check-in flow (the
  // default view) doesn't need it itself.
  // Repaints the Today card on resolve as well: since it started splitting
  // today's plan into still-to-log and already-logged, it reads the *log* as
  // well as the plan, so a session logged on another device would otherwise
  // keep being offered here until something else forced a rebuild. Both this
  // chain and the plan chain below repaint independently — renderSplashToday()
  // removes and rebuilds its own node, so a double call is idempotent.
  refreshLogFromSheet().then(function(){ renderSplashToday(); });
  // Same idea for races — paint the cached countdown on the splash
  // immediately, then refresh from the Sheet and repaint if it changed.
  renderSplashCountdown();
  refreshRacesFromSheet().then(function(changed){ if(changed){ renderSplashCountdown(); } });
  // Same for the plan: paint today's card from the localStorage cache
  // immediately so the splash isn't blank while the fetch is in flight, then
  // repaint once the Sheet answers. Always repaint on resolve, not only when
  // `changed` is true — a first load with an empty cache paints nothing, and
  // that is exactly the case the Sheet is about to fill in.
  renderSplashToday();
  refreshPlanFromSheet().then(function(){ renderSplashToday(); });
  // An installed PWA (iOS "Add to Home Screen") can resume from a frozen
  // background state instead of a real page load, so a phone left sitting
  // on This week/Month/Races would otherwise never re-check the Sheet after
  // another device changes something. Re-sync whichever view is on screen
  // whenever the app regains foreground.
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden){ refreshVisibleViewFromSheet(); }
  });
})();
</script>
</body>
</html>
