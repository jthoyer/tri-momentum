      root.appendChild(raceListSection('Past', past, {emptyText: ''}));
    }
  }
  function renderSplashCountdown(){
    var next = nextRace();
    if(!next){ els.splashCountdown.hidden = true; return; }
    els.splashCountdownRace.textContent = next.name;
    var days = daysUntil(next.date);
    els.splashCountdownTime.textContent = raceCountdownLabel(days) + (days >= 7 ? ' to go' : '');
    els.splashCountdown.hidden = false;
  }

  // Splash "Today" card — sibling of the countdown above. Today's own state
  // is one of three:
  //
  //   sessions planned today   → one tappable line per session
  //   week has a plan, today doesn't → "Rest day" (a real, useful answer —
  //                              a planned rest is not the same as no plan)
  //   week has no plan at all  → node removed from the DOM entirely
  //
  // A fourth, independent section — "Earlier this week" — appends below
  // whichever of those three renders, listing any still-open (not yet
  // logged) sessions from earlier days in the same week, each tappable into
  // the same check-in flow a today row uses (see startCheckInFromPlan,
  // splashPreviousOpenItems). It is independent of Today's own state on
  // purpose: a rest day today says nothing about whether Monday's session
  // ever got logged, so the two must be able to appear together.
  //
  // The third state is a removal rather than the countdown's [hidden] toggle
  // on purpose: an athlete who has never entered a plan should find no trace
  // of the feature on the splash, not an empty shell. Rebuilt from scratch on
  // every call, so a Sheet refresh landing while the splash is still up
  // repaints it correctly without any diffing.
  function renderSplashToday(){
    var existing = document.getElementById('splash-today');
    if(existing && existing.parentNode){ existing.parentNode.removeChild(existing); }

    var weekItems = planItemsInWeek(isoDate(mondayOf(new Date())));
    if(!weekItems.length){ return; }
    // Same split the Check-in landing uses, from the same source — see
    // todayPlanSplit(), which defers to planDayResults(), the matcher the
    // Adherence signal itself runs on. Deliberately not a second rule here:
    // this card had the identical defect the landing screen was fixed for,
    // and two independent "has it been logged?" tests could disagree.
    // open.length + logged.length is exactly planItemsFor(today).length, so
    // the card's three existing states keep their own trigger conditions
    // untouched — "Rest day" is still "the week has a plan but today has
    // nothing in it", never "today is planned and already done".
    var split = todayPlanSplit();
    var open = split.open, logged = split.logged;
    // Still-open sessions from earlier days in the same week — see
    // splashPreviousOpenItems(). This no longer returns on the Rest-day
    // branch below: a rest day today doesn't mean nothing is owed from
    // earlier in the week, so both sections have to be able to coexist.
    var prevOpen = splashPreviousOpenItems();

    var card = el('div', 'splash-today');
    card.id = 'splash-today';
    card.appendChild(el('p', 'splash-today-eyebrow', 'Today'));

    if(!open.length && !logged.length){
      card.appendChild(el('p', 'splash-today-rest', 'Rest day'));
    } else {
      var list = el('ul', 'splash-today-list');
      list.setAttribute('aria-label', 'Planned sessions for today');
      // Still to log first, already logged after — the same order the landing
      // screen uses. Unlike the landing, an all-logged day still renders the
      // card rather than disappearing: this is an informational surface as
      // well as an action prompt (decision 29 already treats "Rest day" as an
      // answer worth showing), so it keeps telling the athlete what today was.
      open.forEach(function(item){ list.appendChild(splashTodayRow(item, false)); });
      logged.forEach(function(item){ list.appendChild(splashTodayRow(item, true)); });
      card.appendChild(list);
    }

    if(prevOpen.length){
      var prevWrap = el('div', 'splash-prev');
      prevWrap.appendChild(el('p', 'splash-today-eyebrow', 'Earlier this week'));
      var prevList = el('ul', 'splash-today-list');
      prevList.setAttribute('aria-label', 'Planned sessions earlier this week still to log');
      // Chronological (Monday first) — currentWeekDays() is already in that
      // order and splashPreviousOpenItems() walks it without re-sorting.
      prevOpen.forEach(function(item){ prevList.appendChild(splashPrevRow(item)); });
      prevWrap.appendChild(prevList);
      card.appendChild(prevWrap);
    }

    els.splashScreen.appendChild(card);
  }
  // Each session is its own row with its own action rather than one tap target
  // for the whole card: with two sessions planned, a single card-level tap
  // would have to guess which one was just finished, and guessing wrong writes
  // the wrong discipline into a check-in.
  //
  // An already-logged session renders as a <div>, not a disabled <button> —
  // mirroring flowPlanCard()'s own rule, for its own reason: there is no
  // action here to re-enable, and a disabled control invites a hunt for the
  // thing that would turn it back on. The visual treatment can't be shared
  // with flowPlanCard: that card is light-on-light (--s1/--s3 fills, --ink
  // text) and this one sits on the splash's --blue field, so the two have no
  // usable colours in common. The copy ("Logged"), the div-not-button rule and
  // the after-the-open-ones ordering are what's kept identical.
  function splashTodayRow(item, isLogged){
    var li = el('li', 'splash-today-item');
    var row = el(isLogged ? 'div' : 'button', 'splash-today-btn' + (isLogged ? ' is-logged' : ''));
    if(!isLogged){ row.type = 'button'; }
    row.appendChild(el('span', 'splash-today-name', splashTodayName(item)));
    row.appendChild(el('span', 'splash-today-meta', planMetaLine(item)));
    if(isLogged){
      row.appendChild(el('span', 'splash-today-logged', 'Logged'));
    } else {
      row.addEventListener('click', function(){ startCheckInFromPlan(item); });
    }
    li.appendChild(row);
    return li;
  }
  function splashTodayName(item){
    var disc = DISC_LABEL[item.disc] || item.disc;
    return item.title ? (disc + ' — ' + item.title) : disc;
  }
  // Still-open (not-yet-logged) sessions from days before today in the
  // current week — the same week the "no plan anywhere this week" check
  // above is scoped to, so this never reaches back further than the card
  // already shows. Uses dayPlanSplit() per day rather than a hand-rolled
  // "any log entry that day" test, for the same reason todayPlanSplit()
  // does: a second rule could disagree with the Adherence matcher about
  // what's already logged, and tapping a session that's secretly already
  // logged would write a duplicate — the exact defect decisions 32(b)/34
  // fixed on the other two plan surfaces.
  function splashPreviousOpenItems(){
    var todayI = todayISO();
    var out = [];
    currentWeekDays().forEach(function(d){
      if(d.date >= todayI){ return; }
      dayPlanSplit(d.date).open.forEach(function(item){ out.push(item); });
    });
    return out;
  }
  // One row per earlier-week session still to log — same shape as
  // splashTodayRow(item, false) with a day label stacked above the name, so
  // tapping it can't be mistaken for tapping a today row. Always a <button>:
  // splashPreviousOpenItems() only ever returns open sessions, never logged
  // ones, so there is no is-logged state to render here.
  function splashPrevRow(item){
    var li = el('li', 'splash-today-item');
    var row = el('button', 'splash-today-btn');
    row.type = 'button';
    var d = new Date(item.date + 'T00:00:00');
    var dateLbl = el('span', 'splash-prev-date', MONTH_DAYS[(d.getDay() + 6) % 7] + ' ' + d.getDate());
    // Visible label is abbreviated ("MON 18"); screen readers get the full
    // weekday date, the same split decision 31's dashPlanDay() uses.
    dateLbl.setAttribute('aria-label', formatWeekdayDate(item.date));
    row.appendChild(dateLbl);
    row.appendChild(el('span', 'splash-today-name', splashTodayName(item)));
    row.appendChild(el('span', 'splash-today-meta', planMetaLine(item)));
    // Same flow as tapping a today row: startCheckInFromPlan() dates the
    // check-in from item.date rather than assuming today, so this lands on a
    // fresh check-in dated the day the session was actually planned for.
    row.addEventListener('click', function(){ startCheckInFromPlan(item); });
    li.appendChild(row);
    return li;
  }
  // "60 min · Hard / quality · Key" — the same fields planItemCard() shows in
  // the Plan view, in the same order, so the two surfaces read identically.
  // includeKey is false wherever a surface already shows the standalone "Key"
  // pill (the in-flow card does; the splash card has no room for one), so the
  // word never appears twice on the same card.
  function planMetaLine(item, includeKey){
    var bits = [];
    if(item.duration != null){ bits.push(planDurationLabel(item.duration)); }
    if(item.intensity){ bits.push(PLAN_INTENSITY_LABEL[item.intensity] || item.intensity); }
    if(item.key && includeKey !== false){ bits.push('Key'); }
    return bits.join(' · ');
  }
  // The single-line form used by the Review week list: the discipline and
  // title, then planMetaLine's fields. Built on planMetaLine rather than
  // re-listing duration/intensity, so this row can never word the same facts
  // differently from the splash and check-in cards.
  function planSummaryLine(item){
    var head = DISC_LABEL[item.disc] || item.disc;
    if(item.title){
      // An em-dash separates discipline from title — except when the title
      // already contains one, which is the common case here rather than an
      // edge case (the add-session form's own placeholder is "Squad — 8×100
      // CSS"). Left alone it renders "Swim — Squad — 8×100 CSS", two dashes
      // both trying to set off a clause: the same punctuation collision
      // decision 30 fixed in the missed-key-session headline.
      head += (item.title.indexOf('—') === -1 ? ' — ' : ' · ') + item.title;
    }
    // includeKey false — the standalone "Key" pill sits beside this text.
    var meta = planMetaLine(item, false);
    return meta ? (head + ' · ' + meta) : head;
  }

  // ═══════════════════════════════════════════════════════════════
  // TRAINING PLAN
  //
  // A manually-entered copy of the athlete's own plan — the app never
  // authors, suggests or adjusts a session. Rows are stored against real
  // ISO dates (not a cycle-relative template), so joining a planned session
  // to a logged one is a plain date equality test.
  // ═══════════════════════════════════════════════════════════════
  var MAX_COPY_WEEKS = 8;
  // Reused straight off the check-in questions rather than re-declared, so
  // the planned enum and the logged enum can never drift apart — a future
  // planned-vs-actual match is then an equality test, not a mapping table.
  var PLAN_DISC_OPTS = QUESTIONS_BY_KEY.disc.opts;
  var PLAN_INTENSITY_OPTS = QUESTIONS_BY_KEY.intensity.opts;
  var PLAN_INTENSITY_LABEL = {};
  PLAN_INTENSITY_OPTS.forEach(function(o){ PLAN_INTENSITY_LABEL[o.v] = o.label; });

  // Which day's add-session form is open ('YYYY-MM-DD' or null) — module
  // state, never derived from the DOM, because renderPlan() fully rebuilds
  // the view (including on a background Sheet refresh) and a half-filled
  // form must not silently snap shut. Same reason raceFormOpen exists.
  var planFormOpenFor = null;
  // The copy-week panel needs the same protection for the same reason: it's
  // a multi-step selection (tick N target weeks, then confirm) rebuilt by
  // renderPlan(), so a background refresh mid-selection would snap it shut
  // and clear the ticks. Tracked here, and honoured by the re-render guard
  // in refreshVisibleViewFromSheet() alongside planFormOpenFor.
  var planCopyOpen = false;
  // When set, the open day's form is an *edit* of this planned session rather
  // than a blank add. Held alongside planFormOpenFor rather than derived from
  // it, for the same reason planFormOpenFor isn't derived from the DOM:
  // renderPlan() rebuilds the whole view, including on a background Sheet
  // refresh, and a half-edited form must not silently turn back into an add.
  // Only ever non-null while planFormOpenFor is set, so the existing
  // re-render guard in refreshVisibleViewFromSheet() already covers it.
  var planEditingId = null;
  // A save that has to close its own form still owes the athlete a reason.
  // {date, message} or null, rendered by planDayRow() using the *same*
  // .plan-form-error / role="alert" node the form itself uses — it just has
  // to outlive the form, because the form is what's being taken away.
  // Deliberately not cleared by a render: a background Sheet refresh must
  // not wipe the message before it has been read. It is cleared by the next
  // plan action instead (opening a form, changing week, any mutation).
  var planNotice = null;
  function clearPlanNotice(){ planNotice = null; }

  function planWeekDates(mondayISO){
    var monday = new Date(mondayISO + 'T00:00:00');
    var out = [];
    for(var i = 0; i < 7; i++){ out.push(isoDate(addDays(monday, i))); }
    return out;
  }
  function planItemsFor(dateISO){
    return plan.filter(function(p){ return p.date === dateISO; });
  }
  function planItemsInWeek(mondayISO){
    var dates = planWeekDates(mondayISO);
    var from = dates[0], to = dates[6];
    return plan.filter(function(p){ return p.date >= from && p.date <= to; });
  }
  function loggedCountInWeek(mondayISO){
    var dates = planWeekDates(mondayISO);
    var from = dates[0], to = dates[6];
    return log.filter(function(e){ return e.date >= from && e.date <= to; }).length;
  }
  function planDurationLabel(mins){
    return mins == null ? '' : (mins + ' min');
  }

  function addPlanSession(dateISO, fields){
    var item = {
      id: newPlanId(), date: dateISO, disc: fields.disc,
      title: (fields.title || '').trim(),
      intensity: fields.intensity || 'easy',
      duration: fields.duration,
      key: !!fields.key,
      notes: (fields.notes || '').trim(),
      phase: state.periodisation || ''
    };
    plan.push(item);
    persistPlan();
    submitPlanToSheet('add', item);
    clearPlanNotice();
    renderPlan();
    say('Planned ' + (DISC_LABEL[item.disc] || item.disc) + ' added for ' + formatDateLabel(dateISO) + '.');
    return item;
  }
  // Edits an existing planned session in place. Note what it does NOT change:
  // `id`, `date` and `phase`. id and date are excluded on both sides — here,
  // and structurally in Code.gs, where an update writes only the Disc..Phase
  // column block (see PLAN_EDITABLE_COL). Moving a session to another day is
  // the drag-and-drop calendar editing this feature has always excluded
  // (CLAUDE.md, "What not to build"), so delete-and-re-add stays the way to
  // change a date. `phase` is left alone because it records the phase the
  // session was *planned* in — retyping its duration months later must not
  // silently restamp it with whatever phase is current now.
  function updatePlanSession(id, fields){
    var item = plan.filter(function(p){ return p.id === id; })[0];
    // The row is gone — removed on another device, or it only ever existed
    // in a localStorage cache written before Code.gs was redeployed. A bare
    // `return null` here left the athlete's edits sitting in an open form
    // that would never save, with nothing on screen to say so. Say it, then
    // take the dead form away rather than leaving it to be retyped into.
    if(!item){
      planNotice = {
        date: planFormOpenFor,
        message: 'This session is no longer in your plan — it may have been removed on another device. Your changes were not saved.'
      };
      planFormOpenFor = null;
      planEditingId = null;
      renderPlan();
      say('That session is no longer in your plan. Your changes were not saved.');
      return null;
    }
    // Mutated on the existing object rather than replaced with a freshly
    // built one, so every field this function doesn't name carries over by
    // construction — a new field added to a plan item later can't be
    // silently dropped by an edit.
    item.disc = fields.disc;
    item.title = (fields.title || '').trim();
    item.intensity = fields.intensity || 'easy';
    item.duration = fields.duration;
    item.key = !!fields.key;
    item.notes = (fields.notes || '').trim();
    persistPlan();
    submitPlanToSheet('update', item);
    planFormOpenFor = null;
    planEditingId = null;
    clearPlanNotice();
    renderPlan();
    say('Updated ' + (item.title || DISC_LABEL[item.disc] || 'session') + ' on ' + formatDateLabel(item.date) + '.');
    return item;
  }
  function deletePlanSession(id){
    var item = plan.filter(function(p){ return p.id === id; })[0];
    plan = plan.filter(function(p){ return p.id !== id; });
    persistPlan();
    submitPlanToSheet('delete', {id: id});
    renderPlan();
    if(item){ say('Removed ' + (item.title || DISC_LABEL[item.disc] || 'session') + ' from the plan.'); }
  }
  // One batched request for the whole copy, however many target weeks —
  // this is what addBatch exists for. Dates are shifted by whole weeks, so
  // a Tuesday session stays a Tuesday session.
  function copyPlanWeek(targetMondays){
    var source = planItemsInWeek(state.planWeek);
    if(!source.length || !targetMondays.length){ return 0; }
    var sourceMonday = new Date(state.planWeek + 'T00:00:00');
    var created = [];
    targetMondays.forEach(function(targetISO){
      var offset = Math.round((new Date(targetISO + 'T00:00:00') - sourceMonday) / 86400000);
      source.forEach(function(p){
        created.push({
          id: newPlanId(), date: isoDate(addDays(new Date(p.date + 'T00:00:00'), offset)),
          disc: p.disc, title: p.title, intensity: p.intensity, duration: p.duration,
          key: p.key, notes: p.notes, phase: p.phase
        });
      });
    });
    plan = plan.concat(created);
    persistPlan();
    submitPlanToSheet('addBatch', null, {items: created});
    renderPlan();
    say(created.length + ' planned session' + (created.length === 1 ? '' : 's') + ' copied to ' +
        targetMondays.length + ' week' + (targetMondays.length === 1 ? '' : 's') + '.');
    return created.length;
  }
  // One batched request, by date range rather than by id list — re-entering
  // a changed week must not cost N separate deletes.
  function clearPlanWeek(){
    var dates = planWeekDates(state.planWeek);
    var from = dates[0], to = dates[6];
    var removed = planItemsInWeek(state.planWeek).length;
    if(!removed){ return 0; }
    plan = plan.filter(function(p){ return !(p.date >= from && p.date <= to); });
    persistPlan();
    submitPlanToSheet('deleteWeek', null, {from: from, to: to});
    planFormOpenFor = null;
    planEditingId = null; // the row being edited is one of the ones just removed
    renderPlan();
    say(removed + ' planned session' + (removed === 1 ? '' : 's') + ' cleared from this week.');
    return removed;
  }

  function planField(labelText, subText, inputEl){
    var wrap = el('div', 'plan-field');
    var lbl = el('label', 'field-lbl');
    lbl.appendChild(document.createTextNode(labelText + ' '));
    if(subText){ lbl.appendChild(el('span', 'sub', subText)); }
    lbl.htmlFor = inputEl.id;
    // Siblings, not nested — same reason as raceField: a label's
    // margin-bottom has no visible effect around a nested input.
    wrap.appendChild(lbl);
    wrap.appendChild(inputEl);
    return wrap;
  }
  // A radio chip group, matching the check-in question layout and the race
  // Commitment toggle. Returns the inputs so the submit handler can read
  // whichever is checked.
  function planChoiceGroup(form, legendText, name, opts, gridClass, defaultValue){
    var wrap = el('fieldset', 'plan-field');
    var legend = el('legend', 'field-lbl', legendText);
    wrap.appendChild(legend);
    var choices = el('div', 'choices ' + gridClass);
    var inputs = opts.map(function(o){
      var opt = el('div', 'opt');
      var input = document.createElement('input');
      input.type = 'radio'; input.name = name; input.id = name + '-' + o.v;
      input.value = o.v;
      // defaultChecked, not .checked — so form.reset() after a successful
      // add restores the default rather than leaving nothing selected.
      input.defaultChecked = o.v === defaultValue;
      opt.appendChild(input);
      var label = el('label', 'choice', o.label);
      label.htmlFor = input.id;
      opt.appendChild(label);
      choices.appendChild(opt);
      return input;
    });
    wrap.appendChild(choices);
    form.appendChild(wrap);
    return inputs;
  }
  function checkedValue(inputs, fallback){
    var hit = inputs.filter(function(i){ return i.checked; })[0];
    return hit ? hit.value : fallback;
  }

  // One form, two modes. `editItem` (optional) switches it from a blank add
  // to an in-place edit of that planned session — extended rather than forked
  // so the validation rules, the error surface and the field set can't drift
  // between adding and editing. The date is shown but never editable in
  // either mode: see updatePlanSession.
  function renderPlanForm(root, dateISO, onCancel, editItem){
    var isEdit = !!editItem;
    var form = document.createElement('form');
    form.className = 'plan-form';
    form.setAttribute('aria-label', (isEdit ? 'Edit planned session for ' : 'Add a planned session for ') + formatWeekdayDate(dateISO));

    var discInputs = planChoiceGroup(form, 'Which session?', 'plan-disc', PLAN_DISC_OPTS, 'grid3', isEdit ? editItem.disc : 'swim');

    var titleInput = document.createElement('input');
    titleInput.type = 'text'; titleInput.className = 'text-input'; titleInput.id = 'plan-title';
    titleInput.maxLength = 60;
    // aria-required, not the `required` attribute. A native `required` makes
    // the browser block submit with its own transient bubble before the
    // submit handler ever runs, which makes the specific, persistent,
    // role="alert" messages below unreachable — and a silently-blocked
    // submit with no visible reason is exactly the trap decision 22 hit
    // with type="url" on the race website field.
    titleInput.setAttribute('aria-required', 'true');
    titleInput.placeholder = 'e.g. Squad — 8×100 CSS';
    if(isEdit){ titleInput.value = editItem.title || ''; }
    form.appendChild(planField('What is it', null, titleInput));

    var durInput = document.createElement('input');
    // type="text" + inputmode="numeric", not type="number" — number inputs
    // accept 'e'/'+'/'-' and report an empty value for anything they judge
    // invalid, which hides a typo behind a silently-blocked submit. Parsed
    // and range-checked below instead.
    durInput.type = 'text'; durInput.className = 'text-input'; durInput.id = 'plan-duration';
    durInput.maxLength = 3;
    durInput.setAttribute('aria-required', 'true');
    durInput.setAttribute('inputmode', 'numeric');
    durInput.placeholder = 'e.g. 60';
    if(isEdit && editItem.duration != null){ durInput.value = String(editItem.duration); }
    form.appendChild(planField('How long', 'minutes', durInput));

    var intensityInputs = planChoiceGroup(form, 'Meant to be easy or hard?', 'plan-intensity', PLAN_INTENSITY_OPTS, 'grid3', isEdit ? editItem.intensity : 'easy');
    var keyInputs = planChoiceGroup(form, 'Key session?', 'plan-key', [
      {v:'no', label:'Regular'}, {v:'yes', label:'Key session'}
    ], 'grid2', (isEdit && editItem.key) ? 'yes' : 'no');

    var notesInput = document.createElement('textarea');
    notesInput.id = 'plan-notes'; notesInput.rows = 2; notesInput.maxLength = 200;
    notesInput.placeholder = 'e.g. HR cap 145 on the commute home';
    if(isEdit){ notesInput.value = editItem.notes || ''; }
    form.appendChild(planField('Notes', 'optional', notesInput));

    // Its own class, not .empty-note — that one is styled as a neutral
    // "nothing here yet" panel, which is the wrong signal for a rejected
    // submit. This is the form's only error surface (native `required` was
    // deliberately not used, see above), so it has to read as one.
    var err = el('p', 'plan-form-error', '');
    err.id = 'plan-form-error';
    err.hidden = true;
    err.setAttribute('role', 'alert');
    form.appendChild(err);

    var actions = el('div', 'plan-form-actions');
    var submitBtn = el('button', 'btn btn-primary', isEdit ? 'Save changes' : 'Add session');
    submitBtn.type = 'submit';
    actions.appendChild(submitBtn);
    var cancelBtn = el('button', 'btn btn-ghost', 'Cancel');
    cancelBtn.type = 'button';
    cancelBtn.addEventListener('click', onCancel);
    actions.appendChild(cancelBtn);
    form.appendChild(actions);

    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      var title = titleInput.value.trim();
      var mins = parseInt(durInput.value, 10);
      if(!title){
        err.textContent = 'Give the session a name so you recognise it on the day.';
        err.hidden = false; titleInput.focus(); return;
      }
      if(isNaN(mins) || mins < 1 || mins > 999){
        err.textContent = 'Enter the planned length in whole minutes, between 1 and 999.';
        err.hidden = false; durInput.focus(); return;
      }
      err.hidden = true;
      // Fallbacks differ by mode on purpose. Adding falls back to the form's
      // own defaults; editing falls back to the value the item already holds,
      // so a session whose intensity or discipline was hand-typed into the
      // Sheet as something outside the option list round-trips unchanged
      // rather than being silently rewritten to 'easy'/'swim' by an edit that
      // never touched that field.
      var fields = {
        disc: checkedValue(discInputs, isEdit ? editItem.disc : 'swim'),
        title: title,
        duration: mins,
        intensity: checkedValue(intensityInputs, isEdit ? (editItem.intensity || 'easy') : 'easy'),
        key: checkedValue(keyInputs, 'no') === 'yes',
        notes: notesInput.value
      };
      if(isEdit){
        // Closes the form and rebuilds the view; focus goes back to the day
        // rather than a fresh blank form, since the edit is finished.
        var editedDate = editItem.date;
        updatePlanSession(editItem.id, fields);
        var dayRow = document.getElementById('plan-day-' + editedDate);
        if(dayRow){ dayRow.focus({preventScroll: true}); }
        return;
      }
      addPlanSession(dateISO, fields);
      // renderPlan() has already rebuilt the view by here, so re-find the
      // live form's title field rather than focusing the detached one.
      var freshTitle = document.getElementById('plan-title');
      if(freshTitle){ freshTitle.focus(); }
    });

    root.appendChild(form);
  }

  function planItemCard(item){
    var card = document.createElement('details');
    card.className = 'plan-item';
    var summary = document.createElement('summary');
    var dot = el('span', 'plan-item-dot');
    dot.style.background = 'var(--' + item.disc + ')';
    dot.setAttribute('aria-hidden', 'true');
    summary.appendChild(dot);
    var main = el('div', 'plan-item-main');
    main.appendChild(el('span', 'plan-item-title', item.title || DISC_LABEL[item.disc] || 'Session'));
    var metaBits = [DISC_LABEL[item.disc] || item.disc];
    if(item.duration != null){ metaBits.push(planDurationLabel(item.duration)); }
    if(item.intensity){ metaBits.push(PLAN_INTENSITY_LABEL[item.intensity] || item.intensity); }
    main.appendChild(el('span', 'plan-item-meta', metaBits.join(' · ')));
    summary.appendChild(main);
    if(item.key){ summary.appendChild(el('span', 'plan-item-key', 'Key')); }
    // Same rotating chevron as raceCard. Without it nothing signals the card
    // expands, and the notes (the whole reason to enter a plan into the app)
    // stay invisible behind a tap the athlete has no reason to try.
    var chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    chevron.setAttribute('class', 'plan-item-chevron');
    chevron.setAttribute('viewBox', '0 0 24 24');
    chevron.setAttribute('fill', 'none');
    chevron.setAttribute('stroke', 'currentColor');
    chevron.setAttribute('stroke-width', '2');
    chevron.setAttribute('stroke-linecap', 'round');
    chevron.setAttribute('stroke-linejoin', 'round');
    chevron.setAttribute('aria-hidden', 'true');
    var chevronPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    chevronPath.setAttribute('d', 'M6 9l6 6 6-6');
    chevron.appendChild(chevronPath);
    summary.appendChild(chevron);
    card.appendChild(summary);

    var body = el('div', 'plan-item-body');
    if(item.notes){ body.appendChild(el('p', 'plan-item-notes', item.notes)); }
    var foot = el('div', 'plan-item-foot');
    var edit = el('button', 'plan-item-edit', 'Edit');
    edit.type = 'button';
    edit.setAttribute('aria-label', 'Edit ' + (item.title || DISC_LABEL[item.disc] || 'session') + ' on ' + formatWeekdayDate(item.date));
    edit.addEventListener('click', function(){ openPlanEditor(item); });
    foot.appendChild(edit);
    var del = el('button', 'plan-item-delete', 'Remove');
    del.type = 'button';
    del.setAttribute('aria-label', 'Remove ' + (item.title || DISC_LABEL[item.disc] || 'session') + ' from ' + formatWeekdayDate(item.date));
    del.addEventListener('click', function(){
      if(window.confirm('Remove "' + (item.title || DISC_LABEL[item.disc]) + '" from your plan?')){ deletePlanSession(item.id); }
    });
    foot.appendChild(del);
    body.appendChild(foot);
    card.appendChild(body);
    return card;
  }

  function planDayRow(dateISO){
    var wrap = el('div', 'plan-day' + (dateISO === todayISO() ? ' is-today' : ''));
    // Addressable and programmatically focusable, so goToPlanDay() can land
    // on a specific day rather than the top of the view. tabIndex -1 keeps it
    // out of the tab order — it is a scroll/focus target, not a control.
    wrap.id = 'plan-day-' + dateISO;
    wrap.tabIndex = -1;
    var hd = el('div', 'plan-day-hd');
    var d = new Date(dateISO + 'T00:00:00');
    hd.appendChild(el('span', 'plan-day-name', MONTH_DAYS[(d.getDay() + 6) % 7] + (dateISO === todayISO() ? ' · today' : '')));
    hd.appendChild(el('span', 'plan-day-date', d.getDate() + ' ' + MONTH_NAMES[d.getMonth()]));
    wrap.appendChild(hd);

    var items = planItemsFor(dateISO);
    if(items.length){
      var ul = el('ul', 'plan-item-list');
      ul.setAttribute('aria-label', 'Planned sessions for ' + formatWeekdayDate(dateISO));
      items.forEach(function(item){
        var li = document.createElement('li');
        li.appendChild(planItemCard(item));
        ul.appendChild(li);
      });
      wrap.appendChild(ul);
    }

    // Same class and role as the form's own error surface, hosted by the day
    // instead — see planNotice. It survives the re-render that closed the
    // form, which is the whole point of holding it in module state.
    if(planNotice && planNotice.date === dateISO){
      var notice = el('p', 'plan-form-error plan-day-notice', planNotice.message);
      notice.setAttribute('role', 'alert');
      wrap.appendChild(notice);
    }

    var isOpen = planFormOpenFor === dateISO;
    var formWrapId = 'plan-form-' + dateISO;
    if(!isOpen){
      var addBtn = el('button', 'plan-day-add', '+ Add session');
      addBtn.type = 'button';
      addBtn.setAttribute('aria-expanded', 'false');
      addBtn.setAttribute('aria-controls', formWrapId);
      addBtn.setAttribute('aria-label', 'Add a planned session on ' + formatWeekdayDate(dateISO));
      addBtn.addEventListener('click', function(){
        planFormOpenFor = dateISO;
        planEditingId = null; // an add is never an edit, whatever was open before
        clearPlanNotice();    // starting a new entry is the athlete moving on
        renderPlan();
        var titleInput = document.getElementById('plan-title');
        if(titleInput){ titleInput.focus(); }
      });
      wrap.appendChild(addBtn);
    }
    var formWrap = el('div', 'plan-form-wrap');
    formWrap.id = formWrapId;
    formWrap.hidden = !isOpen;
    // Only the open day builds a form — the inputs use fixed ids
    // (plan-title, plan-duration…) so seven hidden copies would be seven
    // sets of duplicate ids and would break every label association.
    if(isOpen){
      // The item being edited, if any. Looked up by id against *this day's*
      // items, so a stale planEditingId (e.g. the row was deleted on another
      // device between opening and rendering) degrades to a blank add form
      // rather than throwing.
      var editItem = planEditingId
        ? items.filter(function(p){ return p.id === planEditingId; })[0] || null
        : null;
      renderPlanForm(formWrap, dateISO, function(){
        planFormOpenFor = null;
        planEditingId = null;
        renderPlan();
        var backBtn = document.querySelector('.plan-day-add');
        if(backBtn){ backBtn.focus(); }
      }, editItem);
    }
    wrap.appendChild(formWrap);
    return wrap;
  }

  function planWeekNav(){
    var nav = el('div', 'plan-week-nav');
    var prev = el('button', 'plan-week-btn', '‹');
    prev.type = 'button';
    prev.setAttribute('aria-label', 'Show the previous week');
    prev.addEventListener('click', function(){ stepPlanWeek(-7); });
    nav.appendChild(prev);

    var label = el('div', 'plan-week-nav-label');
    var monday = new Date(state.planWeek + 'T00:00:00');
    label.appendChild(el('span', 'plan-week-num', 'Week ' + isoWeekNumber(monday)));
    // Same phase-pill treatment Month uses on its week headers. The plan
    // view has no logged sessions to infer a phase from, so it reads the
    // app's single current phase, exactly as dashWeekPhaseHeader does.
    var pillClass = PERIOD_PILL_CLASS[state.periodisation];
    label.appendChild(el('span', 'month-week-pill' + (pillClass ? ' ' + pillClass : ''), PERIOD_LABEL[state.periodisation] || 'Unset phase'));
    if(state.planWeek === weekKey(new Date())){ label.appendChild(el('span', 'month-week-current', 'this week')); }
    nav.appendChild(label);

    var next = el('button', 'plan-week-btn', '›');
    next.type = 'button';
    next.setAttribute('aria-label', 'Show the next week');
    next.addEventListener('click', function(){ stepPlanWeek(7); });
    nav.appendChild(next);
    return nav;
  }
  function stepPlanWeek(days){
    // Changing week discards a half-filled form for the old week — leaving
    // it open would attach it to a day that's no longer on screen.
    planFormOpenFor = null;
    planEditingId = null;
    clearPlanNotice();
    state.planWeek = isoDate(addDays(new Date(state.planWeek + 'T00:00:00'), days));
    renderPlan();
    say('Showing week beginning ' + formatWeekdayDate(state.planWeek) + '.');
  }

  function planHero(){
    var wrap = el('div', 'race-hero');
    wrap.appendChild(el('div', 'race-hero-eyebrow', 'Training plan'));
    var h = document.createElement('h1');
    h.className = 'race-hero-headline';
    h.id = 'plan-h'; h.tabIndex = -1;
    h.appendChild(document.createTextNode('Plan '));
    h.appendChild(el('span', 'accent', 'your week'));
    h.appendChild(document.createTextNode('.'));
    wrap.appendChild(h);
    wrap.appendChild(el('p', 'race-hero-sub', 'Type in the week you’ve already written elsewhere, then copy it forward. Synced to your training log Sheet, so it shows on every device.'));
    var plannedCount = planItemsInWeek(state.planWeek).length;
    var loggedCount = loggedCountInWeek(state.planWeek);
    // Both counts are for the week the selector is showing, which isn't
    // always the current one — so don't hard-label them "this week".
    var scope = state.planWeek === weekKey(new Date()) ? ' this week' : ' that week';
    var stats = el('div', 'race-hero-stats');
    stats.appendChild(raceHeroStat('planned', plannedCount, 'planned' + scope));
    stats.appendChild(raceHeroStat('logged', loggedCount, 'logged' + scope));
    wrap.appendChild(stats);
    return wrap;
  }

  // "Copy this week to…" — the next MAX_COPY_WEEKS Mondays as checkboxes,
  // so a repeating block is one action instead of re-typing it.
  function planCopyTool(){
    var det = document.createElement('details');
    det.className = 'plan-copy';
    det.open = planCopyOpen;
    det.addEventListener('toggle', function(){ planCopyOpen = det.open; });
    var summary = document.createElement('summary');
    summary.textContent = 'Copy this week to…';
    det.appendChild(summary);

    var form = document.createElement('form');
    var ul = el('ul', 'plan-copy-list');
    var boxes = [];
    for(var i = 1; i <= MAX_COPY_WEEKS; i++){
      var targetISO = isoDate(addDays(new Date(state.planWeek + 'T00:00:00'), i * 7));
      var li = document.createElement('li');
      var lbl = el('label', 'plan-copy-opt');
      var box = document.createElement('input');
      box.type = 'checkbox'; box.value = targetISO;
      box.id = 'plan-copy-' + targetISO;
      lbl.htmlFor = box.id;
      lbl.appendChild(box);
      lbl.appendChild(document.createTextNode(
        'Week ' + isoWeekNumber(new Date(targetISO + 'T00:00:00')) + ' — from ' + formatWeekdayDate(targetISO)
      ));
      li.appendChild(lbl);
      ul.appendChild(li);
      boxes.push(box);
    }
    form.appendChild(ul);
    var actions = el('div', 'plan-form-actions');
    var go = el('button', 'btn btn-primary', 'Copy week');
    go.type = 'submit';
    actions.appendChild(go);
    form.appendChild(actions);
    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      var targets = boxes.filter(function(b){ return b.checked; }).map(function(b){ return b.value; });
      if(!targets.length){ say('Pick at least one week to copy into.'); return; }
      if(!planItemsInWeek(state.planWeek).length){ say('Nothing planned this week to copy.'); return; }
      copyPlanWeek(targets);
    });
    det.appendChild(form);
    return det;
  }

  function renderPlan(){
    var root = els.viewPlan;
    clear(root);
    root.appendChild(planHero());

    var back = document.createElement('button');
    back.type = 'button';
    back.className = 'dash-phase-change';
    back.textContent = '← Back to this week';
    back.addEventListener('click', function(){ showView('dashboard'); });
    root.appendChild(back);

    root.appendChild(planWeekNav());
    planWeekDates(state.planWeek).forEach(function(dateISO){
      root.appendChild(planDayRow(dateISO));
    });

    var tools = el('div', 'plan-tools');
    tools.appendChild(planCopyTool());
    var clearBtn = el('button', 'plan-clear', 'Clear this week');
    clearBtn.type = 'button';

  function clearWarmupChecklist(disc){
    Object.keys(state.warmupChecked).forEach(function(k){

  // Fires the instant every exercise gets checked off naturally — mirrors
  // TRI-run-strength's handleAllComplete(): logs the count and shows the
  // "Well done" banner immediately, but (unlike the manual complete button
  // below) leaves the checklist checked rather than clearing it, so the
  // athlete sees everything ticked. Only fires once per completion; the
  // banner and checklist both clear together via "Reset & go again".
  function handleWarmupAllComplete(disc){
    var next = (state.warmupSessions[disc] || 0) + 1;
    state.warmupSessions[disc] = next;

  function renderWarmup(){

        var justChecked = !state.warmupChecked[key];

  function say(msg){
