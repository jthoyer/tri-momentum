<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRI Momentum — training log</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22TRI%20Momentum%22%2C%22short_name%22%3A%22TRI%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22theme_color%22%3A%22%23002DFF%22%2C%22background_color%22%3A%22%23F7F8FC%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: only light;
  --bg:#F7F8FC;--s1:#FFFFFF;--s3:#F0F2F8;--s4:#E8EBF5;
  --ink:#0E1020;--ink2:#4B5278;--ink3:#8B93B8;
  --bd:rgba(14,16,32,0.08);--bd2:rgba(14,16,32,0.14);--bd3:rgba(14,16,32,0.25);
  --blue:#0022FF;--blue-l:#E8EFFE;--blue-m:#4F7BE8;
  --swim:#0022FF;--swim-l:#E8EFFE;
  --bike:#0F6E56;--bike-l:#E1F5EE;
  --run:#993C1D;--run-l:#FAECE7;
  --brick:#534AB7;--brick-l:#EEEDFE;
  --strength:#854F0B;--strength-l:#FAEEDA;
  --rest:#8B93B8;--rest-l:#F0F2F8;
  --phase-base:#0F6E56;--phase-base-l:#E1F5EE;
  --phase-build:#D9660B;--phase-build-l:#FFF1E0;
  --phase-peak:#993C1D;--phase-peak-l:#FAECE7;
  --done:#0F6E56;--done-l:#E1F5EE;
  --skipped:#993C1D;--skipped-l:#FAECE7;
  --modified:#854F0B;--modified-l:#FAEEDA;
  --dash-good:#0E9A5C;--dash-mid:#E0A100;--dash-bad:#C81E1E;
  --rmd:10px;--rlg:16px;--rxl:22px;--tabbar-h:84px;--tabbar-lift:0px;
  --fd:'DM Sans',sans-serif;--fb:'DM Sans',sans-serif;--fm:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:var(--fb);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh}
#app{max-width:430px;margin:0 auto;padding:0 1.25rem 3rem}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
a:focus,button:focus,input:focus,textarea:focus{outline:3px solid var(--blue);outline-offset:2px}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── Flow ── */
.flow{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;margin:0 -1.25rem}
.flow-hdr{position:sticky;top:0;z-index:2;flex:none;padding:1rem 1.25rem .8rem;background:var(--s1);border-bottom:0.5px solid var(--bd)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.eyebrow{font-family:var(--fm);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.counter{font-family:var(--fm);font-size:14px;color:var(--ink2);line-height:1.2;white-space:nowrap;flex:none}
.bar{height:4px;background:var(--s4);border-radius:2px;overflow:hidden}
.bar > i{display:block;height:100%;width:0;background:var(--blue);border-radius:2px;transition:width .2s ease}
.flow-phase-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.flow-phase-row[hidden]{display:none}
#flow-phase-label{font-family:var(--fm);font-size:12px;color:var(--ink3)}
.flow-phase-change{padding:0;background:none;border:none;font-family:var(--fd);font-size:12px;font-weight:600;color:var(--blue);cursor:pointer}
.flow-body{flex:1;padding:1.5rem 1.25rem 6rem;min-height:0}
.q-set{border:none;padding:0;margin:0;display:block;min-width:0}
.q-set + .q-set{margin-top:5rem}
.q-set > legend{display:block;width:100%;padding:0;float:left}
h1{font-family:var(--fd);font-size:23px;font-weight:600;letter-spacing:-.3px;line-height:1.25;color:var(--ink)}
h1:focus,h1:focus-visible{outline:none}
.flow-body h2{font-family:var(--fd);font-size:23px;font-weight:600;letter-spacing:-.3px;line-height:1.25;color:var(--ink)}
.hint{color:var(--ink2);font-size:14px;line-height:1.6;margin-top:10px;clear:both}
.choices-wrap{margin-top:2.5rem;clear:both}
.q-set .choices-wrap{margin-top:1.25rem}
.q-set.no-hint .choices-wrap{margin-top:2rem}
.choices{display:flex;flex-direction:column;gap:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:100%;height:100%;top:0;left:0;margin:0;cursor:pointer}
.choice{display:flex;align-items:center;gap:11px;min-height:56px;padding:12px 14px;background:var(--s1);border:1px solid var(--bd2);border-radius:var(--rmd);font-size:15px;color:var(--ink);line-height:1.35;cursor:pointer}
.opt input:checked + .choice{border-color:var(--blue);background:var(--blue-l);color:var(--blue);font-weight:600}
.opt input:focus-visible + .choice{outline:3px solid var(--blue);outline-offset:2px}
.choice .tick{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--bd3);display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.opt input:checked + .choice .tick{border-color:var(--blue);background:var(--blue);color:#fff}
.sev{flex-shrink:0;width:14px;height:14px;border-radius:3px;border:1px solid rgba(14,16,32,.25)}
.sev-strong{background:var(--done)}
.sev-solid{background:var(--blue-m)}
.sev-flat{background:var(--modified)}
.sev-rough{background:var(--run)}
.sev-1{background:var(--done-l);border-color:var(--done)}
.sev-2{background:#CFE8DE}
.sev-3{background:var(--modified)}
.sev-4{background:var(--run)}
.choices.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.choices.grid3 .choice{justify-content:center;min-height:56px;text-align:center}
.choices.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.choices.grid2 .choice{justify-content:center;min-height:56px;text-align:center}

.review-row{display:flex;width:100%;align-items:baseline;gap:12px;min-height:52px;padding:11px 13px;margin-bottom:8px;background:var(--s1);border:0.5px solid var(--bd2);border-radius:var(--rmd);text-align:left;cursor:pointer;font-family:var(--fb)}
.review-row:hover{background:var(--s3)}
.review-q{flex:1;font-size:14px;color:var(--ink2);line-height:1.45}
.review-a{flex:none;max-width:58%;font-size:14px;font-weight:600;color:var(--blue);text-align:right;line-height:1.45}
.review-a.none{color:var(--run);font-weight:500;font-style:italic}
label.note-lbl{display:block;font-family:var(--fd);font-size:15px;font-weight:600;margin:1.5rem 0 .5rem}
.note-lbl .sub{font-weight:400;font-size:14px;color:var(--ink2)}
textarea{width:100%;padding:12px 14px;border:1px solid var(--bd2);border-radius:var(--rmd);font-family:var(--fb);font-size:15px;color:var(--ink);background:var(--s1);resize:vertical;min-height:56px;line-height:1.5}
textarea::placeholder{color:var(--ink3)}

.saved-flag{display:flex;align-items:center;gap:8px;color:var(--done);font-size:14px;font-weight:600}
.saved-flag .g{font-size:15px}
.week-lead{color:var(--ink2);font-size:14px;line-height:1.6;margin-top:10px}
.week-list{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:1.25rem}
.week-row{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--s1);border:0.5px solid var(--bd2);border-radius:var(--rmd)}
.week-row.is-now{background:var(--blue-l);border:1px solid var(--blue)}
.week-day{font-family:var(--fm);font-size:14px;color:var(--ink3);width:36px;flex:none}
.week-row.is-now .week-day{color:var(--blue)}
.week-what{font-size:14px;color:var(--ink2);line-height:1.4}
.week-row.is-now .week-what{color:var(--ink);font-weight:600}
.week-state{margin-left:auto;font-size:14px;color:var(--ink3);white-space:nowrap;padding-left:6px}
.week-state.done{color:var(--done);font-weight:500}
.floor-card{background:var(--s1);border:0.5px solid var(--bd2);border-radius:var(--rlg);padding:1rem 1.05rem;margin-top:1.25rem}
.floor-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.floor-title{font-size:15px;font-weight:600;color:var(--ink)}
.floor-count{font-family:var(--fm);font-size:14px;color:var(--ink2);white-space:nowrap}
.floor-card .bar{margin-top:12px}
.floor-note{color:var(--ink2);font-size:14px;line-height:1.6;margin-top:12px}
.empty-note{color:var(--ink2);font-size:14px;line-height:1.6;margin-top:1.1rem;padding:1rem 1.05rem;background:var(--s1);border:0.5px dashed var(--bd2);border-radius:var(--rlg)}

.flow-foot{position:sticky;bottom:calc(var(--tabbar-h) + var(--tabbar-lift));z-index:2;flex:none;display:flex;gap:10px;padding:.75rem 1.25rem calc(.9rem + env(safe-area-inset-bottom));background:var(--s1);border-top:0.5px solid var(--bd)}
.btn{min-height:52px;padding:14px;border-radius:var(--rmd);font-family:var(--fd);font-size:17px;font-weight:600;letter-spacing:.01em;border:1px solid transparent;cursor:pointer}
.btn-primary{flex:1;background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-ghost{flex:none;padding:14px 18px;background:transparent;color:var(--ink);border-color:var(--bd2)}
.btn-primary:hover{background:#1246ad}
.btn-ghost:hover{background:var(--s3)}
.btn-ghost:disabled{color:var(--ink3);border-color:var(--bd);cursor:default}
.btn-ghost:disabled:hover{background:transparent}
.flow-foot .btn{border-radius:999px}
.flow-foot .btn-primary{background:#002DFF;border-color:#002DFF}
.flow-foot .btn-primary:hover{background:#0022CC}
.flow-foot .btn-primary::after{content:"\2192";margin-left:8px;font-weight:600;display:inline-block}

/* ── Splash — shown on load until a nav tap dismisses it; no auto-advance ── */
.splash{min-height:100vh;min-height:100dvh;margin:0 -1.25rem;padding:2.5rem 1.25rem calc(2.5rem + var(--tabbar-h) + var(--tabbar-lift));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--blue)}
.splash[hidden]{display:none}
.splash-logo{width:192px;height:192px;border-radius:var(--rxl)}
.splash-sub{margin-top:10px;font-family:var(--fm);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.splash-headline{margin-top:36px;max-width:300px;font-family:var(--fd);font-size:23px;font-weight:600;letter-spacing:-.3px;line-height:1.25;color:#fff}
.splash-headline:focus,.splash-headline:focus-visible{outline:none}
.splash-countdown{margin-top:28px;padding:14px 18px;max-width:300px;border-radius:var(--rlg);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
.splash-countdown[hidden]{display:none}
.splash-countdown-eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.splash-countdown-race{margin-top:4px;font-family:var(--fd);font-size:15px;font-weight:600;color:#fff;line-height:1.35}
.splash-countdown-time{margin-top:2px;font-family:var(--fd);font-size:22px;font-weight:600;letter-spacing:-.3px;color:#fff}
.splash-countdown-time .u{font-size:14px;font-weight:500;color:rgba(255,255,255,.75)}

/* ── One-time training phase screen ── */
.period{min-height:100vh;min-height:100dvh;margin:0 -1.25rem;padding:2.5rem 1.25rem calc(2.5rem + var(--tabbar-h) + var(--tabbar-lift));display:flex;flex-direction:column;justify-content:center}
.period[hidden]{display:none}

/* ── Bottom tabs ── */
.view-tabs[hidden]{display:none}
.view-tabs{position:fixed;left:0;right:0;bottom:var(--tabbar-lift);z-index:5;display:flex;gap:0;max-width:430px;margin:0 auto;padding:0;background:#002DFF;border-top:none;border-radius:0}
.view-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--tabbar-h);padding:10px 4px calc(10px + env(safe-area-inset-bottom));background:none;border:none;border-radius:0;font-family:var(--fd);font-size:11.5px;font-weight:600;color:rgba(255,255,255,.6);cursor:pointer}
.view-tab svg{flex:none}
.view-tab[aria-selected="true"]{color:#37C6FC;background:rgba(255,255,255,.16)}

/* ── Dashboard ── */
.dash{padding-top:1.5rem;padding-bottom:calc(var(--tabbar-h) + var(--tabbar-lift))}
.strength-frame{width:100%;border:0;display:block;background:transparent}
.dash-eyebrow{font-family:var(--fm);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.dash-section{margin-top:2.3rem;padding-top:1.1rem;border-top:1px solid var(--bd)}
.dash-eyebrow + .dash-section{margin-top:1.1rem;padding-top:0;border-top:none}
.dash-section::before{content:attr(data-label);display:block;font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:.9rem}
.dash-signal-link{display:block;margin-top:14px;padding:0;background:none;border:none;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--blue);cursor:pointer}
.dash-signal-link:hover{color:var(--blue-m)}
.dash-insight-strip{margin-top:.6rem;padding:.85rem 1rem;border-left:3px solid transparent;border-radius:0 10px 10px 0}
.dash-insight-strip:first-child{margin-top:0}
.dash-insight-strip-label{font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:.4rem}
.dash-insight-strip-headline{font-size:15.5px;font-weight:600;line-height:1.5;color:var(--ink)}
.dash-insight-strip + .dash-stat-hd{margin-top:1.1rem}
.signal-subtabs{display:flex;gap:4px;padding:3px;background:var(--s3);border-radius:999px;margin-top:1.4rem;margin-bottom:1.5rem}
.signal-subtab{flex:1;min-height:38px;padding:8px 4px;border:none;border-radius:999px;background:none;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.signal-subtab[aria-selected="true"]{background:var(--blue);color:#fff}
.month-week-block{margin-top:1.4rem;padding:1rem 1.05rem 1.2rem;background:var(--s1);border:0.5px solid var(--bd2);border-radius:var(--rlg)}
.month-week-block:first-child{margin-top:0}
.month-week-block .dash-matrix-hd{margin-top:.9rem}
.month-week-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.month-week-label{font-family:var(--fd);font-size:13px;font-weight:600;color:var(--ink)}
.month-week-pill{font-family:var(--fd);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--s3);color:var(--ink2)}
.month-week-pill.phase-base{background:var(--phase-base);color:var(--phase-base-l)}
.month-week-pill.phase-build{background:var(--phase-build);color:var(--phase-build-l)}
.month-week-pill.phase-peak{background:var(--phase-peak);color:var(--phase-peak-l)}
.month-week-current{font-family:var(--fm);font-size:11.5px;color:var(--ink3)}
.dash-stat-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dash-stat-n{font-family:var(--fm);font-size:11.5px;color:var(--ink3);white-space:nowrap}
.dash-stat-big{display:flex;align-items:baseline;gap:9px;margin-top:10px}
.dash-stat-pct{font-family:var(--fd);font-size:32px;font-weight:600;letter-spacing:-.8px;color:var(--ink)}
.dash-stat-pct .u{font-size:18px;color:var(--ink2);font-weight:500}
.dash-stat-desc{font-size:13px;color:var(--ink2)}
.tri-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--s4);margin-top:9px}
.tri-bar span{display:block;height:100%}
.dash-counts{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--fm);font-size:12px;color:var(--ink2);margin-top:8px}
.dash-counts b{font-weight:600}
.dash-matrix-hd{display:flex;align-items:baseline;gap:12px;margin-top:1.6rem}
.dash-matrix-week{font-family:var(--fm);font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.dash-matrix-rule{flex:1;height:1px;background:var(--bd)}
.dash-matrix-sub{font-family:var(--fm);font-size:11.5px;color:var(--ink3)}
.dash-grid{display:grid;grid-template-columns:52px repeat(7,1fr);gap:5px;margin-top:.7rem;align-items:center}
.dash-grid-day{font-family:var(--fm);font-size:10.5px;color:var(--ink3);text-align:center}
.dash-grid-disc{font-size:12.5px;color:var(--ink2)}
.dash-cell{height:16px;border-radius:4px;background:var(--s4);box-sizing:border-box}
.dash-cell.na{background:transparent;border:1px solid var(--bd2)}
.dash-cell.good{background:var(--dash-good)}
.dash-cell.mid{background:var(--dash-mid)}
.dash-cell.bad{background:var(--dash-bad)}
.dash-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:1.6rem;padding-top:1rem;border-top:0.5px solid var(--bd)}
.dash-legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2)}
.dash-legend-sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none;box-sizing:border-box}
.dash-phase-pills{display:flex;gap:3px;padding:3px;background:var(--s3);border-radius:999px}
.dash-phase-pill{flex:1;min-height:38px;display:flex;align-items:center;justify-content:center;padding:8px 4px;border-radius:999px;font-family:var(--fd);font-size:12.5px;font-weight:600;color:var(--ink2);text-align:center;line-height:1.25}
.dash-phase-pill.is-current{background:var(--blue);color:#fff}
.dash-phase-note{font-size:12.5px;color:var(--ink3);margin-top:.8rem;line-height:1.5}
.dash-phase-change{display:block;margin-top:.6rem;padding:0;background:none;border:none;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--blue);cursor:pointer}

/* ── Race calendar ── */
.text-input{width:100%;min-height:52px;padding:12px 14px;border:1px solid var(--bd2);border-radius:var(--rmd);font-family:var(--fb);font-size:15px;color:var(--ink);background:var(--s1)}
.text-input::placeholder{color:var(--ink3)}
.race-form{margin-top:1.1rem;padding:1rem 1.05rem 1.1rem;background:var(--s1);border:0.5px solid var(--bd2);border-radius:var(--rlg);display:flex;flex-direction:column;gap:14px}
.race-field label.field-lbl{display:block;font-family:var(--fd);font-size:13.5px;font-weight:600;margin-bottom:6px}
.race-field .sub{font-weight:400;font-size:12.5px;color:var(--ink2)}
.race-field textarea{min-height:48px}
.race-form .btn-primary{margin-top:2px;border-radius:999px}
.race-list{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:1rem}
.race-card{padding:14px 15px;background:var(--s1);border:0.5px solid var(--bd2);border-radius:var(--rlg)}
.race-card.is-next{border-color:var(--blue);background:var(--blue-l)}
.race-card-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.race-card-date{font-family:var(--fm);font-size:12.5px;color:var(--ink3)}
.race-card.is-next .race-card-date{color:var(--blue)}
.race-card-countdown{font-family:var(--fm);font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.race-card.is-next .race-card-countdown{color:var(--blue);font-weight:600}
.race-card-name{margin-top:5px;font-family:var(--fd);font-size:16px;font-weight:600;color:var(--ink);line-height:1.35}
.race-status-pill{display:inline-flex;align-items:center;margin-top:8px;padding:3px 10px;border-radius:999px;font-family:var(--fd);font-size:11.5px;font-weight:600}
.race-status-pill.locked{background:var(--done);color:var(--done-l)}
.race-status-pill.considering{background:var(--modified);color:var(--modified-l)}
.race-card-notes{margin-top:6px;font-size:13.5px;color:var(--ink2);line-height:1.5}
.race-card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.race-card-link{font-family:var(--fd);font-size:13px;font-weight:600;color:var(--blue);text-decoration:none}
.race-card-link:hover{color:var(--blue-m)}
.race-card-delete{margin-left:auto;padding:0;background:none;border:none;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer}
.race-card-delete:hover{color:var(--run)}

/* ── Warm up ── */
.warmup-hero{margin-top:1.4rem;padding:1.5rem 1.3rem 1.4rem;border-radius:var(--rxl);background:#182542;color:#fff}
.warmup-hero-eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#F8C44F}
.warmup-hero h2{margin-top:9px;font-family:var(--fd);font-size:25px;font-weight:600;line-height:1.22;letter-spacing:-.3px;color:#fff}
.warmup-hero h2 em{color:#F8C44F;font-style:normal}
.warmup-hero-desc{margin-top:11px;font-size:14px;line-height:1.6;color:#EDF0F7}
.warmup-hero-meta{display:grid;gap:11px;margin-top:18px;padding:13px 15px;border-radius:var(--rmd);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.warmup-hero-meta-item{display:grid;gap:2px;font-size:13px;color:#EDF0F7}
.warmup-hero-meta-label{display:block;font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.warmup-hero-progress{margin-top:18px}
.warmup-hero-progress-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-family:var(--fd);font-size:13.5px;font-weight:600;color:#fff}
.warmup-hero-progress-pct{color:#F8C44F}
.warmup-hero-bar{margin-top:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden}
.warmup-hero-bar-fill{height:100%;width:0%;border-radius:999px;background:#F8C44F;transition:width .2s ease}
.warmup-hero-sessions{margin-top:10px;font-size:12.5px;color:rgba(255,255,255,.7)}
.warmup-completion-banner{margin-top:1.4rem;padding:20px 22px;border-radius:var(--rmd);background:var(--done-l);border:1px solid rgba(15,110,86,.25);text-align:center}
.warmup-completion-title{font-family:var(--fd);font-size:19px;font-weight:600;color:var(--done)}
.warmup-completion-sub{margin-top:6px;font-size:13.5px;color:var(--ink)}
.warmup-completion-btn{margin-top:14px;min-height:48px;padding:12px 26px;border-radius:999px;border:1px solid transparent;background:var(--blue);color:#fff;font-family:var(--fd);font-size:15px;font-weight:600;cursor:pointer}
.warmup-completion-btn:hover{background:#001DD9}
.warmup-video-link{display:inline-flex;align-items:center;gap:6px;margin-top:1.1rem;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--blue);text-decoration:none}
.warmup-video-link:hover{color:var(--blue-m)}
.warmup-list{display:flex;flex-direction:column;gap:26px;margin-top:1.4rem}
.warmup-row{display:flex;gap:14px;padding:24px 22px;background:var(--s1);border-radius:var(--rlg);box-shadow:0 1px 2px rgba(14,16,32,.04),0 10px 24px -10px rgba(14,16,32,.16);transition:background .2s ease,box-shadow .2s ease}
.warmup-row.active{box-shadow:0 0 0 2px rgba(0,34,255,.35),0 10px 24px -10px rgba(14,16,32,.16)}
.warmup-row.checked{background:var(--done-l);box-shadow:0 1px 2px rgba(15,110,86,.05),0 10px 24px -10px rgba(15,110,86,.18)}
.warmup-check{flex:none;width:30px;height:30px;margin-top:1px;border-radius:999px;border:1.5px solid var(--bd3);background:var(--s1);color:transparent;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.warmup-check:hover{border-color:var(--done)}
.warmup-check.checked{border-color:var(--done);background:var(--done);color:#fff}
.warmup-body{min-width:0;flex:1}
.warmup-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:5px 12px}
.warmup-name{font-family:var(--fd);font-size:15px;font-weight:600;color:var(--ink);line-height:1.35}
.warmup-row.checked .warmup-name{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink3)}
.warmup-dose{flex:none;font-family:var(--fm);font-size:11.5px;font-weight:500;color:var(--blue);white-space:nowrap}
.warmup-cue{margin-top:8px;font-size:13.5px;color:var(--ink2);line-height:1.55}
.warmup-ts{display:inline-flex;align-items:center;gap:4px;margin-top:14px;font-family:var(--fm);font-size:11.5px;font-weight:500;color:var(--ink3);text-decoration:none}
.warmup-ts:hover{color:var(--blue)}
.warmup-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.warmup-reset{flex:none;padding:0;background:none;border:none;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--blue);cursor:pointer}

.date-input{width:200px;max-width:100%;min-height:56px;padding:12px 14px;border:1px solid var(--bd2);border-radius:var(--rmd);font-family:var(--fb);font-size:16px;color:var(--ink);background:var(--s1)}

@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;scroll-behavior:auto!important} }
@media (prefers-reduced-motion: no-preference){ .btn,.choice,.opt input:checked + .choice{transition:background .15s, border-color .15s, color .15s} }
</style>
</head>
<body>
<div id="app">

  <!-- ══════════ SPLASH — dismissed by tapping any nav tab, never auto-advances ══════════ -->

  <!-- ══════════ MONTH ══════════ -->

       via the "See this month →" links in the This week dashboard's signal sections. -->
  <div class="dash" id="view-trends" role="tabpanel" aria-labelledby="tab-dash" hidden></div>

  <!-- ══════════ WARM UP ══════════ -->

<script>
"use strict";

// An earlier build registered a cache-first service worker that precaches
// index.html forever, so returning visitors never see a new deploy. This
// app ships no service worker — tear down any leftover registration/cache
// from that build so published updates actually reach people who've
// visited before.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(reg){ reg.unregister(); });
  });
}
if(window.caches && caches.keys){
  caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); });
}

(function(){

  // ═══════════════════════════════════════════════════════════════
  // QUESTIONS — same vocabulary as the earlier prototypes (disc / duration /
  // intensity / a1 / a2 / a3 / rpe / b2 / b3), so a session logged here

  // ═══════════════════════════════════════════════════════════════
  var QUESTIONS = [
    {
      k:'date', type:'date',
      legend:'Which day was this session?',
      hint:'Defaults to today — change it if you’re logging one from earlier in the week.'
    },
    {

      legend:'Which session was it?',
      hint:'',
      opts:[
        {v:'swim', label:'Swim'}, {v:'bike', label:'Bike'}, {v:'run', label:'Run'},

      ]
    },
    {
      k:'b3', layout:'list',
      legend:'Any pain, tightness or niggle?',
      hint:'Not tiredness — something physical. Asked early because this one answer can force a caution for the whole week.',
      opts:[
        {v:'nothing', label:'Nothing', sev:'sev-1'},

    },
    {
      k:'duration', layout:'grid3', mono:true,
      legend:'Roughly how long?',

      opts:[
        {v:'30', label:'≤ 45 min'},
        {v:'60', label:'45–90 min'},
        {v:'120', label:'90 min +'}

    },
    {
      k:'intensity', layout:'list', tick:true,
      legend:'Was it meant to be easy or hard?',

    {
      k:'rpe', layout:'grid3',
      legend:'How hard was it?',

    {

        {v:'short', label:'Shortened, same structure'},

    {
      k:'a3', layout:'list', tick:true, onlyLong:true,

      hint:'Asked because you logged a session over 45 minutes.',

    },
    {
      k:'b2', layout:'list',
      legend:'How did it feel?',
      hint:'Affect, not effort. Three flat or rough sessions is what moves your state.',

        {v:'solid',  label:'Solid',  sev:'sev-solid'},
        {v:'flat',   label:'Flat',   sev:'sev-flat'},
        {v:'rough',  label:'Rough',  sev:'sev-rough'}
      ]
    }
  ];
  var QUESTIONS_BY_KEY = {};
  QUESTIONS.forEach(function(q){ QUESTIONS_BY_KEY[q.k] = q; });

  // Pages group multiple questions onto one screen while keeping each
  // question's own heading/hint/choices unchanged — see steps() below.
  // b3 (niggle) and a3 (fuelling, onlyLong) stay on their own pages.
  var PAGE_GROUPS = [
    ['date', 'disc'],
    ['b3'],
    ['duration', 'intensity', 'rpe', 'a1'],
    ['a3'],
    ['a2', 'b2']
  ];

  var DISC_LABEL = {swim:'Swim',bike:'Bike',run:'Run',brick:'Brick',strength:'Strength'};

  var PERIOD = [
    {v:'base',   label:'Base / Taper'},
    {v:'build1', label:'Build 1'},
    {v:'build2', label:'Build 2'},
    {v:'peak',   label:'Peak'}

  var PERIOD_LABEL = {};
  PERIOD.forEach(function(p){ PERIOD_LABEL[p.v] = p.label; });
  var PERIOD_PILL_CLASS = {base:'phase-base', build1:'phase-build', build2:'phase-build', peak:'phase-peak'};

  // ═══════════════════════════════════════════════════════════════
  // WARM UP — dryland mobility routines, one per discipline. Content
  // transcribed from the source videos linked per exercise below (t=
  // params are the timestamps quoted in each breakdown).
  // ═══════════════════════════════════════════════════════════════
  var WARMUP_DATA = {
    swim: {
      label: 'Swim', video: 'n_H_YMPlEkY',
      titlePre: 'Shoulder & spine ', titleEm: 'mobility', titlePost: ' warm-up',
      desc: 'Loosen the shoulders, thoracic spine and hips before you get in the water — dynamic movement, not static holds, to keep the muscles explosive-ready.',
      structure: '6 exercises · about 8 minutes',
      equipment: 'A resistance band for pull-aparts — bodyweight for the rest',
      exercises: [
        {name:'Arm Swings', dose:'~20 reps', ts:21, cue:'Move your arms up, down, and across your body, adding slight spinal rotations to open the chest, shoulders and lats. Dynamic movement is prioritised over static holds (like holding a stretch in a doorway) to keep the muscles explosive-ready.'},
        {name:'Walk Out with a Twist', dose:'5 reps', ts:73, cue:'Hinge at the hips, walk your hands out into a plank position, and step your right foot outside your right hand. Reach your right arm to the ceiling, then repeat the lunge and twist on the left. Walk your hands back to your feet and stand.'},
        {name:'Band Pull-Aparts', dose:'20 reps', ts:161, cue:'Hold a resistance band with palms facing up. Lock your shoulder blades down and pull the band apart at chest height — don’t let your shoulders shrug toward your ears, to properly activate the smaller stabilising muscles.'},
        {name:'Scapula Push-Ups', dose:'', ts:253, cue:'Kneel in a modified plank with hands directly under your shoulders. Keeping your arms straight, drop your chest toward the floor, then press your mid-back toward the ceiling.'},
        {name:'Dead Bugs', dose:'', ts:341, cue:'On your back, knees raised to a 90° tabletop, arms pointing straight up. Slowly extend your right arm and left leg, return to centre, and alternate sides. Keep your lower back flat and glued to the floor throughout.'},
        {name:'Hip Bridges', dose:'~15 reps', ts:436, cue:'On your back, knees bent, feet planted. Tuck your pelvis, engage your core, and squeeze your glutes to lift your hips. Pause briefly at the top without over-arching your back, then lower slowly.'}
      ]
    },
    bike: {
      label: 'Bike', video: 'zp_-SNNvph8',
      titlePre: 'Hips, ankles & ', titleEm: 'lower back', titlePost: ' warm-up',
      desc: 'Open up the hips, spine and ankles before you clip in — mobility, not a stretch session.',
      structure: '8 exercises · about 6 minutes',
      equipment: 'None — bodyweight only',
      exercises: [
        {name:'4-Way Wrist Circles', dose:'', ts:6, cue:'Switch your hand position with every repetition to mobilise the wrists.'},
        {name:'Cat-Cow', dose:'', ts:55, cue:'Alternate between rounding your upper back and opening up your chest.'},
        {name:'Knee & Ankle Circles', dose:'', ts:105, cue:'Stand on one leg and move your opposite lower leg in a circular, pendulum motion.'},
        {name:'Knee & Ankle Circles — opposite leg', dose:'', ts:155, cue:'Switch legs and repeat the circular motion on the other side.'},
        {name:'Good Mornings', dose:'', ts:205, cue:'Push your hips back into a hinge position while maintaining a slight bend in your knees.'},
        {name:'Inchworm to Walk the Dog', dose:'', ts:255, cue:'Roll down to the floor, walk your hands out to a high plank, and press back into a downward dog.'},
        {name:'Alternating Quad Stretch', dose:'', ts:305, cue:'From a seated position, extend your hips to stretch the quad, alternating sides.'},
        {name:'Alternating Pendulum', dose:'', ts:355, cue:'On your back, both knees bent, rotate your legs side to side to loosen the lower back.'}
      ]
    },
    run: {
      label: 'Run', video: '3WUtJxLv-wI',
      titlePre: 'Ankles, hips & ', titleEm: 'shoulders', titlePost: ' warm-up',
      desc: 'Wake up the ankles and hips and prime the arm drive before you head out the door.',
      structure: '10 exercises · about 7 minutes',
      equipment: 'A wall for balance on a few moves',
      exercises: [
        {name:'Ankle Inversion / Eversion', dose:'', ts:10, cue:'Standing, roll one ankle inward and outward through its full range of motion, then switch sides.'},
        {name:'Ankle Rocks', dose:'', ts:44, cue:'Rock back and forth from your heels to your toes — use a wall for balance if needed. Targets dorsiflexion and plantar flexion while strengthening the anterior tibialis and calves.'},
        {name:'Hip Flexion Pulls', dose:'', ts:80, cue:'Bring your knee toward your chest, rotate your thigh outward, and grab the outside of your foot. Alternate legs, adding a forward and backward stepping motion, as if walking.'},
        {name:'Standing Twists', dose:'', ts:116, cue:'Knuckles to your temples, thumbs pointing down. Bring one knee up and twist your torso so the opposite elbow meets the knee. Alternate sides.'},
        {name:'Forward / Back Leg Swings', dose:'10 reps/side', ts:148, cue:'Support yourself against a wall and swing one leg forward and backward like a pendulum. Keep your core engaged — isolate the movement to the hip socket rather than arching your lower back.'},

        {name:'Spinal Rolls', dose:'2 reps', ts:362, cue:'From the forward fold, slowly roll your spine up to standing, open your chest, then tuck your chin and slowly roll back down.'}

    }

  function warmupVideoUrl(disc, ts){
    var v = WARMUP_DATA[disc].video;
    return 'https://www.youtube.com/watch?v=' + v + (ts ? ('&t=' + ts + 's') : '');
  }
  function warmupTsLabel(ts){
    var m = Math.floor(ts/60), s = ts % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  var PLANNED_SESSIONS_PER_WEEK = 8;
  var WEEK_FLOOR_FRACTION = 0.6;
  var WEEK_FLOOR = Math.ceil(WEEK_FLOOR_FRACTION * PLANNED_SESSIONS_PER_WEEK);

  // ═══════════════════════════════════════════════════════════════
  // STORAGE — the Google Sheet (see GOOGLE SHEET SYNC below) is the source
  // of truth for logged sessions, so the same log reads the same on the
  // phone and the laptop. localStorage is only a same-device cache: it
  // paints the last-known state instantly on load and is what's used if a
  // fetch from the Sheet fails (offline, blocked request, etc). No account,
  // no server of our own.
  // ═══════════════════════════════════════════════════════════════
  var LOG_KEY = 'triMomentumLog_v1';
  var PHASE_KEY = 'triMomentumPhase_v1';
  var WARMUP_SESSIONS_KEY = 'triMomentumWarmupSessions_v1';
  var RACES_KEY = 'triMomentumRaces_v1';
  var storageOk = true;
  try{ window.localStorage.setItem('__tri_test__','1'); window.localStorage.removeItem('__tri_test__'); }
  catch(e){ storageOk = false; }

  function loadLog(){
    if(!storageOk){ return []; }
    try{
      var raw = window.localStorage.getItem(LOG_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch(e){ return []; }
  }
  function persistLog(){
    if(!storageOk){ return; }
    try{ window.localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch(e){ /* storage full/unavailable — session stays in memory for this visit */ }
  }
  function loadPhase(){
    if(!storageOk){ return null; }
    try{ return window.localStorage.getItem(PHASE_KEY) || null; } catch(e){ return null; }
  }
  function persistPhase(v){
    if(!storageOk){ return; }
    try{ window.localStorage.setItem(PHASE_KEY, v); } catch(e){}
  }
  // All-time "mark complete" counts per warm-up discipline — same idea as
  // the Strength mini-apps' sessionsCompleted counter, kept device-local
  // (it's a personal streak count, not something that needs Sheet sync).
  function loadWarmupSessions(){
    if(!storageOk){ return {swim:0,bike:0,run:0}; }
    try{
      var raw = window.localStorage.getItem(WARMUP_SESSIONS_KEY);
      var obj = raw ? JSON.parse(raw) : {};
      return {swim: obj.swim|0, bike: obj.bike|0, run: obj.run|0};
    } catch(e){ return {swim:0,bike:0,run:0}; }
  }
  function persistWarmupSessions(){
    if(!storageOk){ return; }
    try{ window.localStorage.setItem(WARMUP_SESSIONS_KEY, JSON.stringify(state.warmupSessions)); } catch(e){}
  }
  function loadRaces(){
    if(!storageOk){ return []; }
    try{
      var raw = window.localStorage.getItem(RACES_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch(e){ return []; }
  }
  function persistRaces(){
    if(!storageOk){ return; }
    try{ window.localStorage.setItem(RACES_KEY, JSON.stringify(races)); } catch(e){}
  }

  // ═══════════════════════════════════════════════════════════════
  // GOOGLE SHEET SYNC — the Sheet is the cross-device source of truth (see
  // STORAGE above). Every saved session is written here, and the log is
  // read back from here on load and whenever the This week / Month tabs
  // are opened, so a session logged on the phone shows up on the laptop.
  //
  // Endpoint is a Google Apps Script Web App bound to
  // https://docs.google.com/spreadsheets/d/15I6fMqoJjlakSrmbqgPkgz44eZ955LOUUrlvUh3IRy0/edit
  // — see apps-script/Code.gs for the script and column schema.
  //
  // Writes stay fire-and-forget (mode:'no-cors', opaque response) — a
  // failed or blocked write never blocks the check-in itself, and the
  // entry still shows locally this session via the optimistic log.push in
  // save(). Reads use the default 'cors' mode since the response body
  // actually needs to be parsed; the endpoint answers cross-origin GETs
  // fine (Apps Script Web Apps set permissive CORS headers by default).
  // ═══════════════════════════════════════════════════════════════
  var TRAINING_LOG_WRITE_URL = 'https://script.google.com/macros/s/AKfycbxqgAW5vtM3OonTIFQk_634WJLlk2f5YujJ5D65Nw76l8shoj4R1pf2zgrmHmKzY7_e_g/exec';
  var TRAINING_LOG_READ_URL = TRAINING_LOG_WRITE_URL + '?list=1';
  function submitSessionToSheet(entry){
    if(!TRAINING_LOG_WRITE_URL){ return; }
    var payload = {
      when: entry.date, disc: entry.disc, duration: entry.duration, intensity: entry.intensity,
      rpe: entry.rpe, a1: entry.a1, a2: entry.a2, a3: entry.a3, b2: entry.b2, b3: entry.b3,
      note: entry.note, phase: entry.phase
    };
    try{
      fetch(TRAINING_LOG_WRITE_URL, {
        method: 'POST', mode: 'no-cors',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      });
    } catch(err){ /* best-effort — never let a sync failure disrupt the check-in flow */ }
  }

  // Inverse of the payload built in submitSessionToSheet — same field
  // names, so a session round-trips through the Sheet unchanged. Sheet
  // rows have no loggedAt (that's local-only bookkeeping and nothing
  // reads it back), so it comes back null; entries are already in
  // chronological order because appendRow only ever adds to the bottom.
  function parseSheetSession(row){
    return {
      date: row.when || '', disc: row.disc || '', intensity: row.intensity || '',
      duration: row.duration === '' || row.duration == null ? null : row.duration,
      a1: row.a1 || null, a2: row.a2 || null, a3: row.a3 || null,
      rpe: row.rpe === '' || row.rpe == null ? null : parseInt(row.rpe, 10),
      b2: row.b2 || null, b3: row.b3 || null,
      note: row.note || '', phase: row.phase || null, loggedAt: null
    };
  }
  var sheetFetchInFlight = null;
  // Fetches the full log from the Sheet and replaces the in-memory/cached
  // copy with it. Returns a promise so callers can re-render once fresh
  // data lands; failures (offline, blocked request) just keep whatever was
  // already loaded — never throws past this function.
  function refreshLogFromSheet(){
    if(sheetFetchInFlight){ return sheetFetchInFlight; }
    sheetFetchInFlight = fetch(TRAINING_LOG_READ_URL)
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(!data || !data.ok || !Array.isArray(data.sessions)){ throw new Error('bad response'); }
        log = data.sessions.map(parseSheetSession);
        persistLog();
        return true;
      })
      .catch(function(){ return false; })
      .then(function(ok){ sheetFetchInFlight = null; return ok; });
    return sheetFetchInFlight;
  }

  var log = loadLog(); // cached copy; replaced by refreshLogFromSheet() as soon as the Sheet responds — see STORAGE above

  // ═══════════════════════════════════════════════════════════════
  // RACE CALENDAR SYNC — same Sheet, same pattern as the session log above:
  // a second sheet tab ("Races", created on demand by Code.gs) is the
  // cross-device source of truth. Adds/deletes are fire-and-forget no-cors
  // writes; the race `id` is generated here on the client (not by the
  // Sheet) specifically so a delete never needs to read an id back out of
  // an opaque add response.
  // ═══════════════════════════════════════════════════════════════
  var RACES_READ_URL = TRAINING_LOG_WRITE_URL + '?races=1';
  function newRaceId(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function submitRaceToSheet(action, race){
    if(!TRAINING_LOG_WRITE_URL){ return; }
    try{
      fetch(TRAINING_LOG_WRITE_URL, {
        method: 'POST', mode: 'no-cors',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({ kind: 'race', action: action, race: race })
      });
    } catch(err){ /* best-effort — same trade-off as submitSessionToSheet */ }
  }
  var racesFetchInFlight = null;
  function refreshRacesFromSheet(){
    if(racesFetchInFlight){ return racesFetchInFlight; }
    racesFetchInFlight = fetch(RACES_READ_URL)
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(!data || !data.ok || !Array.isArray(data.races)){ throw new Error('bad response'); }
        races = data.races;
        persistRaces();
        return true;
      })
      .catch(function(){ return false; })
      .then(function(ok){ racesFetchInFlight = null; return ok; });
    return racesFetchInFlight;
  }

  var races = loadRaces(); // cached copy; replaced by refreshRacesFromSheet() as soon as the Sheet responds

  // ── Dates ─────────────────────────────────────────────────────
  var MONTH_DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  function isoDate(d){
    var y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
    return y + '-' + (m<10?'0':'')+m + '-' + (day<10?'0':'')+day;
  }
  function todayISO(){ return isoDate(new Date()); }
  var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function formatDateLabel(iso){
    if(!iso){ return null; }
    if(iso === todayISO()){ return 'Today'; }
    var d = new Date(iso + 'T00:00:00');
    return MONTH_DAYS[(d.getDay() + 6) % 7] + ' ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()];
  }
  function mondayOf(d){
    var m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var dayNum = (m.getDay() + 6) % 7; // 0 = Monday
    m.setDate(m.getDate() - dayNum);
    return m;
  }
  function addDays(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function isoWeekNumber(d){
    var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var dayNum = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    var firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
    var diff = date - firstThursday;
    return 1 + Math.round(diff / (7 * 86400000));
  }
  function weekKey(d){ return isoDate(mondayOf(d)); }

  // ── Races ─────────────────────────────────────────────────────
  function formatRaceDateLabel(iso){
    var d = new Date(iso + 'T00:00:00');
    return MONTH_DAYS[(d.getDay() + 6) % 7] + ' ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();
  }
  // Whole days between today and iso (positive = future). Both sides are
  // taken at local midnight so a race "today" always reads as 0, never -1
  // or 1 depending on time of day.
  function daysUntil(iso){
    var today = new Date(); today.setHours(0,0,0,0);
    var target = new Date(iso + 'T00:00:00');
    return Math.round((target - today) / 86400000);
  }
  function raceCountdownLabel(days){
    if(days === 0){ return 'Today'; }
    if(days === 1){ return 'Tomorrow'; }
    if(days < 7){ return days + ' days'; }
    var weeks = Math.floor(days / 7), rem = days % 7;
    var label = weeks + (weeks === 1 ? ' week' : ' weeks');
    if(rem){ label += ' · ' + rem + (rem === 1 ? ' day' : ' days'); }
    return label;
  }
  function upcomingRaces(){
    var today = todayISO();
    return races.filter(function(r){ return r.date >= today; })
      .sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  function pastRaces(){
    var today = todayISO();
    return races.filter(function(r){ return r.date < today; })
      .sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  }
  function nextRace(){
    var up = upcomingRaces();
    return up.length ? up[0] : null;
  }

  // Real calendar week (Mon–Sun) containing `anchor`, built from the actual
  // log — no fabricated sessions, no seeded demo days.
  function buildWeek(anchorMonday){
    var today = todayISO();
    return MONTH_DAYS.map(function(abbr, i){
      var date = addDays(anchorMonday, i);
      var dISO = isoDate(date);
      var entries = log.filter(function(e){ return e.date === dISO; });
      var session = entries.length ? entries[entries.length-1] : null;
      var what = entries.map(function(e){
        var intensityLabel = e.intensity === 'hard' ? 'hard' : e.intensity === 'moderate' ? 'moderate' : 'easy';
        return (DISC_LABEL[e.disc]||'Session') + ' · ' + intensityLabel + ' · RPE ' + e.rpe;
      }).join('; ');
      var state;
      if(entries.length){ state = 'logged'; }
      else if(dISO > today){ state = 'upcoming'; }
      else { state = 'open'; }
      return {day: abbr, date: dISO, what: what, state: state, session: session, entries: entries};
    });
  }

  function currentWeekDays(){ return buildWeek(mondayOf(new Date())); }

  function monthWeekLabel(weekNum, phaseKey, isCurrent){
    var parts = ['Week ' + weekNum, PERIOD_LABEL[phaseKey] || phaseKey || 'Unset phase'];
    if(isCurrent){ parts.push('this week'); }
    return parts.join(' · ');
  }

  // Weeks to show in Month: every week (going back) that has at least one
  // logged session, plus the current week always — capped to 6 so a long
  // history doesn't turn into an endless scroll on a phone.
  var MAX_MONTH_WEEKS = 6;
  function monthWeeks(){
    var todayMonday = mondayOf(new Date());
    var weeks = [];
    for(var i = 0; i < 26 && weeks.length < MAX_MONTH_WEEKS; i++){
      var monday = addDays(todayMonday, -7*i);
      var days = buildWeek(monday);
      var hasAny = days.some(function(d){ return d.entries.length; });
      var isCurrent = i === 0;
      if(!hasAny && !isCurrent){ continue; }
      var phaseCounts = {};
      days.forEach(function(d){ d.entries.forEach(function(e){ if(e.phase){ phaseCounts[e.phase] = (phaseCounts[e.phase]||0)+1; } }); });
      var topPhase = null, topN = 0;
      Object.keys(phaseCounts).forEach(function(p){ if(phaseCounts[p] > topN){ topN = phaseCounts[p]; topPhase = p; } });
      var weekNum = isoWeekNumber(monday);
      var phaseKey = topPhase || state.periodisation;
      weeks.push({
        wk: monthWeekLabel(weekNum, phaseKey, isCurrent),
        weekNum: weekNum, phaseKey: phaseKey, isCurrent: isCurrent,
        days: days
      });
    }
    return weeks.reverse();
  }

  // ── State ─────────────────────────────────────────────────────
  var state = {
    ans: {date: todayISO()},
    step: 0,
    mode: 'ask',       // 'ask' | 'review' | 'saved'
    note: '',
    periodisation: loadPhase(),
    monthSignal: 'intensity',
    weekSignal: 'intensity',
    warmupDisc: 'swim',
    warmupChecked: {},
    warmupSessions: loadWarmupSessions(),
    warmupLogged: {}
  };
  var phaseReturnView = 'flow';

  function isLong(v){ return v !== null && v !== undefined && parseInt(v,10) > 45; }
  function asked(q){ return !q.onlyLong || isLong(state.ans.duration); }
  // Each "step" is a page — an array of one or more questions rendered
  // together (see PAGE_GROUPS). A page whose questions are all filtered
  // out by asked() (e.g. the fuelling-only page on a short session)
  // disappears entirely rather than leaving a blank step.
  function steps(){
    return PAGE_GROUPS
      .map(function(keys){ return keys.map(function(k){ return QUESTIONS_BY_KEY[k]; }).filter(asked); })
      .filter(function(page){ return page.length > 0; });
  }
  function allQuestions(list){ return list.reduce(function(a, page){ return a.concat(page); }, []); }
  function missing(){ return allQuestions(steps()).filter(function(q){ return !state.ans[q.k]; }); }
  function pageIndexOfKey(list, key){
    for(var i=0;i<list.length;i++){
      for(var j=0;j<list[i].length;j++){
        if(list[i][j].k === key){ return i; }
      }
    }
    return 0;
  }
  function optionFor(q, v){
    for(var i=0;i<q.opts.length;i++){ if(q.opts[i].v === v){ return q.opts[i]; } }
    return null;
  }
  function loggedCountThisWeek(){ return currentWeekDays().reduce(function(n,d){ return n + d.entries.length; }, 0); }

  // ═══════════════════════════════════════════════════════════════
  // SIGNALS
  // ═══════════════════════════════════════════════════════════════
  var DASH_DISCIPLINES = ['swim','bike','run','brick','strength'];
  var DRIFT_CAT = {intent:'good', slight:'mid', well:'bad'};
  var FUEL_CAT  = {race:'good', lighter:'mid', no:'bad'};
  var STAT_MIN_N = 8;
  var NUMBER_WORDS = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine'];
  function numWord(n){ return (n >= 0 && n < 10) ? NUMBER_WORDS[n] : String(n); }
  function driftCat(session){ return session ? (DRIFT_CAT[session.a1] || null) : null; }
  function fuelCat(session){
    if(!session || !isLong(session.duration)) return null;
    return FUEL_CAT[session.a3] || null;
  }
  function tallyDays(days, catFn){
    var t = {good:0, mid:0, bad:0, total:0};
    days.forEach(function(d){
      if(!d.session){ return; }
      var c = catFn(d.session);
      if(c){ t[c]++; t.total++; }
    });
    return t;
  }
  function dashPct(t){ return t.total ? Math.round(t.good / t.total * 100) : 0; }
  function dashCellClass(dayEntry, disc, catFn){
    if(!dayEntry.session || dayEntry.session.disc !== disc){ return 'dash-cell'; }
    var c = catFn(dayEntry.session);
    return c ? ('dash-cell ' + c) : 'dash-cell na';
  }
  function dashMatrixHeader(sub, weekLabel){
    var hd = el('div', 'dash-matrix-hd');
    if(weekLabel){ hd.appendChild(el('div', 'dash-matrix-week', weekLabel)); }
    if(sub){
      hd.appendChild(el('div', 'dash-matrix-rule'));
      hd.appendChild(el('div', 'dash-matrix-sub', sub));
    }
    return hd;
  }
  function dashMatrixGrid(catFn, days){
    var grid = el('div', 'dash-grid');
    grid.appendChild(el('div'));
    days.forEach(function(d){ grid.appendChild(el('div', 'dash-grid-day', d.day.charAt(0))); });
    DASH_DISCIPLINES.forEach(function(disc){
      grid.appendChild(el('div', 'dash-grid-disc', DISC_LABEL[disc]));
      days.forEach(function(d){ grid.appendChild(el('div', dashCellClass(d, disc, catFn))); });
    });
    return grid;
  }
  function dashMatrix(sub, catFn, days, weekLabel){
    var frag = document.createDocumentFragment();
    frag.appendChild(dashMatrixHeader(sub, weekLabel));
    frag.appendChild(dashMatrixGrid(catFn, days));
    return frag;
  }
  function renderStatBar(t, bigDesc){
    var frag = document.createDocumentFragment();
    var big = el('div', 'dash-stat-big');
    var pctEl = el('div', 'dash-stat-pct', String(dashPct(t)));
    pctEl.appendChild(el('span', 'u', '%'));
    big.appendChild(pctEl);
    big.appendChild(el('div', 'dash-stat-desc', bigDesc));
    frag.appendChild(big);
    var bar = el('div', 'tri-bar');
    var barColors = {good:'var(--dash-good)', mid:'var(--dash-mid)', bad:'var(--dash-bad)'};
    ['good','mid','bad'].forEach(function(k){
      if(!t[k]){ return; }
      var seg = document.createElement('span');
      seg.style.flex = String(t[k]);
      seg.style.background = barColors[k];
      bar.appendChild(seg);
    });
    frag.appendChild(bar);
    return frag;
  }
  function renderSignalBody(wrap, t, catFn, insight, opts, days){
    // The week-number row sits right under the section eyebrow (data-label,
    // rendered via ::before) and above everything else, "this week" only —
    // month blocks already carry their own per-week heading, so they keep
    // the matrix in its usual spot right before the grid.
    if(opts.weekLabel){ wrap.appendChild(dashMatrixHeader(null, opts.weekLabel)); }
    var strip = el('div', 'dash-insight-strip');
    strip.style.borderLeftColor = 'var(--dash-' + insight.severity + ')';
    strip.style.background = 'color-mix(in srgb, var(--dash-' + insight.severity + ') 12%, var(--s1))';
    strip.appendChild(el('p', 'dash-insight-strip-headline', insight.headline));
    wrap.appendChild(strip);
    var hd = el('div', 'dash-stat-hd');
    hd.appendChild(el('div', 'dash-stat-n', opts.nText));
    wrap.appendChild(hd);
    if(t.total >= STAT_MIN_N){ wrap.appendChild(renderStatBar(t, opts.bigDesc)); }
    var counts = el('div', 'dash-counts');
    function countEl(n, label2, color){
      var s = document.createElement('span');
      var b = document.createElement('b');
      b.style.color = color;
      b.textContent = String(n);
      s.appendChild(b);
      s.appendChild(document.createTextNode(' ' + label2));
      return s;
    }
    counts.appendChild(countEl(t.good, opts.goodLabel, 'var(--dash-good)'));
    counts.appendChild(countEl(t.mid, opts.midLabel, 'var(--dash-mid)'));
    counts.appendChild(countEl(t.bad, opts.badLabel, 'var(--dash-bad)'));
    wrap.appendChild(counts);
    if(opts.weekLabel){
      wrap.appendChild(dashMatrixHeader(opts.matrixSub, null));
      wrap.appendChild(dashMatrixGrid(catFn, days));
    } else {
      wrap.appendChild(dashMatrix(opts.matrixSub, catFn, days));
    }
  }
  function dashSignalSection(label, t, catFn, insight, opts, days){
    var wrap = el('div', 'dash-section dash-signal');
    wrap.setAttribute('data-label', label);
    renderSignalBody(wrap, t, catFn, insight, opts, days);
    var link = document.createElement('button');
    link.type = 'button';
    link.className = 'dash-signal-link';
    link.textContent = 'See this month →';
    link.addEventListener('click', function(){ goToMonth(opts.signal); });
    wrap.appendChild(link);
    return wrap;
  }
  function dashLegendItem(color, label, hairline){
    var it = el('div', 'dash-legend-item');

    sw.className = 'dash-legend-sw';

    else{ sw.style.background = color; }

    it.appendChild(document.createTextNode(label));
    return it;
  }
  function dashLegend(){
    var legend = el('div', 'dash-legend');
    legend.appendChild(dashLegendItem('var(--dash-good)', 'on plan'));
    legend.appendChild(dashLegendItem('var(--dash-mid)', 'slightly off'));
    legend.appendChild(dashLegendItem('var(--dash-bad)', 'well off'));
    legend.appendChild(dashLegendItem(null, 'not asked', true));
    legend.appendChild(dashLegendItem('var(--s4)', 'no session'));
    return legend;
  }
  function dashPhaseSection(){
    var wrap = el('div', 'dash-section dash-phase');
    wrap.setAttribute('data-label', 'Training phase');
    var pills = el('div', 'dash-phase-pills');
    PERIOD.forEach(function(p){
      pills.appendChild(el('div', 'dash-phase-pill' + (state.periodisation === p.v ? ' is-current' : ''), p.label));
    });
    wrap.appendChild(pills);
    var change = document.createElement('button');
    change.type = 'button';
    change.className = 'dash-phase-change';
    change.textContent = 'Change phase →';
    change.addEventListener('click', function(){ openPhasePicker(); });
    wrap.appendChild(change);
    return wrap;
  }

  function computeSignalFacts(weeks, catFn){
    var badCount = 0, goodCount = 0, total = 0, compoundPairs = 0, firstPair = null;
    var bounceBackPairs = 0, firstBounceBack = null, prevBad = null, curStreak = 0, goodStreak = 0;
    weeks.forEach(function(w){
      w.days.forEach(function(d){
        if(!d.session){ return; }
        var cat = catFn(d.session);
        if(cat === null){ return; }
        total++;
        if(cat === 'good'){
          goodCount++; curStreak++;
          if(curStreak > goodStreak){ goodStreak = curStreak; }
          if(prevBad){
            bounceBackPairs++;
            if(!firstBounceBack){ firstBounceBack = {day1: prevBad.day, disc1: DISC_LABEL[prevBad.disc], day2: d.day, disc2: DISC_LABEL[d.session.disc]}; }
          }
          prevBad = null;
        } else if(cat === 'bad'){
          curStreak = 0; badCount++;
          if(prevBad){
            compoundPairs++;
            if(!firstPair){ firstPair = {day1: prevBad.day, disc1: DISC_LABEL[prevBad.disc], day2: d.day, disc2: DISC_LABEL[d.session.disc]}; }
          }
          prevBad = {day: d.day, disc: d.session.disc};
        } else {
          curStreak = 0; prevBad = null;
        }
      });
    });
    return {badCount:badCount, goodCount:goodCount, total:total, compoundPairs:compoundPairs, firstPair:firstPair, bounceBackPairs:bounceBackPairs, firstBounceBack:firstBounceBack, goodStreak:goodStreak};
  }

  var DRIFT_INSIGHT_RULES = [
    {id:'compound_drift_2plus', priority:10, severity:'bad',
      match:function(f){ return f.compoundPairs >= 2; },
      headline:function(f){ return numWord(f.compoundPairs) + ' times this week, a session that ran well over intent was followed by another one running well over intent — that’s the pattern that turns into a niggle or a missed session, so check whether recovery between them is long enough.'; }},
    {id:'compound_drift_1', priority:20, severity:'bad',
      match:function(f){ return f.compoundPairs === 1; },
      headline:function(f){ return 'Your ' + f.firstPair.disc1 + ' on ' + f.firstPair.day1 + ' ran well over intent, and the ' + f.firstPair.disc2 + ' on ' + f.firstPair.day2 + ' that followed did too — one data point, worth watching before it becomes a pattern.'; }},
    {id:'bounce_back_drift', priority:25, severity:'mid',
      match:function(f){ return f.badCount > 0 && f.compoundPairs === 0 && f.bounceBackPairs > 0; },
      headline:function(f){ return 'Your ' + f.firstBounceBack.disc1 + ' on ' + f.firstBounceBack.day1 + ' ran well over intent, but the ' + f.firstBounceBack.disc2 + ' on ' + f.firstBounceBack.day2 + ' right after landed back at intent — recovery did its job.'; }},
    {id:'isolated_drift_no_compound', priority:30, severity:'mid',
      match:function(f){ return f.badCount > 0 && f.compoundPairs === 0; },
      headline:function(f){ return numWord(f.badCount) + (f.badCount === 1 ? ' session ran' : ' sessions ran') + ' well over intent this week, but recovery held — no back-to-back pattern.'; }},
    {id:'clean_week_no_data', priority:45,
      match:function(f){ return f.total === 0; }, severity:'mid',
      headline:function(){ return 'No sessions logged yet this week.'; }},
    {id:'clean_week', priority:40, severity:'good',
      match:function(f){ return f.total > 0 && f.badCount === 0; },
      headline:function(f){
        if(f.goodStreak >= 5){ return 'Every session this week finished at the effort you intended — ' + numWord(f.goodStreak) + ' in a row, pacing held from first session to last.'; }
        return 'Every session this week finished at the effort you intended.';
      }}
  ];
  function resolveDriftInsight(facts){
    var matches = DRIFT_INSIGHT_RULES.filter(function(r){ return r.match(facts); });
    matches.sort(function(a,b){ return a.priority - b.priority; });
    return matches[0];
  }

  var FUEL_INSIGHT_RULES = [
    {id:'compound_fuel_2plus', priority:10, severity:'bad',
      match:function(f){ return f.compoundPairs >= 2; },
      headline:function(f){ return numWord(f.compoundPairs) + ' times this week, a long session that wasn’t fuelled was followed by another unfuelled long session — that’s the pattern that shows up as a bonk on race day, so check whether that first miss is carrying into the next one.'; }},
    {id:'compound_fuel_1', priority:20, severity:'bad',
      match:function(f){ return f.compoundPairs === 1; },
      headline:function(f){ return 'Your ' + f.firstPair.disc1 + ' on ' + f.firstPair.day1 + ' wasn’t fuelled, and the ' + f.firstPair.disc2 + ' on ' + f.firstPair.day2 + ' that followed wasn’t either — one data point, worth watching before under-fuelling becomes the default.'; }},
    {id:'bounce_back_fuel', priority:25, severity:'mid',
      match:function(f){ return f.badCount > 0 && f.compoundPairs === 0 && f.bounceBackPairs > 0; },
      headline:function(f){ return 'Your ' + f.firstBounceBack.disc1 + ' on ' + f.firstBounceBack.day1 + ' wasn’t fuelled, but the ' + f.firstBounceBack.disc2 + ' on ' + f.firstBounceBack.day2 + ' right after went back to race concentration — the miss didn’t repeat.'; }},
    {id:'isolated_fuel_no_compound', priority:30, severity:'mid',
      match:function(f){ return f.badCount > 0 && f.compoundPairs === 0; },
      headline:function(f){ return numWord(f.badCount) + (f.badCount === 1 ? ' long session wasn’t fuelled' : ' long sessions weren’t fuelled') + ' this week, but it didn’t carry into the next one.'; }},
    {id:'clean_month_fuel', priority:40, severity:'good',
      match:function(f){ return f.total > 0 && f.badCount === 0; },
      headline:function(f){
        if(f.goodStreak >= 5){ return 'Every long session this week was fuelled at race concentration — ' + numWord(f.goodStreak) + ' in a row, the habit is holding.'; }
        return 'Every long session this week was fuelled at race concentration.';
      }},
    {id:'no_long_sessions', priority:50, severity:'mid',
      match:function(f){ return f.total === 0; },
      headline:function(){ return 'No sessions over 45 min yet this week.'; }}
  ];
  function resolveFuelInsight(facts){
    var matches = FUEL_INSIGHT_RULES.filter(function(r){ return r.match(facts); });
    matches.sort(function(a,b){ return a.priority - b.priority; });
    return matches[0];
  }

  var WEEKDAY_FULL = {Mon:'Monday', Tue:'Tuesday', Wed:'Wednesday', Thu:'Thursday', Fri:'Friday', Sat:'Saturday', Sun:'Sunday'};
  var DISC_SINGULAR_NOUN = {swim:'swim', bike:'bike', run:'run', brick:'brick', strength:'strength session'};
  var DISC_PLURAL_NOUN   = {swim:'swims', bike:'bikes', run:'runs', brick:'bricks', strength:'strength sessions'};
  function disciplineWeekday(disc){
    var day = null, consistent = true;
    monthWeeks().forEach(function(w){
      w.days.forEach(function(d){
        if(!d.session || d.session.disc !== disc){ return; }
        if(day === null){ day = d.day; }
        else if(day !== d.day){ consistent = false; }
      });
    });
    return consistent ? day : null;
  }
  function disciplineTally(disc, catFn){
    var t = {good:0, mid:0, bad:0, total:0};
    monthWeeks().forEach(function(w){
      w.days.forEach(function(d){
        if(!d.session || d.session.disc !== disc){ return; }
        var c = catFn(d.session);
        if(c){ t[c]++; t.total++; }
      });
    });
    return t;
  }
  function disciplineSeverity(t){ return t.bad ? 'bad' : (t.mid ? 'mid' : 'good'); }
  function disciplineDriftHeadline(disc, t, weekday){
    var one  = weekday ? (WEEKDAY_FULL[weekday] + ' ' + DISC_SINGULAR_NOUN[disc]) : DISC_SINGULAR_NOUN[disc];
    var many = weekday ? (WEEKDAY_FULL[weekday] + ' ' + DISC_PLURAL_NOUN[disc])   : DISC_PLURAL_NOUN[disc];
    if(t.bad === t.total){ return 'Every ' + one + ' this month ran well over intent.'; }
    if(t.mid === t.total){ return 'Every ' + one + ' this month ran slightly over intent.'; }
    if(t.bad){ return numWord(t.bad) + ' of ' + numWord(t.total).toLowerCase() + ' ' + many + ' ran well over intent this month.'; }
    if(t.mid){ return numWord(t.mid) + ' of ' + numWord(t.total).toLowerCase() + ' ' + many + ' ran slightly over intent this month.'; }
    return 'Every ' + one + ' this month finished at the effort you intended.';
  }
  function disciplineFuelHeadline(disc, t, weekday){
    var one  = weekday ? (WEEKDAY_FULL[weekday] + ' ' + DISC_SINGULAR_NOUN[disc]) : DISC_SINGULAR_NOUN[disc];
    var many = weekday ? (WEEKDAY_FULL[weekday] + ' ' + DISC_PLURAL_NOUN[disc])   : DISC_PLURAL_NOUN[disc];
    if(t.bad === t.total){ return 'Every ' + one + ' over 45 min this month wasn’t fuelled.'; }
    if(t.mid === t.total){ return 'Every ' + one + ' over 45 min this month ran lighter than race concentration.'; }
    if(t.bad){ return numWord(t.bad) + ' of ' + numWord(t.total).toLowerCase() + ' ' + many + ' over 45 min weren’t fuelled this month.'; }
    if(t.mid){ return numWord(t.mid) + ' of ' + numWord(t.total).toLowerCase() + ' ' + many + ' over 45 min ran lighter than race concentration this month.'; }
    return 'Every ' + one + ' over 45 min this month was fuelled at race concentration.';
  }
  function renderDisciplineInsights(catFn, headlineFn){
    var wrap = el('div', 'dash-section');
    wrap.setAttribute('data-label', 'By discipline');
    var any = false;
    DASH_DISCIPLINES.forEach(function(disc){
      var t = disciplineTally(disc, catFn);
      if(!t.total){ return; }
      any = true;
      var weekday = disciplineWeekday(disc);
      var label = weekday ? (DISC_LABEL[disc] + ' · ' + WEEKDAY_FULL[weekday] + 's') : DISC_LABEL[disc];
      var severity = disciplineSeverity(t);
      var strip = el('div', 'dash-insight-strip');
      strip.style.borderLeftColor = 'var(--dash-' + severity + ')';
      strip.style.background = 'color-mix(in srgb, var(--dash-' + severity + ') 12%, var(--s1))';
      strip.appendChild(el('div', 'dash-insight-strip-label', label));
      strip.appendChild(el('p', 'dash-insight-strip-headline', headlineFn(disc, t, weekday)));
      wrap.appendChild(strip);
    });
    if(!any){ wrap.appendChild(el('p', 'empty-note', 'No sessions with a signal logged yet.')); }
    return wrap;
  }
  function monthTally(catFn){
    var t = {good:0, mid:0, bad:0, total:0};
    monthWeeks().forEach(function(w){
      var wt = tallyDays(w.days, catFn);
      t.good += wt.good; t.mid += wt.mid; t.bad += wt.bad; t.total += wt.total;
    });
    return t;
  }
  function monthWeekHeader(w){
    var hd = el('div', 'month-week-hd');
    hd.appendChild(el('span', 'month-week-label', 'Week ' + w.weekNum));
    var pillClass = PERIOD_PILL_CLASS[w.phaseKey];
    if(pillClass){
      hd.appendChild(el('span', 'month-week-pill ' + pillClass, PERIOD_LABEL[w.phaseKey]));
    } else {
      hd.appendChild(el('span', 'month-week-pill', 'Unset phase'));
    }
    if(w.isCurrent){ hd.appendChild(el('span', 'month-week-current', 'this week')); }
    return hd;
  }
  function renderMonthSection(label, catFn, opts, resolveInsight){
    var wrap = el('div', 'dash-section');
    wrap.setAttribute('data-label', label);
    var weeks = monthWeeks();
    weeks.forEach(function(w){
      var block = el('div', 'month-week-block');
      block.appendChild(monthWeekHeader(w));
      var t = tallyDays(w.days, catFn);
      var facts = computeSignalFacts([{wk:w.wk, days:w.days}], catFn);
      var rule = resolveInsight(facts);
      renderSignalBody(block, t, catFn, {severity: rule.severity, headline: rule.headline(facts)},
        {nText: opts.nText(t), bigDesc: opts.bigDesc, goodLabel: opts.goodLabel, midLabel: opts.midLabel, badLabel: opts.badLabel, matrixSub: opts.matrixSub},
        w.days);
      wrap.appendChild(block);
    });
    return wrap;
  }

  function renderTrends(){
    var root = els.viewTrends;
    clear(root);
    var h = el('h1', 'dash-eyebrow', 'This month');
    h.id = 'trends-h'; h.tabIndex = -1;
    root.appendChild(h);
    root.appendChild(renderSignalSubtabs(state.monthSignal, function(v){ state.monthSignal = v; renderTrends(); }));
    if(state.monthSignal === 'fuelling'){
      var fuelT = monthTally(fuelCat);
      root.appendChild(renderDisciplineInsights(fuelCat, disciplineFuelHeadline));
      if(fuelT.total >= STAT_MIN_N){ root.appendChild(renderStatBar(fuelT, 'at race concentration')); }
      root.appendChild(renderMonthSection('Fuelling', fuelCat, {

      }, resolveFuelInsight));
    } else {

      root.appendChild(renderMonthSection('Intensity drift', driftCat, {
        nText: function(t){ return t.total + ' session' + (t.total === 1 ? '' : 's'); }, bigDesc: 'finished at intent',
        goodLabel: 'at intent', midLabel: 'slightly over', badLabel: 'well over', matrixSub: 'by session'
      }, resolveDriftInsight));

  function renderDashboard(){
    var root = els.viewDash;
    clear(root);
    var h = el('h1', 'dash-eyebrow', 'This week');
    h.id = 'dash-h'; h.tabIndex = -1;
    root.appendChild(h);

    root.appendChild(renderSignalSubtabs(state.weekSignal, function(v){ state.weekSignal = v; renderDashboard(); }));
    var days = currentWeekDays();
    var weekLabel = 'Week ' + isoWeekNumber(mondayOf(new Date()));
    if(state.weekSignal === 'fuelling'){
      var fuelT = tallyDays(days, fuelCat);
      var fuelFacts = computeSignalFacts([{wk:'This week', days:days}], fuelCat);
      var fuelRule = resolveFuelInsight(fuelFacts);
      root.appendChild(dashSignalSection('Fuelling', fuelT, fuelCat, {severity: fuelRule.severity, headline: fuelRule.headline(fuelFacts)}, {
        nText: fuelT.total + ' over 45 min', bigDesc: 'at race concentration',
        goodLabel: 'race conc.', midLabel: 'lighter', badLabel: 'none', matrixSub: 'over 45 min only', signal: 'fuelling', weekLabel: weekLabel
      }, days));
    } else {
      var driftT = tallyDays(days, driftCat);
      var driftFacts = computeSignalFacts([{wk:'This week', days:days}], driftCat);
      var driftRule = resolveDriftInsight(driftFacts);
      root.appendChild(dashSignalSection('Intensity drift', driftT, driftCat, {severity: driftRule.severity, headline: driftRule.headline(driftFacts)}, {
        nText: driftT.total + ' session' + (driftT.total === 1 ? '' : 's'), bigDesc: 'finished at intent',
        goodLabel: 'at intent', midLabel: 'slightly over', badLabel: 'well over', matrixSub: 'by session', signal: 'intensity', weekLabel: weekLabel
      }, days));
    }
    root.appendChild(dashLegend());
  }

  // RACE CALENDAR

  var RACE_STATUS_LABEL = {considering: 'Considering', locked: 'Locked in'};
  function addRace(fields){
    var race = {
      id: newRaceId(), name: fields.name.trim(), date: fields.date,
      url: (fields.url || '').trim(), notes: (fields.notes || '').trim(),
      status: fields.status === 'locked' ? 'locked' : 'considering'
    };
    races.push(race);
    persistRaces();
    submitRaceToSheet('add', race);
    renderRaces();
    renderSplashCountdown();
    say('Race added: ' + race.name + '.');
  }
  function deleteRace(id){
    var race = races.filter(function(r){ return r.id === id; })[0];
    races = races.filter(function(r){ return r.id !== id; });
    persistRaces();
    submitRaceToSheet('delete', {id: id});
    renderRaces();
    renderSplashCountdown();
    if(race){ say('Removed ' + race.name + '.'); }
  }
  function raceField(labelText, subText, inputEl){
    var wrap = el('div', 'race-field');
    var lbl = el('label', 'field-lbl');
    lbl.appendChild(document.createTextNode(labelText + ' '));
    if(subText){ lbl.appendChild(el('span', 'sub', subText)); }
    lbl.appendChild(document.createElement('br'));
    inputEl.id = inputEl.id || ('race-' + labelText.toLowerCase().replace(/[^a-z]+/g, '-'));
    lbl.htmlFor = inputEl.id;
    lbl.appendChild(inputEl);
    wrap.appendChild(lbl);
    return wrap;
  }
  function renderRaceForm(root){
    var form = document.createElement('form');
    form.className = 'race-form';
    form.setAttribute('aria-label', 'Add a race');

    var nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.className = 'text-input'; nameInput.id = 'race-name';
    nameInput.required = true; nameInput.maxLength = 80;
    nameInput.placeholder = 'e.g. 70.3 Geelong';
    form.appendChild(raceField('Race name', null, nameInput));

    var dateInput = document.createElement('input');
    dateInput.type = 'date'; dateInput.className = 'date-input'; dateInput.id = 'race-date';
    dateInput.required = true;
    form.appendChild(raceField('Date', null, dateInput));

    var statusWrap = el('div', 'race-field');
    statusWrap.appendChild(el('span', 'field-lbl', 'Commitment'));
    var statusChoices = el('div', 'choices grid2');
    var statusInputs = ['considering', 'locked'].map(function(v, i){
      var opt = el('div', 'opt');
      var input = document.createElement('input');
      input.type = 'radio'; input.name = 'race-status'; input.id = 'race-status-' + v;
      // defaultChecked (not .checked) so form.reset() after a successful
      // add restores "Considering" rather than leaving neither selected.
      input.value = v; input.defaultChecked = i === 0;
      opt.appendChild(input);
      var label = el('label', 'choice', RACE_STATUS_LABEL[v]);
      label.htmlFor = input.id;
      opt.appendChild(label);
      statusChoices.appendChild(opt);
      return input;
    });
    statusWrap.appendChild(statusChoices);
    form.appendChild(statusWrap);

    var urlInput = document.createElement('input');
    // type="text", not "url" — the url type demands a full scheme
    // (https://...), so a bare "ironman.com/geelong" fails native
    // constraint validation and silently blocks the whole form. The
    // https:// prefix is added on render instead (see raceCard).
    urlInput.type = 'text'; urlInput.className = 'text-input'; urlInput.id = 'race-url';
    urlInput.placeholder = 'e.g. ironman.com/geelong';
    form.appendChild(raceField('Website', 'optional', urlInput));

    var notesInput = document.createElement('textarea');
    notesInput.id = 'race-notes'; notesInput.rows = 2; notesInput.maxLength = 140;
    notesInput.placeholder = 'e.g. A-race, club focus race';
    form.appendChild(raceField('Notes', 'optional', notesInput));

    var submitBtn = el('button', 'btn btn-primary', 'Add race');
    submitBtn.type = 'submit';
    form.appendChild(submitBtn);

    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      if(!nameInput.value.trim() || !dateInput.value){ return; }
      var checked = statusInputs.filter(function(i){ return i.checked; })[0];
      addRace({
        name: nameInput.value, date: dateInput.value, url: urlInput.value, notes: notesInput.value,
        status: checked ? checked.value : 'considering'
      });
      form.reset();
      nameInput.focus();
    });

    root.appendChild(form);
  }
  function raceCard(race, isNext){
    var card = el('div', 'race-card' + (isNext ? ' is-next' : ''));
    var top = el('div', 'race-card-top');
    top.appendChild(el('span', 'race-card-date', formatRaceDateLabel(race.date)));
    var days = daysUntil(race.date);
    if(days >= 0){ top.appendChild(el('span', 'race-card-countdown', raceCountdownLabel(days))); }
    card.appendChild(top);
    card.appendChild(el('div', 'race-card-name', race.name));
    var statusCls = race.status === 'locked' ? 'locked' : 'considering';
    card.appendChild(el('span', 'race-status-pill ' + statusCls, RACE_STATUS_LABEL[statusCls]));
    if(race.notes){ card.appendChild(el('p', 'race-card-notes', race.notes)); }
    var foot = el('div', 'race-card-foot');
    if(race.url){
      var link = document.createElement('a');
      link.className = 'race-card-link';
      link.href = /^https?:\/\//i.test(race.url) ? race.url : 'https://' + race.url;
      link.target = '_blank'; link.rel = 'noopener noreferrer';
      link.textContent = 'Race website';
      foot.appendChild(link);
    }
    var del = el('button', 'race-card-delete', 'Remove');
    del.type = 'button';
    del.setAttribute('aria-label', 'Remove ' + race.name + ' from the race calendar');
    del.addEventListener('click', function(){
      if(window.confirm('Remove ' + race.name + ' from your race calendar?')){ deleteRace(race.id); }
    });
    foot.appendChild(del);
    card.appendChild(foot);
    return card;
  }

  function renderRaces(){

  function warmupCheckKey(disc, i){ return disc + '-' + i; }
  var warmupActive = { disc: null, index: null };
  function prefersReducedMotion(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function renderWarmupSubtabs(current, onSelect){

  // Box-with-outward-arrow "opens elsewhere" glyph, drawn inline to match

  function warmupCheckedCount(disc, data){
    var n = 0;
    data.exercises.forEach(function(ex, i){ if(state.warmupChecked[warmupCheckKey(disc, i)]){ n++; } });
    return n;
  }
  function renderWarmupHero(disc, data){
