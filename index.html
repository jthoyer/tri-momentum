  // Week number, phase, planned and logged time, and a meter of one over the

  function calSummary(model){

    var phase = resolvePhaseForDate(calWeekMonday);
    if(phase){

      wrap.appendChild(meter);
    }
    wrap.appendChild(el('p', 'cal-note', 'Times are approximate'));
    return wrap;
  }

  function calStillRow(){

  function calChips(model){

  function calPlannedCard(res, dateISO){
    var item = res.item;
    var seg = planResultSeg(res);
    var word = PLAN_SEG_WORD[seg];
    // Today's still-open session is "To log", not "Not due yet" (owner answer
    // Q5): it is due, and it is the one thing the athlete can act on now.
    if(seg === 'planned' && dateISO === todayISO()){ word = 'To log'; }
    var li = el('li', 'cal-card' + (res.entry ? ' is-logged' : ''));
    li.appendChild(calCardHead(item.disc, splashTodayName(item), planMetaLine(item, false), item.key));
    var foot = el('div', 'cal-card-foot');
    foot.appendChild(calCardStatus(seg, word, (seg === 'missed' || seg === 'bad') ? 'is-off' : ''));
    var actions = el('div', 'cal-card-actions');
    var what = item.title || DISC_LABEL[item.disc] || 'session';
    var edit = el('button', 'cal-card-edit', 'Edit');
    edit.type = 'button';
    edit.setAttribute('aria-label', 'Edit ' + what + ' on ' + formatWeekdayDate(item.date));
    edit.setAttribute('data-focus', 'edit:' + item.id);
    edit.addEventListener('click', function(){ calOpenPlan(item.date, item); });
    actions.appendChild(edit);
    // "Check in on this" only where a check-in can be dated: a planned card
    // with no matched log entry whose date is today or earlier (spec P3).
    // dateField() caps the date at today, and planDayResults() already scores
    // future cards `pending`. A logged card is a static record — no CTA — so
    // tapping it can never write a duplicate that the matcher would then
    // report as an unplanned `extra`.
    if(!res.entry && dateISO <= todayISO()){
      var cta = el('button', 'cal-card-cta', 'Check in on this →');
      cta.type = 'button';
      cta.setAttribute('aria-label', 'Check in on this: ' + splashTodayName(item) + ', ' + formatWeekdayDate(item.date));
      cta.setAttribute('data-focus', 'cta:' + item.id);
      cta.addEventListener('click', function(){ calRequestCheckIn({item: item, date: item.date}); });
      actions.appendChild(cta);
    }
    foot.appendChild(actions);
    li.appendChild(foot);
    return li;
  }
  // A logged session with no matching plan row. In a week that has a plan it
  // is "Unplanned" (counted, never scored bad). In a week with no planned
  // session at all there is nothing to be unplanned *against*, so it just
  // reads "Logged", with no strip and no Adherence word (owner answer Q3).
  function calExtraCard(entry, weekHasPlan){
    var li = el('li', 'cal-card is-logged');
    var dur = parseInt(entry.duration, 10);
    var mins = isFinite(dur) && dur > 0 ? dur + ' min' : '';
    var meta = weekHasPlan ? (mins ? mins + ' · logged' : 'logged') : mins;
    li.appendChild(calCardHead(entry.disc, DISC_LABEL[entry.disc] || 'Session', meta, false));
    var foot = el('div', 'cal-card-foot');
    foot.appendChild(weekHasPlan ? calCardStatus('extra', PLAN_SEG_WORD.extra) : calCardStatus(null, 'Logged', 'is-done'));
    li.appendChild(foot);
    return li;
  }

  function calAgenda(model){
    var today = todayISO();
    var sel = model.days.filter(function(d){ return d.date === calSelected; })[0] || model.days[0];
    var r = planDayResults(sel);
    var isToday = sel.date === today;
    var wrap = el('section', 'cal-agenda');
    wrap.setAttribute('aria-labelledby', 'cal-agenda-h');
    var hd = el('div', 'cal-agenda-hd');
    var h = el('h2', 'cal-agenda-title');
    h.id = 'cal-agenda-h';
    if(isToday){
      h.appendChild(document.createTextNode('Today'));
      h.appendChild(el('span', 'cal-agenda-date', formatLongDate(sel.date)));
    } else {
      h.appendChild(document.createTextNode(formatLongDate(sel.date)));
    }
    hd.appendChild(h);
    var mins = calDayLoggedMin(sel);
    hd.appendChild(el('span', 'cal-agenda-logged', mins ? mins + ' min logged' : 'Nothing logged'));
    wrap.appendChild(hd);

    // A race on this day — locked over considering, as the Month grid picks.
    var race = races.filter(function(x){ return x.date === sel.date; }).sort(function(a, b){
      return (a.status === 'locked' ? 0 : 1) - (b.status === 'locked' ? 0 : 1);
    })[0];
    if(race){
      var rr = el('div', 'cal-agenda-race');
      rr.appendChild(el('span', 'race-status-pill ' + (race.status === 'locked' ? 'locked' : 'considering'), 'Race day'));
      rr.appendChild(el('span', null, race.name));

    }

    if(r.results.length || r.extras.length){
      var ul = el('ul', 'cal-cards');

      r.results.forEach(function(res){ ul.appendChild(calPlannedCard(res, sel.date)); });
      r.extras.forEach(function(e){ ul.appendChild(calExtraCard(e, model.hasPlan)); });
      wrap.appendChild(ul);

    // Hidden for a future day: the check-in's date field is capped at today.
    if(sel.date <= today){
      var other = el('button', 'cal-unplanned', 'Log an unplanned session');
      other.type = 'button';
      other.addEventListener('click', function(){ calRequestCheckIn({item: null, date: sel.date}); });
      wrap.appendChild(other);
    }
    return wrap;
  }

  // ── Month ─────────────────────────────────────────────────────────
  // The month grid and per-week phase editing that lived on the Races tab
  // (decisions 41, 42, 46, 47), moved here. Each week's number-and-days row is
  // one button that opens Week on that week; each week's phase row is a
  // *sibling* of it (never nested — a button cannot hold a button) whose label
  // edits the phase in place. Both are ≥44px: the week row as a real box
  // (28px cells + 8px padding top and bottom), the phase label as a 36px box
  // with a ::before that completes the 44px, overlapping only the week
  // buttons' blank padding. Month shows no per-session status; it is a shape.
  var calYear = new Date().getFullYear(), calMonthIdx = new Date().getMonth(), calEditWeek = null;
  function calGoMonth(delta){

  // A week tapped in Month opens Week on it (spec P5: today if the week holds
  // it, else its Monday). Focus lands on the selected chip, since the button
  // that was tapped no longer exists.
  function calOpenWeekFromMonth(mondayISO){

  // Week / Month, a real tablist (roving tabindex, arrow keys, Home/End), and
  // Today. Today returns to the current week with today selected — or, in
  // Month, the current month — keeping whichever view is up.
  function calSetMode(mode){
    if(mode === calMode){ return; }
    calMode = mode;
    calEditWeek = null;
    if(mode === 'month'){
      var d = new Date(calSelected + 'T00:00:00');
      calYear = d.getFullYear();
      calMonthIdx = d.getMonth();
    }
    renderCalendar();
    say(mode === 'month' ? 'Month view.' : 'Week view.');
  }
  function calGoToday(){
    var mode = calMode;
    var had = document.activeElement && document.activeElement.classList.contains('cal-today');
    calResetToToday();
    calMode = mode;
    renderCalendar();
    calRefocus('.cal-today', had);
    say(mode === 'month' ? 'Showing this month.' : 'Showing this week, today selected.');

  function calViewSwitch(){
    var wrap = el('div', 'cal-switch');
    var tabs = el('div', 'signal-subtabs');
    tabs.setAttribute('role', 'tablist');
    tabs.setAttribute('aria-label', 'Calendar view');
    var modes = [['week', 'Week'], ['month', 'Month']];
    modes.forEach(function(pair, i){
      var btn = el('button', 'signal-subtab', pair[1]);
      btn.type = 'button';
      btn.id = 'cal-tab-' + pair[0];
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-selected', String(calMode === pair[0]));
      btn.setAttribute('aria-controls', 'cal-panel');
      btn.tabIndex = calMode === pair[0] ? 0 : -1;
      btn.addEventListener('click', function(){
        var keep = document.activeElement === btn;
        calSetMode(pair[0]);
        if(keep){ var again = document.getElementById('cal-tab-' + pair[0]); if(again){ again.focus(); } }
      });
      btn.addEventListener('keydown', function(ev){
        var to = null;
        if(ev.key === 'ArrowRight'){ to = modes[(i + 1) % modes.length][0]; }
        else if(ev.key === 'ArrowLeft'){ to = modes[(i + modes.length - 1) % modes.length][0]; }
        else if(ev.key === 'Home'){ to = modes[0][0]; }
        else if(ev.key === 'End'){ to = modes[modes.length - 1][0]; }
        if(!to){ return; }
        ev.preventDefault();
        calSetMode(to);
        var next = document.getElementById('cal-tab-' + to);
        if(next){ next.focus(); }
      });
      tabs.appendChild(btn);
    });
    wrap.appendChild(tabs);
    var today = el('button', 'cal-today', 'Today');
    today.type = 'button';

  function renderCalendar(){

  // Add / Edit on a card opens the Plan view on that day; its back link
  // returns here (planBackTo), to the same week.
  function calOpenPlan(dateISO, item){
    planBackTo = 'calendar';
    if(item){ openPlanEditor(item); } else { goToPlanDay(dateISO); }
  }
  // A check-in is "in progress" when the flow holds answers (or a chosen
  // date) and is asking or reviewing. flowIsPristine() is false for 'saved'
  // too, so that mode is excluded explicitly: a saved check-in is finished,
  // not something to resume.
  function calCheckInInProgress(){
    return (state.mode === 'ask' || state.mode === 'review') && !flowIsPristine();
  }
  // What is known about the half-finished check-in, in one line: the session
  // (discipline and duration, if answered), the date when it isn't today, and
  // where in the flow it stopped. The flow's own counter and announcements
  // count *steps* (pages of questions), so this says "step", not "question".
  function calResumeLine(){
    var a = state.ans, bits = [];
    var what = [];
    if(a.disc){ what.push(DISC_LABEL[a.disc] || a.disc); }
    if(a.duration){ what.push((optionFor(QUESTIONS_BY_KEY.duration, a.duration) || {}).label || a.duration + ' min'); }
    if(what.length){ bits.push(what.join(' · ')); }
    if(a.date && a.date !== todayISO()){ bits.push(formatWeekdayDate(a.date)); }
    if(state.mode === 'review'){
      bits.push('ready to review');
    } else {
      var total = steps().length;
      bits.push('step ' + (Math.min(state.step, total - 1) + 1) + ' of ' + total);
    }
    return bits.join(' · ');
  }
  // Shows the flow exactly where it was. Nothing in `state` changes: render()
  // rebuilds the same step from state.ans, and the note lives in state.note.
  function resumeCheckIn(){
    calPending = null;
    showView('flow');
    render();
    focusHeading();
    say('Resuming your check-in.');
  }
  // The check-in the athlete tapped while another was in progress, held while
  // the inline "Resume" / "Discard and start this one" choice is showing.
  // Module state, not DOM, so a background refresh that redraws the Calendar
  // does not lose the question.
  var calPending = null;
  function calRequestCheckIn(action){
    if(calCheckInInProgress()){
      calPending = action;
      renderCalendar();
      // The choice sits at the top, far from the card that was tapped: bring
      // the whole bar into view (not just the button focus would scroll to).
      var bar = els.viewCalendar.querySelector('.cal-resume');
      var go = els.viewCalendar.querySelector('.cal-resume-go');
      if(go){ go.focus({preventScroll: true}); }
      if(bar){ bar.scrollIntoView({block: 'center'}); }
      say('A check-in is already in progress. Resume it, or discard it and start this one.');
      return;
    }
    beginCheckIn(action);
  }
  // Under the race strip while a check-in is part-way through. With a held
  // tap (calPending) it becomes the inline choice: the athlete must pick
  // "Resume" or "Discard and start this one" — a half-finished check-in is
  // never thrown away silently (decision 32's rule, owner answer Q2).
  function calResumeBar(){
    if(!calCheckInInProgress()){ return null; }
    var bar = el('section', 'cal-resume');
    bar.setAttribute('aria-label', 'Check-in in progress');
    bar.appendChild(el('p', 'cal-resume-title', 'Check-in in progress'));
    bar.appendChild(el('p', 'cal-resume-line', calResumeLine()));
    var actions = el('div', 'cal-resume-actions');
    if(calPending){
      var held = calPending;
      bar.appendChild(el('p', 'cal-resume-line', 'You tapped ' +
        (held.item ? splashTodayName(held.item) : 'an unplanned session on ' + formatWeekdayDate(held.date)) +
        '. Resume the check-in you started, or discard it and start this one?'));
      var resume = el('button', 'cal-resume-go', 'Resume');
      resume.type = 'button';
      resume.addEventListener('click', resumeCheckIn);
      actions.appendChild(resume);
      var discard = el('button', 'cal-resume-discard', 'Discard and start this one');
      discard.type = 'button';
      discard.addEventListener('click', function(){
        calPending = null;
        beginCheckIn(held);
      });
      actions.appendChild(discard);
    } else {
      var go = el('button', 'cal-resume-go', 'Resume check-in');
      go.type = 'button';
      go.addEventListener('click', resumeCheckIn);
      actions.appendChild(go);
    }
    bar.appendChild(actions);
    return bar;
  }


  // "Swim — Squad — 8×100 CSS" style name for a planned session: discipline,
  // then title. Used by the Calendar cards, the in-flow hint cards and the
  // pre-fill announcement. (Named for the splash it first served.)
  function splashTodayName(item){
    var disc = DISC_LABEL[item.disc] || item.disc;
    return item.title ? (disc + ' — ' + item.title) : disc;
  }
  // "60 min · Hard / quality · Key" — the same fields planItemCard() shows in
  // the Plan view, in the same order, so the two surfaces read identically.
  // includeKey is false wherever a surface already shows the standalone "Key"
  // pill (the in-flow card does; the splash card has no room for one), so the
  // word never appears twice on the same card.
  function planMetaLine(item, includeKey){
    var bits = [];
    if(item.duration != null){ bits.push(planDurationLabel(item.duration)); }
    if(item.intensity){ bits.push(PLAN_INTENSITY_LABEL[item.intensity] || item.intensity); }
    if(item.key && includeKey !== false){ bits.push('Key'); }
    return bits.join(' · ');
  }

  // ═══════════════════════════════════════════════════════════════
  // TRAINING PLAN
  //
  // A manually-entered copy of the athlete's own plan — the app never
  // authors, suggests or adjusts a session. Rows are stored against real
  // ISO dates (not a cycle-relative template), so joining a planned session
  // to a logged one is a plain date equality test.
  // ═══════════════════════════════════════════════════════════════
  var MAX_COPY_WEEKS = 8;
  // Reused straight off the check-in questions rather than re-declared, so
  // the planned enum and the logged enum can never drift apart — a future
  // planned-vs-actual match is then an equality test, not a mapping table.
  var PLAN_DISC_OPTS = QUESTIONS_BY_KEY.disc.opts;
  var PLAN_INTENSITY_OPTS = QUESTIONS_BY_KEY.intensity.opts;
  var PLAN_INTENSITY_LABEL = {};
  PLAN_INTENSITY_OPTS.forEach(function(o){ PLAN_INTENSITY_LABEL[o.v] = o.label; });

  // Which day's add-session form is open ('YYYY-MM-DD' or null) — module
  // state, never derived from the DOM, because renderPlan() fully rebuilds
  // the view (including on a background Sheet refresh) and a half-filled
  // form must not silently snap shut. Same reason raceFormOpen exists.
  var planFormOpenFor = null;
  // The copy-week panel needs the same protection for the same reason: it's
  // a multi-step selection (tick N target weeks, then confirm) rebuilt by
  // renderPlan(), so a background refresh mid-selection would snap it shut
  // and clear the ticks. Tracked here, and honoured by the re-render guard
  // in refreshVisibleViewFromSheet() alongside planFormOpenFor.
  var planCopyOpen = false;
  // When set, the open day's form is an *edit* of this planned session rather
  // than a blank add. Held alongside planFormOpenFor rather than derived from
  // it, for the same reason planFormOpenFor isn't derived from the DOM:
  // renderPlan() rebuilds the whole view, including on a background Sheet
  // refresh, and a half-edited form must not silently turn back into an add.
  // Only ever non-null while planFormOpenFor is set, so the existing
  // re-render guard in refreshVisibleViewFromSheet() already covers it.
  var planEditingId = null;
  // A save that has to close its own form still owes the athlete a reason.
  // {date, message} or null, rendered by planDayRow() using the *same*
  // .plan-form-error / role="alert" node the form itself uses — it just has
  // to outlive the form, because the form is what's being taken away.
  // Deliberately not cleared by a render: a background Sheet refresh must
  // not wipe the message before it has been read. It is cleared by the next
  // plan action instead (opening a form, changing week, any mutation).
  var planNotice = null;
  // Which view opened the Plan view — it is reached from Review ("Edit plan →")
  // and from the Calendar's Add / Edit, and its back link returns to whichever
  // it was. Set by the entry points, never derived from the DOM.
  var planBackTo = 'dashboard';
  function clearPlanNotice(){ planNotice = null; }

  function planWeekDates(mondayISO){
    var monday = new Date(mondayISO + 'T00:00:00');
    var out = [];
    for(var i = 0; i < 7; i++){ out.push(isoDate(addDays(monday, i))); }
    return out;
  }
  function planItemsFor(dateISO){
    return plan.filter(function(p){ return p.date === dateISO; });
  }
  function planItemsInWeek(mondayISO){
    var dates = planWeekDates(mondayISO);
    var from = dates[0], to = dates[6];
    return plan.filter(function(p){ return p.date >= from && p.date <= to; });
  }
  function loggedCountInWeek(mondayISO){
    var dates = planWeekDates(mondayISO);
    var from = dates[0], to = dates[6];
    return log.filter(function(e){ return e.date >= from && e.date <= to; }).length;
  }
  function planDurationLabel(mins){
    return mins == null ? '' : (mins + ' min');
  }

  function addPlanSession(dateISO, fields){
    var item = {
      id: newPlanId(), date: dateISO, disc: fields.disc,
      title: (fields.title || '').trim(),
      intensity: fields.intensity || 'easy',
      duration: fields.duration,
      key: !!fields.key,
      notes: (fields.notes || '').trim(),
      phase: state.periodisation || ''
    };
    plan.push(item);
    persistPlan();
    submitPlanToSheet('add', item);
    clearPlanNotice();
    renderPlan();
    say('Planned ' + (DISC_LABEL[item.disc] || item.disc) + ' added for ' + formatDateLabel(dateISO) + '.');
    return item;
  }
  // Edits an existing planned session in place. Note what it does NOT change:
  // `id`, `date` and `phase`. id and date are excluded on both sides — here,
  // and structurally in Code.gs, where an update writes only the Disc..Phase
  // column block (see PLAN_EDITABLE_COL). Moving a session to another day is
  // the drag-and-drop calendar editing this feature has always excluded
  // (CLAUDE.md, "What not to build"), so delete-and-re-add stays the way to
  // change a date. `phase` is left alone because it records the phase the
  // session was *planned* in — retyping its duration months later must not
  // silently restamp it with whatever phase is current now.
  function updatePlanSession(id, fields){
    var item = plan.filter(function(p){ return p.id === id; })[0];
    // The row is gone — removed on another device, or it only ever existed
    // in a localStorage cache written before Code.gs was redeployed. A bare
    // `return null` here left the athlete's edits sitting in an open form
    // that would never save, with nothing on screen to say so. Say it, then
    // take the dead form away rather than leaving it to be retyped into.
    if(!item){
      planNotice = {
        date: planFormOpenFor,
        message: 'This session is no longer in your plan — it may have been removed on another device. Your changes were not saved.'
      };
      planFormOpenFor = null;
      planEditingId = null;
      renderPlan();
      say('That session is no longer in your plan. Your changes were not saved.');
      return null;
    }
    // Mutated on the existing object rather than replaced with a freshly
    // built one, so every field this function doesn't name carries over by
    // construction — a new field added to a plan item later can't be
    // silently dropped by an edit.
    item.disc = fields.disc;
    item.title = (fields.title || '').trim();
    item.intensity = fields.intensity || 'easy';
    item.duration = fields.duration;
    item.key = !!fields.key;
    item.notes = (fields.notes || '').trim();
    persistPlan();
    submitPlanToSheet('update', item);
    planFormOpenFor = null;
    planEditingId = null;
    clearPlanNotice();
    renderPlan();
    say('Updated ' + (item.title || DISC_LABEL[item.disc] || 'session') + ' on ' + formatDateLabel(item.date) + '.');
    return item;
  }
  function deletePlanSession(id){
    var item = plan.filter(function(p){ return p.id === id; })[0];
    plan = plan.filter(function(p){ return p.id !== id; });
    persistPlan();
    submitPlanToSheet('delete', {id: id});
    renderPlan();
    if(item){ say('Removed ' + (item.title || DISC_LABEL[item.disc] || 'session') + ' from the plan.'); }
  }
  // One batched request for the whole copy, however many target weeks —
  // this is what addBatch exists for. Dates are shifted by whole weeks, so
  // a Tuesday session stays a Tuesday session.
  function copyPlanWeek(targetMondays){
    var source = planItemsInWeek(state.planWeek);
    if(!source.length || !targetMondays.length){ return 0; }
    var sourceMonday = new Date(state.planWeek + 'T00:00:00');
    var created = [];
    targetMondays.forEach(function(targetISO){
      var offset = Math.round((new Date(targetISO + 'T00:00:00') - sourceMonday) / 86400000);
      source.forEach(function(p){
        created.push({
          id: newPlanId(), date: isoDate(addDays(new Date(p.date + 'T00:00:00'), offset)),
          disc: p.disc, title: p.title, intensity: p.intensity, duration: p.duration,
          key: p.key, notes: p.notes, phase: p.phase
        });
      });
    });
    plan = plan.concat(created);
    persistPlan();
    submitPlanToSheet('addBatch', null, {items: created});
    renderPlan();
    say(created.length + ' planned session' + (created.length === 1 ? '' : 's') + ' copied to ' +
        targetMondays.length + ' week' + (targetMondays.length === 1 ? '' : 's') + '.');
    return created.length;
  }
  // One batched request, by date range rather than by id list — re-entering
  // a changed week must not cost N separate deletes.
  function clearPlanWeek(){
    var dates = planWeekDates(state.planWeek);
    var from = dates[0], to = dates[6];
    var removed = planItemsInWeek(state.planWeek).length;
    if(!removed){ return 0; }
    plan = plan.filter(function(p){ return !(p.date >= from && p.date <= to); });
    persistPlan();
    submitPlanToSheet('deleteWeek', null, {from: from, to: to});
    planFormOpenFor = null;
    planEditingId = null; // the row being edited is one of the ones just removed
    renderPlan();
    say(removed + ' planned session' + (removed === 1 ? '' : 's') + ' cleared from this week.');
    return removed;
  }

  function planField(labelText, subText, inputEl){
    var wrap = el('div', 'plan-field');
    var lbl = el('label', 'field-lbl');
    lbl.appendChild(document.createTextNode(labelText + ' '));
    if(subText){ lbl.appendChild(el('span', 'sub', subText)); }
    lbl.htmlFor = inputEl.id;
    // Siblings, not nested — same reason as raceField: a label's
    // margin-bottom has no visible effect around a nested input.
    wrap.appendChild(lbl);
    wrap.appendChild(inputEl);
    return wrap;
  }
  // A radio chip group, matching the check-in question layout and the race
  // Commitment toggle. Returns the inputs so the submit handler can read
  // whichever is checked.
  function planChoiceGroup(form, legendText, name, opts, gridClass, defaultValue){
    var wrap = el('fieldset', 'plan-field');
    var legend = el('legend', 'field-lbl', legendText);
    wrap.appendChild(legend);
    var choices = el('div', 'choices ' + gridClass);
    var inputs = opts.map(function(o){
      var opt = el('div', 'opt');
      var input = document.createElement('input');
      input.type = 'radio'; input.name = name; input.id = name + '-' + o.v;
      input.value = o.v;
      // defaultChecked, not .checked — so form.reset() after a successful
      // add restores the default rather than leaving nothing selected.
      input.defaultChecked = o.v === defaultValue;
      opt.appendChild(input);
      var label = el('label', 'choice', o.label);
      label.htmlFor = input.id;
      opt.appendChild(label);
      choices.appendChild(opt);
      return input;
    });
    wrap.appendChild(choices);
    form.appendChild(wrap);
    return inputs;
  }
  function checkedValue(inputs, fallback){
    var hit = inputs.filter(function(i){ return i.checked; })[0];
    return hit ? hit.value : fallback;
  }

  // One form, two modes. `editItem` (optional) switches it from a blank add
  // to an in-place edit of that planned session — extended rather than forked
  // so the validation rules, the error surface and the field set can't drift
  // between adding and editing. The date is shown but never editable in
  // either mode: see updatePlanSession.
  function renderPlanForm(root, dateISO, onCancel, editItem){
    var isEdit = !!editItem;
    var form = document.createElement('form');
    form.className = 'plan-form';
    form.setAttribute('aria-label', (isEdit ? 'Edit planned session for ' : 'Add a planned session for ') + formatWeekdayDate(dateISO));

    var discInputs = planChoiceGroup(form, 'Which session?', 'plan-disc', PLAN_DISC_OPTS, 'grid3', isEdit ? editItem.disc : 'swim');

    var titleInput = document.createElement('input');
    titleInput.type = 'text'; titleInput.className = 'text-input'; titleInput.id = 'plan-title';
    titleInput.maxLength = 60;
    // aria-required, not the `required` attribute. A native `required` makes
    // the browser block submit with its own transient bubble before the
    // submit handler ever runs, which makes the specific, persistent,
    // role="alert" messages below unreachable — and a silently-blocked
    // submit with no visible reason is exactly the trap decision 22 hit
    // with type="url" on the race website field.
    titleInput.setAttribute('aria-required', 'true');
    titleInput.placeholder = 'e.g. Squad — 8×100 CSS';
    if(isEdit){ titleInput.value = editItem.title || ''; }
    form.appendChild(planField('What is it', null, titleInput));

    var durInput = document.createElement('input');
    // type="text" + inputmode="numeric", not type="number" — number inputs
    // accept 'e'/'+'/'-' and report an empty value for anything they judge
    // invalid, which hides a typo behind a silently-blocked submit. Parsed
    // and range-checked below instead.
    durInput.type = 'text'; durInput.className = 'text-input'; durInput.id = 'plan-duration';
    durInput.maxLength = 3;
    durInput.setAttribute('aria-required', 'true');
    durInput.setAttribute('inputmode', 'numeric');
    durInput.placeholder = 'e.g. 60';
    if(isEdit && editItem.duration != null){ durInput.value = String(editItem.duration); }
    form.appendChild(planField('How long', 'minutes', durInput));

    var intensityInputs = planChoiceGroup(form, 'Meant to be easy or hard?', 'plan-intensity', PLAN_INTENSITY_OPTS, 'grid3', isEdit ? editItem.intensity : 'easy');
    var keyInputs = planChoiceGroup(form, 'Key session?', 'plan-key', [
      {v:'no', label:'Regular'}, {v:'yes', label:'Key session'}
    ], 'grid2', (isEdit && editItem.key) ? 'yes' : 'no');

    var notesInput = document.createElement('textarea');
    notesInput.id = 'plan-notes'; notesInput.rows = 2; notesInput.maxLength = 200;
    notesInput.placeholder = 'e.g. HR cap 145 on the commute home';
    if(isEdit){ notesInput.value = editItem.notes || ''; }
    form.appendChild(planField('Notes', 'optional', notesInput));

    // Its own class, not .empty-note — that one is styled as a neutral
    // "nothing here yet" panel, which is the wrong signal for a rejected
    // submit. This is the form's only error surface (native `required` was
    // deliberately not used, see above), so it has to read as one.
    var err = el('p', 'plan-form-error', '');
    err.id = 'plan-form-error';
    err.hidden = true;
    err.setAttribute('role', 'alert');
    form.appendChild(err);

    var actions = el('div', 'plan-form-actions');
    var submitBtn = el('button', 'btn btn-primary', isEdit ? 'Save changes' : 'Add session');
    submitBtn.type = 'submit';
    actions.appendChild(submitBtn);
    var cancelBtn = el('button', 'btn btn-ghost', 'Cancel');
    cancelBtn.type = 'button';
    cancelBtn.addEventListener('click', onCancel);
    actions.appendChild(cancelBtn);
    form.appendChild(actions);

    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      var title = titleInput.value.trim();
      var mins = parseInt(durInput.value, 10);
      if(!title){
        err.textContent = 'Give the session a name so you recognise it on the day.';
        err.hidden = false; titleInput.focus(); return;
      }
      if(isNaN(mins) || mins < 1 || mins > 999){
        err.textContent = 'Enter the planned length in whole minutes, between 1 and 999.';
        err.hidden = false; durInput.focus(); return;
      }
      err.hidden = true;
      // Fallbacks differ by mode on purpose. Adding falls back to the form's
      // own defaults; editing falls back to the value the item already holds,
      // so a session whose intensity or discipline was hand-typed into the
      // Sheet as something outside the option list round-trips unchanged
      // rather than being silently rewritten to 'easy'/'swim' by an edit that
      // never touched that field.
      var fields = {
        disc: checkedValue(discInputs, isEdit ? editItem.disc : 'swim'),
        title: title,
        duration: mins,
        intensity: checkedValue(intensityInputs, isEdit ? (editItem.intensity || 'easy') : 'easy'),
        key: checkedValue(keyInputs, 'no') === 'yes',
        notes: notesInput.value
      };
      if(isEdit){
        // Closes the form and rebuilds the view; focus goes back to the day
        // rather than a fresh blank form, since the edit is finished.
        var editedDate = editItem.date;
        updatePlanSession(editItem.id, fields);
        var dayRow = document.getElementById('plan-day-' + editedDate);
        if(dayRow){ dayRow.focus({preventScroll: true}); }
        return;
      }
      addPlanSession(dateISO, fields);
      // renderPlan() has already rebuilt the view by here, so re-find the
      // live form's title field rather than focusing the detached one.
      var freshTitle = document.getElementById('plan-title');
      if(freshTitle){ freshTitle.focus(); }
    });

    root.appendChild(form);
  }

  function planItemCard(item){
    var card = document.createElement('details');
    card.className = 'plan-item';
    var summary = document.createElement('summary');
    var dot = el('span', 'plan-item-dot');
    dot.style.background = 'var(--' + item.disc + ')';
    dot.setAttribute('aria-hidden', 'true');
    summary.appendChild(dot);
    var main = el('div', 'plan-item-main');
    main.appendChild(el('span', 'plan-item-title', item.title || DISC_LABEL[item.disc] || 'Session'));
    var metaBits = [DISC_LABEL[item.disc] || item.disc];
    if(item.duration != null){ metaBits.push(planDurationLabel(item.duration)); }
    if(item.intensity){ metaBits.push(PLAN_INTENSITY_LABEL[item.intensity] || item.intensity); }
    main.appendChild(el('span', 'plan-item-meta', metaBits.join(' · ')));
    summary.appendChild(main);
    if(item.key){ summary.appendChild(el('span', 'plan-item-key', 'Key')); }
    // Same rotating chevron as raceCard. Without it nothing signals the card
    // expands, and the notes (the whole reason to enter a plan into the app)
    // stay invisible behind a tap the athlete has no reason to try.
    var chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    chevron.setAttribute('class', 'plan-item-chevron');
    chevron.setAttribute('viewBox', '0 0 24 24');
    chevron.setAttribute('fill', 'none');
    chevron.setAttribute('stroke', 'currentColor');
    chevron.setAttribute('stroke-width', '2');
    chevron.setAttribute('stroke-linecap', 'round');
    chevron.setAttribute('stroke-linejoin', 'round');
    chevron.setAttribute('aria-hidden', 'true');
    var chevronPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    chevronPath.setAttribute('d', 'M6 9l6 6 6-6');
    chevron.appendChild(chevronPath);
    summary.appendChild(chevron);
    card.appendChild(summary);

    var body = el('div', 'plan-item-body');
    if(item.notes){ body.appendChild(el('p', 'plan-item-notes', item.notes)); }
    var foot = el('div', 'plan-item-foot');
    var edit = el('button', 'plan-item-edit', 'Edit');
    edit.type = 'button';
    edit.setAttribute('aria-label', 'Edit ' + (item.title || DISC_LABEL[item.disc] || 'session') + ' on ' + formatWeekdayDate(item.date));
    edit.addEventListener('click', function(){ openPlanEditor(item); });
    foot.appendChild(edit);
    var del = el('button', 'plan-item-delete', 'Remove');
    del.type = 'button';
    del.setAttribute('aria-label', 'Remove ' + (item.title || DISC_LABEL[item.disc] || 'session') + ' from ' + formatWeekdayDate(item.date));
    del.addEventListener('click', function(){
      if(window.confirm('Remove "' + (item.title || DISC_LABEL[item.disc]) + '" from your plan?')){ deletePlanSession(item.id); }
    });
    foot.appendChild(del);
    body.appendChild(foot);
    card.appendChild(body);
    return card;
  }

  function planDayRow(dateISO){
    var wrap = el('div', 'plan-day' + (dateISO === todayISO() ? ' is-today' : ''));
    // Addressable and programmatically focusable, so goToPlanDay() can land
    // on a specific day rather than the top of the view. tabIndex -1 keeps it
    // out of the tab order — it is a scroll/focus target, not a control.
    wrap.id = 'plan-day-' + dateISO;
    wrap.tabIndex = -1;
    var hd = el('div', 'plan-day-hd');
    var d = new Date(dateISO + 'T00:00:00');
    hd.appendChild(el('span', 'plan-day-name', MONTH_DAYS[(d.getDay() + 6) % 7] + (dateISO === todayISO() ? ' · today' : '')));
    hd.appendChild(el('span', 'plan-day-date', d.getDate() + ' ' + MONTH_NAMES[d.getMonth()]));
    wrap.appendChild(hd);

    var items = planItemsFor(dateISO);
    if(items.length){
      var ul = el('ul', 'plan-item-list');
      ul.setAttribute('aria-label', 'Planned sessions for ' + formatWeekdayDate(dateISO));
      items.forEach(function(item){
        var li = document.createElement('li');
        li.appendChild(planItemCard(item));
        ul.appendChild(li);
      });
      wrap.appendChild(ul);
    }

    // Same class and role as the form's own error surface, hosted by the day
    // instead — see planNotice. It survives the re-render that closed the
    // form, which is the whole point of holding it in module state.
    if(planNotice && planNotice.date === dateISO){
      var notice = el('p', 'plan-form-error plan-day-notice', planNotice.message);
      notice.setAttribute('role', 'alert');
      wrap.appendChild(notice);
    }

    var isOpen = planFormOpenFor === dateISO;
    var formWrapId = 'plan-form-' + dateISO;
    if(!isOpen){
      var addBtn = el('button', 'plan-day-add', '+ Add session');
      addBtn.type = 'button';
      addBtn.setAttribute('aria-expanded', 'false');
      addBtn.setAttribute('aria-controls', formWrapId);
      addBtn.setAttribute('aria-label', 'Add a planned session on ' + formatWeekdayDate(dateISO));
      addBtn.addEventListener('click', function(){
        planFormOpenFor = dateISO;
        planEditingId = null; // an add is never an edit, whatever was open before
        clearPlanNotice();    // starting a new entry is the athlete moving on
        renderPlan();
        var titleInput = document.getElementById('plan-title');
        if(titleInput){ titleInput.focus(); }
      });
      wrap.appendChild(addBtn);
    }
    var formWrap = el('div', 'plan-form-wrap');
    formWrap.id = formWrapId;
    formWrap.hidden = !isOpen;
    // Only the open day builds a form — the inputs use fixed ids
    // (plan-title, plan-duration…) so seven hidden copies would be seven
    // sets of duplicate ids and would break every label association.
    if(isOpen){
      // The item being edited, if any. Looked up by id against *this day's*
      // items, so a stale planEditingId (e.g. the row was deleted on another
      // device between opening and rendering) degrades to a blank add form
      // rather than throwing.
      var editItem = planEditingId
        ? items.filter(function(p){ return p.id === planEditingId; })[0] || null
        : null;
      renderPlanForm(formWrap, dateISO, function(){
        planFormOpenFor = null;
        planEditingId = null;
        renderPlan();

  // ═══════════════════════════════════════════════════════════════
  // PLAN BACK FROM A RACE — the phase-cycle builder.
  //
  // Pick an upcoming race, say how many weeks each phase runs, and the
  // dates fall out backwards from race week. It generates *phase blocks*,
  // never sessions: every number comes from the athlete, and what it writes
  // is ordinary `phasePlan` rows they can then edit or delete one by one in
  // the Phase Plan editor. The generator produces data; it does not own it.
  // That is the line "no in-app training plan generation" draws — the app
  // still never authors, suggests or adjusts a session.
  // ═══════════════════════════════════════════════════════════════
  // Chronological cycle order. The list is walked *backwards* from race
  // week when dating blocks, so the last phase with any weeks in it always
  // ends on race week — which is the one fact the whole screen exists to
  // guarantee. Taper sits last for exactly that reason: race week is a taper
  // week, and Base picks up again the Monday after.
  var PHASE_BUILD_ORDER = ['base', 'build1', 'build2', 'peak', 'taper'];
  var PHASE_BUILD_DEFAULT_WEEKS = {base: 4, build1: 4, build2: 4, peak: 3, taper: 1};
  var PHASE_BUILD_MAX = 26;
  var phaseBuildRaceId = null;
  var phaseBuildWeeks = null;   // seeded lazily, then kept across visits
  var phaseBuildAfter = true;   // "go back to Base after the race"
  // Snapshot of phasePlan taken immediately before a build is applied, so
  // the one destructive thing this screen does is reversible. Held here
  // rather than in the editor because the editor is only where it's *shown*
  // — and it is dropped by any subsequent phase edit (see the clears in
  // addPhaseBlock/updatePhaseBlock/deletePhaseBlock/setPhaseFromToday): an
  // undo that resurrects a plan the athlete has since edited by hand is
  // worse than no undo at all.
  var phaseBuildUndo = null;

  // Pure — takes a race date and week counts, returns the dated blocks in
  // chronological order. No reads of module state, so it can be reasoned
  // about (and tested) on its own.
  function phaseBuildBlocks(raceISO, weeks, returnAfter){
    var raceMon = mondayOf(new Date(raceISO + 'T00:00:00'));
    var cycle = [];
    var lastMon = raceMon;
    for(var i = PHASE_BUILD_ORDER.length - 1; i >= 0; i--){
      var key = PHASE_BUILD_ORDER[i];
      var w = weeks[key] || 0;
      if(w <= 0){ continue; }   // a phase set to 0 is skipped, not zero-length
      var start = addDays(lastMon, -(w - 1) * 7);
      cycle.push({phase: key, from: isoDate(start), weeks: w});
      lastMon = addDays(start, -7);
    }
    cycle.reverse();
    if(!cycle.length){ return []; }
    cycle[cycle.length - 1].endsRaceWeek = true;
    // Without this, the final cycle block would run forever and every week
    // after the race would resolve to Peak. Skipped when it would only
    // repeat the phase already running — the block it would add says
    // exactly what the open-ended one before it already says.
    if(returnAfter && cycle[cycle.length - 1].phase !== 'base'){
      cycle.push({phase: 'base', from: isoDate(addDays(raceMon, 7)), openEnded: true});
    }
    return cycle;
  }
  function phaseBuildSpanDates(b){
    if(b.openEnded){ return 'From ' + formatWeekdayDate(b.from); }
    var end = addDays(new Date(b.from + 'T00:00:00'), b.weeks * 7 - 1);
    return formatWeekdayDate(b.from) + ' – ' + formatWeekdayDate(isoDate(end));
  }
  function phaseBuildSpanMeta(b){
    if(b.openEnded){ return 'Ongoing · after the race'; }
    var parts = [b.weeks + (b.weeks === 1 ? ' week' : ' weeks')];
    if(b.endsRaceWeek){ parts.push('ends race week'); }
    return parts.join(' · ');
  }
  // Existing blocks the build would drop: anything starting inside the span
  // it covers. Blocks before it survive and correctly run up to its first
  // date; blocks after it survive and correctly take over later.
  function phaseBuildReplaced(blocks){
    if(!blocks.length){ return []; }
    var first = blocks[0].from, last = blocks[blocks.length - 1].from;
    return phasePlan.filter(function(b){ return b.from >= first && b.from <= last; });
  }
  function applyPhaseBuild(blocks){
    if(!blocks.length){ return 0; }
    // Fresh objects, not aliases of the live rows — restoring this must not
    // hand back objects a later edit has already mutated in place.
    phaseBuildUndo = phasePlan.map(function(b){ return {id: b.id, from: b.from, phase: b.phase}; });
    var first = blocks[0].from, last = blocks[blocks.length - 1].from;
    var kept = phasePlan.filter(function(b){ return b.from < first || b.from > last; });
    var made = blocks.map(function(b){ return {id: newPhaseBlockId(), from: b.from, phase: b.phase}; });
    // Every generated block starts on its own Monday and `kept` excludes the
    // whole covered span, so this cannot produce two blocks sharing a date
    // — the state that leaves one row inert and unreachable.
    phasePlan = kept.concat(made);
    submitPhaseToSheet('deleteRange', null, {from: first, to: last});
    submitPhaseToSheet('addBatch', null, {items: made});
    persistPhasePlan();
    recomputeCurrentPhase();
    return made.length;
  }
  function undoPhaseBuild(){
    if(!phaseBuildUndo){ return; }
    phasePlan = phaseBuildUndo;
    phaseBuildUndo = null;
    // A full-snapshot restore, not a specific span — 'replaceAll' wipes and
    // rewrites the whole Phases tab rather than trying to express this as a
    // deleteRange/addBatch pair against some derived span.
    submitPhaseToSheet('replaceAll', null, {items: phasePlan});
    persistPhasePlan();
    recomputeCurrentPhase();
  }

  function phaseBuildSelectedRace(){
    var up = upcomingRaces();
    if(!up.length){ return null; }
    var picked = up.filter(function(r){ return r.id === phaseBuildRaceId; })[0];
    return picked || up[0];
  }
  function phaseBuildCurrentBlocks(){
    var race = phaseBuildSelectedRace();
    if(!race){ return []; }
    return phaseBuildBlocks(race.date, phaseBuildWeeks, phaseBuildAfter);
  }
  function phaseBuildRow(b){
    var row = el('li', 'plan-item phasebuild-row');
    // The pill carries the phase name and nothing repeats it — the existing
    // editor's rows show a select and a pill saying the same word, which is
    // the redundancy this screen deliberately doesn't copy.
    var pillClass = PERIOD_PILL_CLASS[b.phase];
    row.appendChild(el('span', 'month-week-pill' + (pillClass ? ' ' + pillClass : ''), PERIOD_LABEL[b.phase] || b.phase));
    var main = el('div', 'phasebuild-row-main');
    main.appendChild(el('span', 'phasebuild-row-name', phaseBuildSpanDates(b)));
    main.appendChild(el('span', 'phasebuild-row-span', phaseBuildSpanMeta(b)));
    row.appendChild(main);
    return row;
  }
  // Rebuilds the preview only, never the whole view: the week counts are
  // live <input>s, and a full re-render on every keystroke would recreate
  // the field being typed into and take focus off it — the same trap
  // dateField()'s change handler avoids by calling renderFlowPlanCards()
  // rather than render().
  function renderPhaseBuildPreview(){
    var host = document.getElementById('phasebuild-preview');
    var actions = document.getElementById('phasebuild-actions');
    if(!host){ return; }
    clear(host);
    var blocks = phaseBuildCurrentBlocks();
    if(!blocks.length){
      host.appendChild(el('p', 'phasebuild-empty', 'Give at least one phase a week or more, and the dates will fall out from race week backwards.'));
      if(actions){ actions.hidden = true; }
      return;
    }
    var list = el('ul', 'plan-item-list');
    blocks.forEach(function(b){ list.appendChild(phaseBuildRow(b)); });
    host.appendChild(list);
    var replaced = phaseBuildReplaced(blocks);
    if(replaced.length){
      host.appendChild(el('p', 'phasebuild-warn',
        'This replaces ' + replaced.length + (replaced.length === 1 ? ' phase block' : ' phase blocks') +
        ' you already have between ' + formatWeekdayDate(blocks[0].from) +
        ' and ' + formatWeekdayDate(blocks[blocks.length - 1].from) + '. You can undo it straight after.'));
    }
    if(actions){ actions.hidden = false; }
  }
  function renderPhaseBuild(){
    var root = els.viewPhaseBuild;
    clear(root);

    var hero = el('div', 'race-hero');
    hero.appendChild(el('div', 'race-hero-eyebrow', 'Training phase'));
    var h = document.createElement('h1');
    h.className = 'race-hero-headline';
    h.id = 'phasebuild-h'; h.tabIndex = -1;
    h.appendChild(document.createTextNode('Plan back '));
    h.appendChild(el('span', 'accent', 'from a race'));
    h.appendChild(document.createTextNode('.'));
    hero.appendChild(h);
    hero.appendChild(el('p', 'race-hero-sub', 'Set how long each phase runs. The dates are worked out backwards from race week, and land in your phase plan as ordinary blocks you can edit afterwards.'));
    root.appendChild(hero);

    var back = document.createElement('button');
    back.type = 'button';
    back.className = 'dash-phase-change';
    back.textContent = '← Back to races';
    back.addEventListener('click', function(){ showView('races'); });
    root.appendChild(back);

    var up = upcomingRaces();
    if(!up.length){
      // The one state this screen can't work in. Say why, and point at the
      // thing that fixes it, rather than showing a form that cannot submit.
      root.appendChild(el('p', 'phasebuild-empty', 'There are no upcoming races saved yet. Add one on the Races tab and the phases can be dated back from it.'));
      var addLink = document.createElement('button');
      addLink.type = 'button';
      addLink.className = 'dash-signal-link';
      addLink.textContent = 'Go to races →';
      addLink.addEventListener('click', function(){ showView('races'); });
      root.appendChild(addLink);
      return;
    }
    if(!phaseBuildWeeks){
      phaseBuildWeeks = {};
      PHASE_BUILD_ORDER.forEach(function(k){ phaseBuildWeeks[k] = PHASE_BUILD_DEFAULT_WEEKS[k]; });
    }
    var race = phaseBuildSelectedRace();
    phaseBuildRaceId = race.id;

    var form = el('div', 'phasebuild-form');

    var select = document.createElement('select');
    select.className = 'phasebuild-select';
    select.id = 'phasebuild-race';
    up.forEach(function(r){
      var opt = document.createElement('option');
      opt.value = r.id;
      opt.textContent = r.name + ' · ' + formatRaceDateLabel(r.date);
      if(r.id === phaseBuildRaceId){ opt.selected = true; }
      select.appendChild(opt);
    });
    select.addEventListener('change', function(){
      phaseBuildRaceId = select.value;
      renderPhaseBuildPreview();
    });
    form.appendChild(planField('Race', 'The last phase ends on race week', select));

    var weeksWrap = el('div', 'phasebuild-weeks');
    PHASE_BUILD_ORDER.forEach(function(key){
      var cell = el('div', 'phasebuild-week');
      var input = document.createElement('input');
      input.type = 'number';
      input.id = 'phasebuild-w-' + key;
      input.min = '0'; input.max = String(PHASE_BUILD_MAX); input.step = '1';
      input.inputMode = 'numeric';
      input.value = String(phaseBuildWeeks[key]);
      var lbl = el('label', null, PERIOD_LABEL[key]);
      lbl.htmlFor = input.id;
      cell.appendChild(lbl);
      cell.appendChild(input);
      // Clamp on input so the preview never computes from a wild number,
      // but write the clamped value back only on change — rewriting the
      // field mid-keystroke fights someone clearing it to retype.
      input.addEventListener('input', function(){
        var n = parseInt(input.value, 10);
        phaseBuildWeeks[key] = isNaN(n) ? 0 : Math.max(0, Math.min(PHASE_BUILD_MAX, n));
        renderPhaseBuildPreview();
      });
      input.addEventListener('change', function(){
        input.value = String(phaseBuildWeeks[key]);
      });
      weeksWrap.appendChild(cell);
    });
    var weeksField = el('div', 'plan-field');
    var weeksLbl = el('span', 'field-lbl');
    weeksLbl.appendChild(document.createTextNode('Weeks per phase '));
    weeksLbl.appendChild(el('span', 'sub', 'Set a phase to 0 to skip it'));
    weeksField.appendChild(weeksLbl);
    weeksField.appendChild(weeksWrap);
    form.appendChild(weeksField);

    var toggle = el('label', 'phasebuild-toggle');
    var check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = phaseBuildAfter;
    check.addEventListener('change', function(){
      phaseBuildAfter = check.checked;
      renderPhaseBuildPreview();
    });
    toggle.appendChild(check);
    toggle.appendChild(document.createTextNode('Go back to Base after the race'));
    form.appendChild(toggle);

    var preview = el('div', 'phasebuild-preview');
    preview.id = 'phasebuild-preview';
    form.appendChild(preview);

    var actions = el('div', 'plan-form-actions phasebuild-actions');
    actions.id = 'phasebuild-actions';
    var apply = el('button', 'btn btn-primary', 'Add to phase plan');
    apply.type = 'button';
    apply.addEventListener('click', function(){
      var blocks = phaseBuildCurrentBlocks();
      if(!blocks.length){ return; }
      var picked = phaseBuildSelectedRace();
      var n = applyPhaseBuild(blocks);
      // Land on the editor, not back here: the athlete should see the rows
      // they just made, in the place they can change them.
      showView('phaseplan', 'Phase plan built back from ' + picked.name + ' — ' +
        n + (n === 1 ? ' block' : ' blocks') + ' added. Undo is at the top of this screen.');
    });
    actions.appendChild(apply);
    form.appendChild(actions);

    root.appendChild(form);
    renderPhaseBuildPreview();
  }
  function goToPhaseBuild(){ showView('phasebuild'); }
  // Opens the Plan view at one specific day with that day's form showing.
  // `editItem` (optional) makes it a pre-filled edit of that session rather
  // than a blank add. Every entry point — the Plan view's own card and the
  // Calendar's Add / Edit — goes through here, so they can't drift.
  function openPlanDayForm(dateISO, editItem){
    state.planWeek = weekKey(new Date(dateISO + 'T00:00:00'));
    // The same module state the Plan view's own "+ Add session" button sets —
    // not a second mechanism. It also suppresses the background re-render in
    // refreshVisibleViewFromSheet(), which is correct: a Sheet refresh landing
    // a moment after arrival must not rebuild the day out from under the form.
    planFormOpenFor = dateISO;

  }

  function clearWarmupChecklist(disc){
    Object.keys(state.warmupChecked).forEach(function(k){

  // Fires the instant every exercise gets checked off naturally — mirrors
  // TRI-run-strength's handleAllComplete(): logs the count and shows the
  // "Well done" banner immediately, but (unlike the manual complete button
  // below) leaves the checklist checked rather than clearing it, so the
  // athlete sees everything ticked. Only fires once per completion; the
  // banner and checklist both clear together via "Reset & go again".
  function handleWarmupAllComplete(disc){
    var next = (state.warmupSessions[disc] || 0) + 1;
    state.warmupSessions[disc] = next;
    persistWarmupSessions();
    state.warmupLogged[disc] = true;

  function renderWarmup(){
    var root = els.viewWarmup;

      banner.appendChild(el('p', 'warmup-completion-sub', 'All ' + data.exercises.length + ' exercises logged — that’s ' + data.label.toLowerCase() + ' warm-up #' + n + '.'));
      var again = document.createElement('button');

      var key = warmupCheckKey(disc, i);

        var justChecked = !state.warmupChecked[key];

          handleWarmupAllComplete(disc);
