  // ═══════════════════════════════════════════════════════════════
  // GOOGLE SHEET SYNC — the Sheet is the cross-device source of truth (see
  // STORAGE above). Every saved session is written here, and the log is
  // read back from here on load and whenever the This week / Month tabs
  // are opened, so a session logged on the phone shows up on the laptop.
  //
  // Endpoint is a Google Apps Script Web App bound to
  // https://docs.google.com/spreadsheets/d/15I6fMqoJjlakSrmbqgPkgz44eZ955LOUUrlvUh3IRy0/edit
  // — see apps-script/Code.gs for the script and column schema.
  //
  // Writes stay fire-and-forget (mode:'no-cors', opaque response) — a
  // failed or blocked write never blocks the check-in itself, and the
  // entry still shows locally this session via the optimistic log.push in
  // save(). Reads use the default 'cors' mode since the response body
  // actually needs to be parsed; the endpoint answers cross-origin GETs
  // fine (Apps Script Web Apps set permissive CORS headers by default).
  // ═══════════════════════════════════════════════════════════════
  var TRAINING_LOG_WRITE_URL = 'https://script.google.com/macros/s/AKfycbxqgAW5vtM3OonTIFQk_634WJLlk2f5YujJ5D65Nw76l8shoj4R1pf2zgrmHmKzY7_e_g/exec';
  var TRAINING_LOG_READ_URL = TRAINING_LOG_WRITE_URL + '?list=1';
  function submitSessionToSheet(entry){
    if(!TRAINING_LOG_WRITE_URL){ return; }
    var payload = {
      when: entry.date, disc: entry.disc, duration: entry.duration, intensity: entry.intensity,
      rpe: entry.rpe, a1: entry.a1, a2: entry.a2, a3: entry.a3, b2: entry.b2, b3: entry.b3,
      note: entry.note, phase: entry.phase
    };
    try{
      fetch(TRAINING_LOG_WRITE_URL, {
        method: 'POST', mode: 'no-cors',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      });
    } catch(err){ /* best-effort — never let a sync failure disrupt the check-in flow */ }
  }

  // Inverse of the payload built in submitSessionToSheet — same field
  // names, so a session round-trips through the Sheet unchanged. Sheet
  // rows have no loggedAt (that's local-only bookkeeping and nothing
  // reads it back), so it comes back null; entries are already in
  // chronological order because appendRow only ever adds to the bottom.
  function parseSheetSession(row){
    return {
      date: row.when || '', disc: row.disc || '', intensity: row.intensity || '',
      duration: row.duration === '' || row.duration == null ? null : row.duration,
      a1: row.a1 || null, a2: row.a2 || null, a3: row.a3 || null,
      rpe: row.rpe === '' || row.rpe == null ? null : parseInt(row.rpe, 10),
      b2: row.b2 || null, b3: row.b3 || null,
      note: row.note || '', phase: row.phase || null, loggedAt: null
    };
  }
  var sheetFetchInFlight = null;
  // Fetches the full log from the Sheet and replaces the in-memory/cached
  // copy with it. Returns a promise so callers can re-render once fresh
  // data lands; failures (offline, blocked request) just keep whatever was
  // already loaded — never throws past this function.
  function refreshLogFromSheet(){
    if(sheetFetchInFlight){ return sheetFetchInFlight; }
    sheetFetchInFlight = fetch(TRAINING_LOG_READ_URL)
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(!data || !data.ok || !Array.isArray(data.sessions)){ throw new Error('bad response'); }
        log = data.sessions.map(parseSheetSession);
        persistLog();
        return true;
      })
      .catch(function(){ return false; })
      .then(function(ok){ sheetFetchInFlight = null; return ok; });
    return sheetFetchInFlight;
  }

  var log = loadLog(); // cached copy; replaced by refreshLogFromSheet() as soon as the Sheet responds — see STORAGE above

  // ═══════════════════════════════════════════════════════════════
  // RACE CALENDAR SYNC — same Sheet, same pattern as the session log above:
  // a second sheet tab ("Races", created on demand by Code.gs) is the
  // cross-device source of truth. Adds/deletes are fire-and-forget no-cors
  // writes; the race `id` is generated here on the client (not by the
  // Sheet) specifically so a delete never needs to read an id back out of
  // an opaque add response.
  // ═══════════════════════════════════════════════════════════════
  var RACES_READ_URL = TRAINING_LOG_WRITE_URL + '?races=1';
  function newRaceId(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function submitRaceToSheet(action, race){
    if(!TRAINING_LOG_WRITE_URL){ return; }
    try{
      fetch(TRAINING_LOG_WRITE_URL, {
        method: 'POST', mode: 'no-cors',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({ kind: 'race', action: action, race: race })
      });
    } catch(err){ /* best-effort — same trade-off as submitSessionToSheet */ }
  }
  var racesFetchInFlight = null;
  function refreshRacesFromSheet(){
    if(racesFetchInFlight){ return racesFetchInFlight; }
    racesFetchInFlight = fetch(RACES_READ_URL)
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(!data || !data.ok || !Array.isArray(data.races)){ throw new Error('bad response'); }
        races = data.races;
        persistRaces();
        return true;
      })
      .catch(function(){ return false; })
      .then(function(ok){ racesFetchInFlight = null; return ok; });
    return racesFetchInFlight;
  }

  var races = loadRaces(); // cached copy; replaced by refreshRacesFromSheet() as soon as the Sheet responds

  // ═══════════════════════════════════════════════════════════════
  // TRAINING PLAN SYNC — same Sheet, same pattern as races above: a third
  // sheet tab ("Plan", created on demand by Code.gs) is the cross-device
  // source of truth for the athlete's manually-entered planned sessions.
  // Client-generated ids, fire-and-forget no-cors writes, cors reads.
  //
  // Two extra actions beyond the race pattern — addBatch and deleteWeek.
  // A week's plan is ~10 sessions, and firing 10 concurrent no-cors POSTs
  // races on the script's appendRow; one batched request per copy-week and
  // one per clear-week keeps a full week's entry to a couple of writes.
  // ═══════════════════════════════════════════════════════════════
  var PLAN_READ_URL = TRAINING_LOG_WRITE_URL + '?plan=1';
  function newPlanId(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  // `extra` carries whatever the action needs beyond a single item —
  // {items:[...]} for addBatch, {from,to} for deleteWeek.
  function submitPlanToSheet(action, item, extra){
    if(!TRAINING_LOG_WRITE_URL){ return; }
    var payload = {kind: 'plan', action: action};
    if(item){ payload.item = item; }
    if(extra){
      for(var k in extra){ if(Object.prototype.hasOwnProperty.call(extra, k)){ payload[k] = extra[k]; } }
    }
    try{
      fetch(TRAINING_LOG_WRITE_URL, {
        method: 'POST', mode: 'no-cors',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      // fetch() rejects a promise on a network failure rather than throwing
      // synchronously, so the try/catch alone doesn't swallow it — without
      // this, going offline logs an "Uncaught (in promise)" for every write.
      // Same trade-off as submitSessionToSheet: best-effort, never blocks.
      }).catch(function(){});
    } catch(err){ /* best-effort — same trade-off as submitSessionToSheet */ }
  }
  // Normalises a row coming back from the Sheet into the same shape the
  // client builds locally, so a planned session round-trips unchanged.
  // Duration is coerced here rather than trusted, since the Plan tab is
  // meant to be hand-editable and a human may type "60 min".
  function parseSheetPlanItem(row){
    var dur = parseInt(row.duration, 10);
    return {
      id: String(row.id || ''), date: row.date || '', disc: row.disc || '',
      title: row.title || '', intensity: row.intensity || '',
      duration: isNaN(dur) ? null : dur,
      key: row.key === true || row.key === 'TRUE' || row.key === 'true',
      notes: row.notes || '', phase: row.phase || ''
    };
  }
  var planFetchInFlight = null;
  function refreshPlanFromSheet(){
    if(planFetchInFlight){ return planFetchInFlight; }
    planFetchInFlight = fetch(PLAN_READ_URL)
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(!data || !data.ok || !Array.isArray(data.plan)){ throw new Error('bad response'); }
        plan = data.plan.map(parseSheetPlanItem);
        persistPlan();
        return true;
      })
      .catch(function(){ return false; })
      .then(function(ok){ planFetchInFlight = null; return ok; });
    return planFetchInFlight;
  }

  var plan = loadPlan(); // cached copy; replaced by refreshPlanFromSheet() as soon as the Sheet responds

  // ── Dates ─────────────────────────────────────────────────────
  var MONTH_DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  function isoDate(d){
    var y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
    return y + '-' + (m<10?'0':'')+m + '-' + (day<10?'0':'')+day;
  }
  function todayISO(){ return isoDate(new Date()); }
  var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  // Weekday + day + month, e.g. "Mon 10 Aug" — the app's base date label,
  // and the one source the three variants below all build on so they can't
  // drift apart: formatDateLabel substitutes "Today", formatRaceDateLabel
  // appends the year, and the Plan view's aria-labels and announcements use
  // this plain form directly (a "Remove X from Today" label is ambiguous in
  // a seven-day list where every row needs naming unambiguously).
  function formatWeekdayDate(iso){
    var d = new Date(iso + 'T00:00:00');
    return MONTH_DAYS[(d.getDay() + 6) % 7] + ' ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()];
  }
  function formatDateLabel(iso){
    if(!iso){ return null; }
    if(iso === todayISO()){ return 'Today'; }
    return formatWeekdayDate(iso);
  }
  function mondayOf(d){
    var m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var dayNum = (m.getDay() + 6) % 7; // 0 = Monday
    m.setDate(m.getDate() - dayNum);
    return m;
  }
  function addDays(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function isoWeekNumber(d){
    var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var dayNum = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    var firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
    var diff = date - firstThursday;
    return 1 + Math.round(diff / (7 * 86400000));
  }
  function weekKey(d){ return isoDate(mondayOf(d)); }

  // ── Races ─────────────────────────────────────────────────────
  function formatRaceDateLabel(iso){
    return formatWeekdayDate(iso) + ' ' + new Date(iso + 'T00:00:00').getFullYear();
  }
  // Whole days between today and iso (positive = future). Both sides are
  // taken at local midnight so a race "today" always reads as 0, never -1
  // or 1 depending on time of day.
  function daysUntil(iso){
    var today = new Date(); today.setHours(0,0,0,0);
    var target = new Date(iso + 'T00:00:00');
    return Math.round((target - today) / 86400000);
  }
  function raceCountdownLabel(days){
    if(days === 0){ return 'Today'; }
    if(days === 1){ return 'Tomorrow'; }
    if(days < 7){ return days + ' days'; }
    var weeks = Math.floor(days / 7), rem = days % 7;
    var label = weeks + (weeks === 1 ? ' week' : ' weeks');
    if(rem){ label += ' · ' + rem + (rem === 1 ? ' day' : ' days'); }
    return label;
  }
  function upcomingRaces(){
    var today = todayISO();
    return races.filter(function(r){ return r.date >= today; })
      .sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  function pastRaces(){
    var today = todayISO();
    return races.filter(function(r){ return r.date < today; })
      .sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  }
  function nextRace(){
    var up = upcomingRaces().filter(function(r){ return r.status === 'locked'; });
    return up.length ? up[0] : null;
  }

  // Real calendar week (Mon–Sun) containing `anchor`, built from the actual
  // log — no fabricated sessions, no seeded demo days.
  function buildWeek(anchorMonday){
    var today = todayISO();
    return MONTH_DAYS.map(function(abbr, i){
      var date = addDays(anchorMonday, i);
      var dISO = isoDate(date);
      var entries = log.filter(function(e){ return e.date === dISO; });
      var session = entries.length ? entries[entries.length-1] : null;
      var what = entries.map(function(e){
        var intensityLabel = e.intensity === 'hard' ? 'hard' : e.intensity === 'moderate' ? 'moderate' : 'easy';
        return (DISC_LABEL[e.disc]||'Session') + ' · ' + intensityLabel + ' · RPE ' + e.rpe;
      }).join('; ');
      var state;
      if(entries.length){ state = 'logged'; }
      else if(dISO > today){ state = 'upcoming'; }
      else { state = 'open'; }
      return {day: abbr, date: dISO, what: what, state: state, session: session, entries: entries};
    });
  }

  function currentWeekDays(){ return buildWeek(mondayOf(new Date())); }

  function monthWeekLabel(weekNum, phaseKey, isCurrent){
    var parts = ['Week ' + weekNum, PERIOD_LABEL[phaseKey] || phaseKey || 'Unset phase'];
    if(isCurrent){ parts.push('this week'); }
    return parts.join(' · ');
  }

  // Weeks to show in Month: every week (going back) that has at least one
  // logged session OR at least one planned session, plus the current week
  // always — capped to 6 so a long history doesn't turn into an endless
  // scroll on a phone.
  //
  // The plan clause is not cosmetic. Until it was added, a week that was fully
  // planned and completely missed — the single most informative week the
  // Adherence signal exists to report on — was silently absent from Month,
  // because the only inclusion test was "has a logged entry" and a missed week
  // has none by definition. See CLAUDE.md decision 30.
  var MAX_MONTH_WEEKS = 6;
  function monthWeeks(){
    var todayMonday = mondayOf(new Date());
    var weeks = [];
    for(var i = 0; i < 26 && weeks.length < MAX_MONTH_WEEKS; i++){
      var monday = addDays(todayMonday, -7*i);
      var days = buildWeek(monday);
      var weekPlan = planItemsInWeek(isoDate(monday));
      var hasAny = days.some(function(d){ return d.entries.length; }) || weekPlan.length > 0;
      var isCurrent = i === 0;
      if(!hasAny && !isCurrent){ continue; }
      var phaseCounts = {};
      days.forEach(function(d){ d.entries.forEach(function(e){ if(e.phase){ var pk = normalizePhaseKey(e.phase); phaseCounts[pk] = (phaseCounts[pk]||0)+1; } }); });
      // A plan-only week has no logged entries to read a phase off, so fall
      // back to the phase its planned rows carry before falling back to the
      // global once-ever setting — otherwise every missed week shows the
      // athlete's *current* phase pill rather than the one it was planned in.
      if(!Object.keys(phaseCounts).length){
        weekPlan.forEach(function(p){ if(p.phase){ var pk = normalizePhaseKey(p.phase); phaseCounts[pk] = (phaseCounts[pk]||0)+1; } });
      }
      var topPhase = null, topN = 0;
      Object.keys(phaseCounts).forEach(function(p){ if(phaseCounts[p] > topN){ topN = phaseCounts[p]; topPhase = p; } });
      var weekNum = isoWeekNumber(monday);
      var phaseKey = topPhase || state.periodisation;
      weeks.push({
        wk: monthWeekLabel(weekNum, phaseKey, isCurrent),
        weekNum: weekNum, phaseKey: phaseKey, isCurrent: isCurrent,
        days: days
      });
    }
    return weeks;
  }

  // ── State ─────────────────────────────────────────────────────
  var state = {
    ans: {date: todayISO()},
    step: 0,
    mode: 'ask',       // 'ask' | 'plan' | 'review' | 'saved'
    note: '',
    periodisation: loadPhase(),
    monthSignal: 'intensity',
    weekSignal: 'intensity',
    planWeek: weekKey(new Date()),  // Monday (ISO) of the week the Plan view is showing
    warmupDisc: 'swim',
    warmupChecked: {},
    warmupSessions: loadWarmupSessions(),
    warmupLogged: {}
  };
  var phaseReturnView = 'flow';
  // Whether returning from the phase picker should run the Check-in landing
  // decision. True only when the picker was a gate on the way *into* Check-in;
  // the in-flow "Change phase" link sets it false so it still lands back on
  // the question the athlete was on (decision 19).
  var phaseReturnWantsLanding = false;

  function isLong(v){ return v !== null && v !== undefined && parseInt(v,10) > 45; }
  function asked(q){ return !q.onlyLong || isLong(state.ans.duration); }
  // Each "step" is a page — an array of one or more questions rendered
  // together (see PAGE_GROUPS). A page whose questions are all filtered
  // out by asked() (e.g. the fuelling-only page on a short session)
  // disappears entirely rather than leaving a blank step.
  function steps(){
    return PAGE_GROUPS
      .map(function(keys){ return keys.map(function(k){ return QUESTIONS_BY_KEY[k]; }).filter(asked); })
      .filter(function(page){ return page.length > 0; });
  }
  function allQuestions(list){ return list.reduce(function(a, page){ return a.concat(page); }, []); }
  function missing(){ return allQuestions(steps()).filter(function(q){ return !state.ans[q.k]; }); }
  function pageIndexOfKey(list, key){
    for(var i=0;i<list.length;i++){
      for(var j=0;j<list[i].length;j++){
        if(list[i][j].k === key){ return i; }
      }
    }
    return 0;
  }
  function optionFor(q, v){
    for(var i=0;i<q.opts.length;i++){ if(q.opts[i].v === v){ return q.opts[i]; } }
    return null;
  }
  function loggedCountThisWeek(){ return currentWeekDays().reduce(function(n,d){ return n + d.entries.length; }, 0); }

  // ═══════════════════════════════════════════════════════════════
  // SIGNALS
  // ═══════════════════════════════════════════════════════════════
  var DASH_DISCIPLINES = ['swim','bike','run','brick','strength'];
  var DRIFT_CAT = {intent:'good', slight:'mid', well:'bad'};
  var FUEL_CAT  = {race:'good', lighter:'mid', no:'bad'};
  // Adherence reads a2 ("Did you do it as planned?"), which the check-in has
  // always captured and written to the Sheet's VsPlan column but which nothing
  // read back until now. Shortened and substituted are deliberately 'mid', not
  // 'bad' — the question's own hint promises they're flagged, not penalised.
  var PLAN_CAT  = {planned:'good', short:'mid', sub:'mid', didnt:'bad'};
  var STAT_MIN_N = 8;
  var NUMBER_WORDS = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine'];
  function numWord(n){ return (n >= 0 && n < 10) ? NUMBER_WORDS[n] : String(n); }
  function driftCat(session){ return session ? (DRIFT_CAT[session.a1] || null) : null; }
  function fuelCat(session){
    if(!session || !isLong(session.duration)) return null;
    return FUEL_CAT[session.a3] || null;
  }
  function planCat(session){ return session ? (PLAN_CAT[session.a2] || null) : null; }

  // ═══ ADHERENCE STAGE B — objective, plan-anchored ═══
  //
  // Stage A (planCat over the self-reported a2 field, above) is not replaced.
  // It stays exactly as shipped and still runs whenever the displayed period
  // contains no planned sessions at all — which is every period for an athlete
  // who has never opened the Plan view. Stage B takes over the moment any plan
  // row falls inside the period, and answers the question Stage A structurally
  // cannot: what was planned and never happened. See CLAUDE.md decision 30.
  //
  // Every existing tally short-circuits on `if(!d.session) return;`, so a day
  // with a planned session and no logged one is invisible to all of them.
  // That day is the whole point of this signal, which is why tallyDays()
  // cannot be reused here and tallyPlanDays() exists instead.
  // Memoises the greedy match per day object. Safe only because of one
  // invariant, which is why it's written down: buildWeek() constructs brand-new
  // day objects (and brand-new `entries` arrays) on every call, and nothing
  // mutates a day in place afterwards — so a cached result can never outlive
  // the data it was computed from. A Month render calls monthWeeks() a dozen
  // times over (once per discipline in the By-discipline strip, again for the
  // week blocks), and each planDayResults() is O(planned × logged), so this is
  // worth having. If day objects ever start being reused or mutated across a
  // plan refresh, this cache turns into a silent wrong-answer bug — delete it
  // rather than trying to invalidate it.
  var PLAN_MATCH_CACHE = new WeakMap();

  function daysHavePlan(days){
    return days.some(function(d){ return planItemsFor(d.date).length > 0; });
  }

  // Planned duration is free minutes; logged duration is one of three buckets
  // (30 / 60 / 120). Comparing them with the raw 25% rule alone would score a
  // 90-min planned session logged at its own pre-filled '60' bucket as
  // shortened — i.e. the Phase 2 pre-fill would manufacture false shortfalls
  // in the signal it was built to serve. Bucket parity is therefore checked
  // first, as an invariant: accepting the pre-fill always scores good.
  function planDurationOk(item, entry){
    var plannedMin = parseInt(item.duration, 10);
    var loggedMin  = parseInt(entry.duration, 10);
    if(!isFinite(plannedMin) || plannedMin <= 0 || !isFinite(loggedMin)){ return true; }
    if(String(entry.duration) === planDurationBucket(item.duration)){ return true; }
    return loggedMin >= plannedMin * 0.75;
  }

  // Greedy one-to-one match by (date, disc): each planned session consumes at
  // most one logged entry, each logged entry satisfies at most one planned
  // session, walked in array order. Two planned + two logged swims on one day
  // therefore produce two scored results, not one match plus a false miss plus
  // a false extra — decision 27 confirmed same-day, same-discipline doubles are
  // a real case in this app, so that is the case this rule exists for.
  //
  // Known limitation: with two planned swims of different durations on one day
  // and two logged swims, which logged entry pairs with which planned session
  // is arbitrary (array order), so the good/mid split between them can be the
  // wrong way round. The count is right; the attribution may not be. An exact
  // planId stamped on the check-in would remove the heuristic entirely and is
  // deliberately deferred — it needs a new column on the session sheet.
  function planDayResults(dayEntry){
    var cached = PLAN_MATCH_CACHE.get(dayEntry);
    if(cached){ return cached; }
    var today = todayISO();
    var planned = planItemsFor(dayEntry.date);
    var pool = dayEntry.entries;
    var used = [];
    var results = [];
    planned.forEach(function(item){
      var match = null;
      for(var i = 0; i < pool.length; i++){
        if(used[i]){ continue; }
        if(pool[i].disc !== item.disc){ continue; }
        used[i] = true; match = pool[i]; break;
      }
      var cat;
      if(!match){
        // Not yet due is not a miss. Only a planned session whose day has
        // already passed can be scored bad; today's and any future day are
        // 'pending' and stay out of the good/mid/bad tally entirely — without
        // this, every week would read as failing from Monday morning onward.
        cat = dayEntry.date < today ? 'bad' : 'pending';
      } else if(match.a2 === 'didnt'){
        cat = 'bad';
      } else if(match.a2 === 'short' || match.a2 === 'sub' || !planDurationOk(item, match)){
        cat = 'mid';
      } else {
        cat = 'good';
      }
      results.push({item:item, entry:match, cat:cat, day:dayEntry.day, disc:item.disc, key:!!item.key});
    });
    // Leftover logged entries are extras — counted and reported, never scored
    // as bad. An unplanned session is not a failure, and treating it as one
    // would make the whole signal actively misleading.
    var extras = pool.filter(function(e, i){ return !used[i]; });
    var out = {results:results, extras:extras};
    PLAN_MATCH_CACHE.set(dayEntry, out);
    return out;
  }

  // Same {good, mid, bad, total} shape tallyDays() returns, so renderSignalBody()
  // and renderStatBar() work unchanged — plus `extra` and `pending` alongside.
  function tallyPlanDays(days){
    var t = {good:0, mid:0, bad:0, total:0, extra:0, pending:0};
    days.forEach(function(d){
      var r = planDayResults(d);
      r.results.forEach(function(res){
        if(res.cat === 'pending'){ t.pending++; return; }
        t[res.cat]++; t.total++;
      });
      t.extra += r.extras.length;
    });
    return t;
  }

  function tallyDays(days, catFn){
    var t = {good:0, mid:0, bad:0, total:0};
    days.forEach(function(d){
      if(!d.session){ return; }
      var c = catFn(d.session);
      if(c){ t[c]++; t.total++; }
    });
    return t;
  }
  function dashPct(t){ return t.total ? Math.round(t.good / t.total * 100) : 0; }
  // A day can have more than one session in the same discipline (e.g. two
  // swim sets), so a grid cell renders one coloured segment per matching
  // entry rather than collapsing to just the day's last-logged session.
  function dashCell(dayEntry, disc, catFn){
    var entries = dayEntry.entries.filter(function(e){ return e.disc === disc; });
    var cell = el('div', 'dash-cell' + (entries.length > 1 ? ' multi' : ''));
    entries.forEach(function(e){
      var c = catFn(e);
      cell.appendChild(el('div', 'dash-cell-seg' + (c ? ' ' + c : ' na')));
    });
    return cell;
  }
  // Stage B's cell. Unlike dashCell() it is driven by the *plan*, not the log,
  // so it can draw a segment for a session that was planned and never logged —
  // something the grid has never had to represent. Note the deliberate split
  // between the two ways a session can score bad: `missed` (hatched, no logged
  // entry at all) vs `bad` (solid, logged but reported as not done). They are
  // different facts and the grid says so.
  function planDashCell(dayEntry, disc){
    var r = planDayResults(dayEntry);
    var segs = [];
    r.results.forEach(function(res){
      if(res.disc !== disc){ return; }
      if(res.cat === 'pending'){ segs.push('planned'); }
      else if(res.cat === 'bad' && !res.entry){ segs.push('missed'); }
      else { segs.push(res.cat); }
    });
    r.extras.forEach(function(e){ if(e.disc === disc){ segs.push('extra'); } });
    var cell = el('div', 'dash-cell' + (segs.length > 1 ? ' multi' : ''));
    segs.forEach(function(s){ cell.appendChild(el('div', 'dash-cell-seg ' + s)); });
    return cell;
  }
  function dashMatrixHeader(sub, weekLabel){
    var hd = el('div', 'dash-matrix-hd');
    if(weekLabel){ hd.appendChild(el('div', 'dash-matrix-week', weekLabel)); }
    if(sub){
      hd.appendChild(el('div', 'dash-matrix-rule'));
      hd.appendChild(el('div', 'dash-matrix-sub', sub));
    }
    return hd;
  }
  // "This week" version of the header — same week-number row as Month's own
  // week blocks, but with the current training phase as a pill right next to
  // it (Month gets its pill from each week's logged sessions; here there's
  // only ever one "this week" so it reads straight off state.periodisation),
  // plus a "Change phase" link directly under the row so it doesn't have to
  // be chased back up to the Training phase section above.
  function dashWeekPhaseHeader(weekLabel){
    var frag = document.createDocumentFragment();
    var hd = el('div', 'dash-matrix-hd');
    hd.appendChild(el('div', 'dash-matrix-week', weekLabel));
    var pillClass = PERIOD_PILL_CLASS[state.periodisation];
    hd.appendChild(el('span', 'month-week-pill' + (pillClass ? ' ' + pillClass : ''), PERIOD_LABEL[state.periodisation] || 'Unset phase'));
    frag.appendChild(hd);
    var change = document.createElement('button');
    change.type = 'button';
    change.className = 'dash-phase-change';
    change.textContent = 'Change phase →';
    change.addEventListener('click', function(){ openPhasePicker(); });
    frag.appendChild(change);
    return frag;
  }
  // cellFn is the Stage B seam: pass planDashCell to draw the grid from the
  // plan instead of from catFn over logged entries. Omitted everywhere else,
  // so Intensity, Fuelling and Stage A Adherence keep the exact code path
  // they had before.
  function dashMatrixGrid(catFn, days, cellFn){
    var grid = el('div', 'dash-grid');
    grid.appendChild(el('div'));
    days.forEach(function(d){ grid.appendChild(el('div', 'dash-grid-day', d.day.charAt(0))); });
    DASH_DISCIPLINES.forEach(function(disc){
      grid.appendChild(el('div', 'dash-grid-disc', DISC_LABEL[disc]));
      days.forEach(function(d){ grid.appendChild(cellFn ? cellFn(d, disc) : dashCell(d, disc, catFn)); });
    });
    return grid;
  }
  function dashMatrix(sub, catFn, days, weekLabel, cellFn){
    var frag = document.createDocumentFragment();
    frag.appendChild(dashMatrixHeader(sub, weekLabel));
    frag.appendChild(dashMatrixGrid(catFn, days, cellFn));
    return frag;
  }
  function renderStatBar(t, bigDesc){
    var frag = document.createDocumentFragment();
    var big = el('div', 'dash-stat-big');
    var pctEl = el('div', 'dash-stat-pct', String(dashPct(t)));
    pctEl.appendChild(el('span', 'u', '%'));
    big.appendChild(pctEl);
    big.appendChild(el('div', 'dash-stat-desc', bigDesc));
    frag.appendChild(big);
    var bar = el('div', 'tri-bar');
    var barColors = {good:'var(--dash-good)', mid:'var(--dash-mid)', bad:'var(--dash-bad)'};
    ['good','mid','bad'].forEach(function(k){
      if(!t[k]){ return; }
      var seg = document.createElement('span');
      seg.style.flex = String(t[k]);
      seg.style.background = barColors[k];
      bar.appendChild(seg);
    });
    frag.appendChild(bar);
    return frag;
  }
  function renderSignalBody(wrap, t, catFn, insight, opts, days){
    // The week-number row sits right under the section eyebrow (data-label,
    // rendered via ::before) and above everything else, "this week" only —
    // month blocks already carry their own per-week heading, so they keep
    // the matrix in its usual spot right before the grid.
    if(opts.weekLabel){ wrap.appendChild(dashWeekPhaseHeader(opts.weekLabel)); }
    var strip = el('div', 'dash-insight-strip');
    strip.style.borderLeftColor = 'var(--dash-' + insight.severity + ')';
    strip.style.background = 'color-mix(in srgb, var(--dash-' + insight.severity + ') 12%, var(--s1))';
    strip.appendChild(el('p', 'dash-insight-strip-headline', insight.headline));
    wrap.appendChild(strip);
    var hd = el('div', 'dash-stat-hd');
    hd.appendChild(el('div', 'dash-stat-n', opts.nText));
    wrap.appendChild(hd);
    // opts.hideStatBar suppresses the big-percentage + tri-bar block. It has
    // to be a flag rather than a deletion because this function is shared:
    // it draws This week's single card AND every week-block in Month, for all
    // three signals. Only Month's Fuelling and Adherence sections set it.
    if(!opts.hideStatBar && t.total >= STAT_MIN_N){ wrap.appendChild(renderStatBar(t, opts.bigDesc)); }
    var counts = el('div', 'dash-counts');
    function countEl(n, label2, color){
      var s = document.createElement('span');
      var b = document.createElement('b');
      b.style.color = color;
      b.textContent = String(n);
      s.appendChild(b);
      s.appendChild(document.createTextNode(' ' + label2));
      return s;
    }
    counts.appendChild(countEl(t.good, opts.goodLabel, 'var(--dash-good)'));
    counts.appendChild(countEl(t.mid, opts.midLabel, 'var(--dash-mid)'));
    counts.appendChild(countEl(t.bad, opts.badLabel, 'var(--dash-bad)'));
    wrap.appendChild(counts);
    if(opts.weekLabel){
      wrap.appendChild(dashMatrixHeader(opts.matrixSub, null));
      wrap.appendChild(dashMatrixGrid(catFn, days, opts.cellFn));
    } else {
      wrap.appendChild(dashMatrix(opts.matrixSub, catFn, days, null, opts.cellFn));
    }
  }
  function dashSignalSection(label, t, catFn, insight, opts, days){
    var wrap = el('div', 'dash-section dash-signal');
    wrap.setAttribute('data-label', label);
    var block = el('div', 'month-week-block');
    renderSignalBody(block, t, catFn, insight, opts, days);
    wrap.appendChild(block);
    var link = document.createElement('button');
    link.type = 'button';
    link.className = 'dash-signal-link';
    link.textContent = 'See this month →';
    link.addEventListener('click', function(){ goToMonth(opts.signal); });
    wrap.appendChild(link);
    return wrap;
  }
  // segClass, when given, styles the swatch with the *same* .dash-cell-seg
  // rule the grid uses, so a legend entry can never drift from what it claims
  // to describe. (.dash-legend-sw's own flex:none is declared after
  // .dash-cell-seg's flex:1, so it still wins outside a flex container.)
  function dashLegendItem(color, label, segClass){
    var it = el('div', 'dash-legend-item');
    var sw = document.createElement('span');
    sw.className = 'dash-legend-sw' + (segClass ? ' dash-cell-seg ' + segClass : '');
    if(!segClass){ sw.style.background = color; }
    it.appendChild(sw);
    it.appendChild(document.createTextNode(label));
    return it;
  }
  // The legend was previously hardcoded to the drift/fuelling vocabulary ("on
  // plan / slightly off / well off") and shown under all three subtabs, so it
  // already described Adherence wrongly before Stage B existed. It now takes
  // the signal it is captioning, and a stageB flag for the plan-anchored
  // vocabulary, which is a different set of states — not different words for
  // the same ones.
  var LEGEND_LABELS = {
    intensity: ['at intent', 'slightly over', 'well over'],
    fuelling:  ['race conc.', 'lighter', 'none'],
    adherence: ['as planned', 'adjusted', 'didn’t happen']
  };
  function dashLegend(signal, stageB){
    var legend = el('div', 'dash-legend');
    if(stageB){
      legend.appendChild(dashLegendItem('var(--dash-good)', 'as planned'));
      legend.appendChild(dashLegendItem('var(--dash-mid)', 'adjusted'));
      legend.appendChild(dashLegendItem('var(--dash-bad)', 'logged, off plan'));
      legend.appendChild(dashLegendItem(null, 'missed', 'missed'));
      legend.appendChild(dashLegendItem(null, 'not due yet', 'planned'));
      legend.appendChild(dashLegendItem('var(--ink3)', 'unplanned'));
      legend.appendChild(dashLegendItem('var(--s4)', 'nothing planned'));
      return legend;
    }
    var labels = LEGEND_LABELS[signal] || LEGEND_LABELS.intensity;
    legend.appendChild(dashLegendItem('var(--dash-good)', labels[0]));
    legend.appendChild(dashLegendItem('var(--dash-mid)', labels[1]));
    legend.appendChild(dashLegendItem('var(--dash-bad)', labels[2]));
    legend.appendChild(dashLegendItem(null, 'not asked', 'na'));
    legend.appendChild(dashLegendItem('var(--s4)', 'no session'));
    return legend;
  }
  // The compound-pair / bounce-back / good-streak vocabulary every signal's
  // rule set reads. `units` is a flat, chronological list of {day, disc, cat}:
  // logged sessions for Intensity and Fuelling, scored *planned* sessions for
  // Stage B Adherence. Extracted so Stage B extends the facts shape rather
  // than forking the rule set — the existing compound/isolated/clean rules
  // then work unchanged whichever kind of unit fed them.
  function accumulateFacts(units){
    var badCount = 0, goodCount = 0, total = 0, compoundPairs = 0, firstPair = null;
    var bounceBackPairs = 0, firstBounceBack = null, prevBad = null, curStreak = 0, goodStreak = 0;
    units.forEach(function(u){
      total++;
      if(u.cat === 'good'){
        goodCount++; curStreak++;
        if(curStreak > goodStreak){ goodStreak = curStreak; }
        if(prevBad){
          bounceBackPairs++;
          if(!firstBounceBack){ firstBounceBack = {day1: prevBad.day, disc1: DISC_LABEL[prevBad.disc], day2: u.day, disc2: DISC_LABEL[u.disc]}; }
        }
        prevBad = null;
      } else if(u.cat === 'bad'){
        curStreak = 0; badCount++;
        if(prevBad){
          compoundPairs++;
          if(!firstPair){ firstPair = {day1: prevBad.day, disc1: DISC_LABEL[prevBad.disc], day2: u.day, disc2: DISC_LABEL[u.disc]}; }
        }
        prevBad = {day: u.day, disc: u.disc};
      } else {
        curStreak = 0; prevBad = null;
      }
    });
    return {badCount:badCount, goodCount:goodCount, total:total, compoundPairs:compoundPairs, firstPair:firstPair, bounceBackPairs:bounceBackPairs, firstBounceBack:firstBounceBack, goodStreak:goodStreak};
  }
  function computeSignalFacts(weeks, catFn){
    var units = [];
    weeks.forEach(function(w){
      w.days.forEach(function(d){
        if(!d.session){ return; }
        var cat = catFn(d.session);
        if(cat === null){ return; }
        units.push({day: d.day, disc: d.session.disc, cat: cat});
      });
    });
    return accumulateFacts(units);
  }
  // Stage B's facts. Same vocabulary as above, computed over planned sessions
  // instead of logged ones, plus the two fields only the plan can supply:
  // missedKey (the first missed key:true session) and extraCount.
  function computePlanSignalFacts(weeks){
    var units = [], extraCount = 0, pendingCount = 0, missedKey = null;
    weeks.forEach(function(w){
      w.days.forEach(function(d){
        var r = planDayResults(d);
        r.results.forEach(function(res){
          if(res.cat === 'pending'){ pendingCount++; return; }
          units.push({day: res.day, disc: res.disc, cat: res.cat});
          if(res.cat === 'bad' && res.key && !missedKey){
            missedKey = {day: res.day, disc: DISC_LABEL[res.disc] || res.disc, title: (res.item.title || '')};
          }
        });
        extraCount += r.extras.length;
      });
    });
    var f = accumulateFacts(units);
    f.missedKey = missedKey;
    f.extraCount = extraCount;
    f.pendingCount = pendingCount;
    return f;
  }

  var DRIFT_INSIGHT_RULES = [
    {id:'compound_drift_2plus', priority:10, severity:'bad',
      match:function(f){ return f.compoundPairs >= 2; },
      headline:function(f){ return numWord(f.compoundPairs) + ' times this week, a session that ran well over intent was followed by another one running well over intent — that’s the pattern that turns into a niggle or a missed session, so check whether recovery between them is long enough.'; }},
    {id:'compound_drift_1', priority:20, severity:'bad',
      match:function(f){ return f.compoundPairs === 1; },
      headline:function(f){ return 'Your ' + f.firstPair.disc1 + ' on ' + f.firstPair.day1 + ' ran well over intent, and the ' + f.firstPair.disc2 + ' on ' + f.firstPair.day2 + ' that followed did too — one data point, worth watching before it becomes a pattern.'; }},
    {id:'bounce_back_drift', priority:25, severity:'mid',
      match:function(f){ return f.badCount > 0 && f.compoundPairs === 0 && f.bounceBackPairs > 0; },
      headline:function(f){ return 'Your ' + f.firstBounceBack.disc1 + ' on ' + f.firstBounceBack.day1 + ' ran well over intent, but the ' + f.firstBounceBack.disc2 + ' on ' + f.firstBounceBack.day2 + ' right after landed back at intent — recovery did its job.'; }},
    {id:'isolated_drift_no_compound', priority:30, severity:'mid',
      match:function(f){ return f.badCount > 0 && f.compoundPairs === 0; },
      headline:function(f){ return numWord(f.badCount) + (f.badCount === 1 ? ' session ran' : ' sessions ran') + ' well over intent this week, but recovery held — no back-to-back pattern.'; }},
    {id:'clean_week_no_data', priority:45,
      match:function(f){ return f.total === 0; }, severity:'mid',
      headline:function(){ return 'No sessions logged yet this week.'; }},
    {id:'clean_week', priority:40, severity:'good',
      match:function(f){ return f.total > 0 && f.badCount === 0; },
      headline:function(f){
        if(f.goodStreak >= 5){ return 'Every session this week finished at the effort you intended — ' + numWord(f.goodStreak) + ' in a row, pacing held from first session to last.'; }
        return 'Every session this week finished at the effort you intended.';
      }}
  ];
  function resolveDriftInsight(facts){
    var matches = DRIFT_INSIGHT_RULES.filter(function(r){ return r.match(facts); });
    matches.sort(function(a,b){ return a.priority - b.priority; });
    return matches[0];
  }

  var FUEL_INSIGHT_RULES = [
    {id:'compound_fuel_2plus', priority:10, severity:'bad',
      match:function(f){ return f.compoundPairs >= 2; },
      headline:function(f){ return numWord(f.compoundPairs) + ' times this week, a long session that wasn’t fuelled was followed by another unfuelled long session — that’s the pattern that shows up as a bonk on race day, so check whether that first miss is carrying into the next one.'; }},
    {id:'compound_fuel_1', priority:20, severity:'bad',
      match:function(f){ return f.compoundPairs === 1; },
      headline:function(f){ return 'Your ' + f.firstPair.disc1 + ' on ' + f.firstPair.day1 + ' wasn’t fuelled, and the ' + f.firstPair.disc2 + ' on ' + f.firstPair.day2 + ' that followed wasn’t either — one data point, worth watching before under-fuelling becomes the default.'; }},
    {id:'bounce_back_fuel', priority:25, severity:'mid',
      match:function(f){ return f.badCount > 0 && f.compoundPairs === 0 && f.bounceBackPairs > 0; },
      headline:function(f){ return 'Your ' + f.firstBounceBack.disc1 + ' on ' + f.firstBounceBack.day1 + ' wasn’t fuelled, but the ' + f.firstBounceBack.disc2 + ' on ' + f.firstBounceBack.day2 + ' right after went back to race concentration — the miss didn’t repeat.'; }},
    {id:'isolated_fuel_no_compound', priority:30, severity:'mid',
      match:function(f){ return f.badCount > 0 && f.compoundPairs === 0; },
      headline:function(f){ return numWord(f.badCount) + (f.badCount === 1 ? ' long session wasn’t fuelled' : ' long sessions weren’t fuelled') + ' this week, but it didn’t carry into the next one.'; }},
    {id:'clean_month_fuel', priority:40, severity:'good',
      match:function(f){ return f.total > 0 && f.badCount === 0; },
      headline:function(f){
        if(f.goodStreak >= 5){ return 'Every long session this week was fuelled at race concentration — ' + numWord(f.goodStreak) + ' in a row, the habit is holding.'; }
        return 'Every long session this week was fuelled at race concentration.';
      }},
    {id:'no_long_sessions', priority:50, severity:'mid',
      match:function(f){ return f.total === 0; },
      headline:function(){ return 'No sessions over 45 min yet this week.'; }}
  ];
  function resolveFuelInsight(facts){
    var matches = FUEL_INSIGHT_RULES.filter(function(r){ return r.match(facts); });
    matches.sort(function(a,b){ return a.priority - b.priority; });
    return matches[0];
  }

  // 'mid' here is shortened-or-substituted, which computeSignalFacts doesn't
  // count directly — it's whatever isn't good and isn't bad.
  function adherenceAdjusted(f){ return f.total - f.goodCount - f.badCount; }
  var ADHERENCE_INSIGHT_RULES = [
    // Stage B only — missedKey, extraCount and pendingCount are undefined in
    // Stage A's facts, so these three simply never match there and the rule
    // set stays a single shared list rather than two divergent ones.
    //
    // This is the rule that makes the `key` flag load-bearing rather than
    // merely stored: at priority 5 it outranks every other rule, so one missed
    // key session forces the period's severity to bad no matter how clean the
    // rest of the week was.
    {id:'missed_key_session', priority:5, severity:'bad',
      match:function(f){ return !!f.missedKey; },
      headline:function(f){
        var when = WEEKDAY_FULL[f.missedKey.day] || f.missedKey.day;
        // With a title the em-dashes do the setting-off, so the comma after
        // "session" has to go — otherwise it reads "Your key session, — VO2
        // 5x3min — the run on…". Without a title the comma is what sets the
        // clause off instead. Both forms verified rendered, not just read.
        var lead = f.missedKey.title ? (' — ' + f.missedKey.title + ' — ') : ', ';
        return 'Your key session' + lead + 'the ' + f.missedKey.disc.toLowerCase() + ' on ' + when + ', didn’t happen. That’s the one the week was built around; the easy sessions can slide without costing much, that one can’t.';
      }},
    {id:'plan_nothing_due_yet', priority:8, severity:'mid',
      match:function(f){ return f.total === 0 && f.pendingCount > 0; },
      headline:function(f){ return numWord(f.pendingCount) + (f.pendingCount === 1 ? ' session is planned this week and it hasn’t come due yet.' : ' sessions are planned this week and none has come due yet.'); }},
    {id:'compound_missed_2plus', priority:10, severity:'bad',
      match:function(f){ return f.compoundPairs >= 2; },
      headline:function(f){ return numWord(f.compoundPairs) + ' times this week, a session you didn’t do was followed by another one you didn’t do — that’s a week coming apart rather than a session skipped, so look at what’s crowding the week before you look at the training.'; }},
    {id:'compound_missed_1', priority:20, severity:'bad',
      match:function(f){ return f.compoundPairs === 1; },
      headline:function(f){ return 'Your ' + f.firstPair.disc1 + ' on ' + f.firstPair.day1 + ' didn’t happen, and the ' + f.firstPair.disc2 + ' on ' + f.firstPair.day2 + ' that followed didn’t either — one data point, worth watching before missing becomes the default.'; }},
    {id:'bounce_back_adherence', priority:25, severity:'mid',
      match:function(f){ return f.badCount > 0 && f.compoundPairs === 0 && f.bounceBackPairs > 0; },
      headline:function(f){ return 'Your ' + f.firstBounceBack.disc1 + ' on ' + f.firstBounceBack.day1 + ' didn’t happen, but the ' + f.firstBounceBack.disc2 + ' on ' + f.firstBounceBack.day2 + ' right after went as planned — the miss didn’t carry into the next one.'; }},
    {id:'isolated_missed', priority:30, severity:'mid',
      match:function(f){ return f.badCount > 0 && f.compoundPairs === 0; },
      headline:function(f){ return numWord(f.badCount) + (f.badCount === 1 ? ' planned session didn’t happen' : ' planned sessions didn’t happen') + ' this week, but the rest of the week held — no back-to-back pattern.'; }},
    {id:'all_shortened', priority:35, severity:'mid',
      match:function(f){ return f.total > 0 && f.badCount === 0 && adherenceAdjusted(f) > 0; },
      headline:function(f){
        var n = adherenceAdjusted(f);
        return numWord(n) + (n === 1 ? ' session was shortened or substituted' : ' sessions were shortened or substituted') + ' this week, but nothing was missed outright — the week’s shape held even where the sessions didn’t match the plan.';
      }},
    {id:'clean_week_with_extra', priority:38, severity:'good',
      match:function(f){ return f.total > 0 && f.badCount === 0 && f.goodCount === f.total && f.extraCount > 0; },
      headline:function(f){ return 'Every planned session this week happened, plus ' + numWord(f.extraCount).toLowerCase() + (f.extraCount === 1 ? ' that wasn’t planned — extra on top of a complete week, not instead of one.' : ' that weren’t planned — extra on top of a complete week, not instead of one.'); }},
    {id:'clean_week_adherence', priority:40, severity:'good',
      match:function(f){ return f.total > 0 && f.badCount === 0 && f.goodCount === f.total; },
      headline:function(f){
        if(f.goodStreak >= 5){ return 'Every session this week went as planned — ' + numWord(f.goodStreak) + ' in a row, the plan and the week are the same thing right now.'; }
        return 'Every session this week went as planned.';
      }},
    {id:'no_adherence_data', priority:45, severity:'mid',
      match:function(f){ return f.total === 0; },
      headline:function(){ return 'Nothing logged yet this week that says whether it went to plan.'; }}
  ];
  function resolveAdherenceInsight(facts){
    var matches = ADHERENCE_INSIGHT_RULES.filter(function(r){ return r.match(facts); });
    matches.sort(function(a,b){ return a.priority - b.priority; });
    return matches[0];
  }

  var WEEKDAY_FULL = {Mon:'Monday', Tue:'Tuesday', Wed:'Wednesday', Thu:'Thursday', Fri:'Friday', Sat:'Saturday', Sun:'Sunday'};
  var DISC_SINGULAR_NOUN = {swim:'swim', bike:'bike', run:'run', brick:'brick', strength:'strength session'};
  var DISC_PLURAL_NOUN   = {swim:'swims', bike:'bikes', run:'runs', brick:'bricks', strength:'strength sessions'};
  function disciplineWeekday(disc){
    var day = null, consistent = true;
    monthWeeks().forEach(function(w){
      w.days.forEach(function(d){
        if(!d.session || d.session.disc !== disc){ return; }
        if(day === null){ day = d.day; }
        else if(day !== d.day){ consistent = false; }
      });
    });
    return consistent ? day : null;
  }
  function disciplineTally(disc, catFn){
    var t = {good:0, mid:0, bad:0, total:0};
    monthWeeks().forEach(function(w){
      w.days.forEach(function(d){
        if(!d.session || d.session.disc !== disc){ return; }
        var c = catFn(d.session);
        if(c){ t[c]++; t.total++; }
      });
    });
    return t;
  }
  // Stage B's per-discipline tally. Without this, the By-discipline strip
  // would still be reading self-reported a2 values while the section directly
  // below it reads the plan — so a fully missed Tuesday swim could headline as
  // "Every Tuesday swim this month went as planned" three centimetres above a
  // grid row of hatched misses. Same switch predicate as everywhere else.
  function disciplinePlanTally(disc){
    var t = {good:0, mid:0, bad:0, total:0};
    monthWeeks().forEach(function(w){
      w.days.forEach(function(d){
        planDayResults(d).results.forEach(function(res){
          if(res.disc !== disc || res.cat === 'pending'){ return; }
          t[res.cat]++; t.total++;
        });
      });
    });
    return t;
  }
  function monthHasPlan(){
    return monthWeeks().some(function(w){ return daysHavePlan(w.days); });
  }
  function disciplineSeverity(t){ return t.bad ? 'bad' : (t.mid ? 'mid' : 'good'); }
  function disciplineDriftHeadline(disc, t, weekday){
    var one  = weekday ? (WEEKDAY_FULL[weekday] + ' ' + DISC_SINGULAR_NOUN[disc]) : DISC_SINGULAR_NOUN[disc];
    var many = weekday ? (WEEKDAY_FULL[weekday] + ' ' + DISC_PLURAL_NOUN[disc])   : DISC_PLURAL_NOUN[disc];
    if(t.bad === t.total){ return 'Every ' + one + ' this month ran well over intent.'; }
    if(t.mid === t.total){ return 'Every ' + one + ' this month ran slightly over intent.'; }
    if(t.bad){ return numWord(t.bad) + ' of ' + numWord(t.total).toLowerCase() + ' ' + many + ' ran well over intent this month.'; }
    if(t.mid){ return numWord(t.mid) + ' of ' + numWord(t.total).toLowerCase() + ' ' + many + ' ran slightly over intent this month.'; }
    return 'Every ' + one + ' this month finished at the effort you intended.';
  }
  function disciplineFuelHeadline(disc, t, weekday){
    var one  = weekday ? (WEEKDAY_FULL[weekday] + ' ' + DISC_SINGULAR_NOUN[disc]) : DISC_SINGULAR_NOUN[disc];
    var many = weekday ? (WEEKDAY_FULL[weekday] + ' ' + DISC_PLURAL_NOUN[disc])   : DISC_PLURAL_NOUN[disc];
    if(t.bad === t.total){ return 'Every ' + one + ' over 45 min this month wasn’t fuelled.'; }
    if(t.mid === t.total){ return 'Every ' + one + ' over 45 min this month ran lighter than race concentration.'; }
    if(t.bad){ return numWord(t.bad) + ' of ' + numWord(t.total).toLowerCase() + ' ' + many + ' over 45 min weren’t fuelled this month.'; }
    if(t.mid){ return numWord(t.mid) + ' of ' + numWord(t.total).toLowerCase() + ' ' + many + ' over 45 min ran lighter than race concentration this month.'; }
    return 'Every ' + one + ' over 45 min this month was fuelled at race concentration.';
  }
  function disciplineAdherenceHeadline(disc, t, weekday){
    var one  = weekday ? (WEEKDAY_FULL[weekday] + ' ' + DISC_SINGULAR_NOUN[disc]) : DISC_SINGULAR_NOUN[disc];
    var many = weekday ? (WEEKDAY_FULL[weekday] + ' ' + DISC_PLURAL_NOUN[disc])   : DISC_PLURAL_NOUN[disc];
    if(t.bad === t.total){ return 'Not one ' + one + ' this month happened.'; }
    if(t.mid === t.total){ return 'Every ' + one + ' this month was shortened or substituted.'; }
    if(t.bad){ return numWord(t.bad) + ' of ' + numWord(t.total).toLowerCase() + ' ' + many + ' didn’t happen this month.'; }
    if(t.mid){ return numWord(t.mid) + ' of ' + numWord(t.total).toLowerCase() + ' ' + many + (t.mid === 1 ? ' was' : ' were') + ' shortened or substituted this month.'; }
    return 'Every ' + one + ' this month went as planned.';
  }
  function renderDisciplineInsights(catFn, headlineFn, tallyFn){
    var wrap = el('div', 'dash-section');
    wrap.setAttribute('data-label', 'By discipline');
    var any = false;
    DASH_DISCIPLINES.forEach(function(disc){
      var t = tallyFn ? tallyFn(disc) : disciplineTally(disc, catFn);
      if(!t.total){ return; }
      any = true;
      var weekday = disciplineWeekday(disc);
      var label = weekday ? (DISC_LABEL[disc] + ' · ' + WEEKDAY_FULL[weekday] + 's') : DISC_LABEL[disc];
      var severity = disciplineSeverity(t);
      var strip = el('div', 'dash-insight-strip');
      strip.style.borderLeftColor = 'var(--dash-' + severity + ')';
      strip.style.background = 'color-mix(in srgb, var(--dash-' + severity + ') 12%, var(--s1))';
      strip.appendChild(el('div', 'dash-insight-strip-label', label));
      strip.appendChild(el('p', 'dash-insight-strip-headline', headlineFn(disc, t, weekday)));
      wrap.appendChild(strip);
    });
    if(!any){ wrap.appendChild(el('p', 'empty-note', 'No sessions with a signal logged yet.')); }
    return wrap;
  }
  // monthTally() lived here: a month-wide roll-up whose only caller was the
  // aggregate stat bar at the top of Month's Fuelling section. That bar was
  // removed, so the helper went with it rather than being left as dead code
  // for the next reader to work out. Note it was Stage-A only (tallyDays over
  // a catFn) — it never understood the plan-aware Stage B path, so it was not
  // reusable for Adherence anyway.
  function monthWeekHeader(w){
    var hd = el('div', 'month-week-hd');
    hd.appendChild(el('span', 'month-week-label', 'Week ' + w.weekNum));
    var pillClass = PERIOD_PILL_CLASS[w.phaseKey];
    if(pillClass){
      hd.appendChild(el('span', 'month-week-pill ' + pillClass, PERIOD_LABEL[w.phaseKey]));
    } else {
      hd.appendChild(el('span', 'month-week-pill', 'Unset phase'));
    }
    if(w.isCurrent){ hd.appendChild(el('span', 'month-week-current', 'this week')); }
    return hd;
  }
  function renderMonthSection(label, catFn, opts, resolveInsight){
    var wrap = el('div', 'dash-section');
    wrap.setAttribute('data-label', label);
    var weeks = monthWeeks();
    weeks.forEach(function(w){
      var block = el('div', 'month-week-block');
      block.appendChild(monthWeekHeader(w));
      // The Stage A/B switch is per *week*, not per view: a month can contain
      // both weeks the athlete planned and weeks they didn't, and each should
      // be reported the most precise way its own data allows.
      var useB = !!opts.planAware && daysHavePlan(w.days);
      var t = useB ? tallyPlanDays(w.days) : tallyDays(w.days, catFn);
      var facts = useB ? computePlanSignalFacts([{wk:w.wk, days:w.days}])
                       : computeSignalFacts([{wk:w.wk, days:w.days}], catFn);
      var rule = resolveInsight(facts);
      renderSignalBody(block, t, catFn, {severity: rule.severity, headline: rule.headline(facts)},
        {nText: useB && opts.nTextB ? opts.nTextB(t) : opts.nText(t), bigDesc: opts.bigDesc,
         goodLabel: opts.goodLabel, midLabel: opts.midLabel,
         badLabel: useB && opts.badLabelB ? opts.badLabelB : opts.badLabel,
         matrixSub: useB && opts.matrixSubB ? opts.matrixSubB : opts.matrixSub,
         hideStatBar: !!opts.hideStatBar,
         cellFn: useB ? planDashCell : null},
        w.days);
      wrap.appendChild(block);
    });
    return wrap;
  }
  function renderSignalSubtabs(current, onSelect){
    var tabs = el('div', 'signal-subtabs');
    tabs.setAttribute('role', 'tablist');
    tabs.setAttribute('aria-label', 'Signal');
    [['intensity','Intensity'], ['fuelling','Fuelling'], ['adherence','Adherence']].forEach(function(pair){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'signal-subtab';
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-selected', String(current === pair[0]));
      btn.setAttribute('data-signal', pair[0]);
      btn.textContent = pair[1];
      btn.addEventListener('click', function(){
        // Choosing a signal re-renders the whole view, which destroys this
        // button — so a keyboard user would otherwise be dropped back to
        // <body> and lose their place. Put focus back on the same tab in the
        // freshly rendered tablist. Mouse users see no ring, since the focus
        // outline is :focus-visible only.
        var owner = tabs.parentNode;
        var keepFocus = document.activeElement === btn;
        onSelect(pair[0]);
        if(!keepFocus || !owner){ return; }
        var next = owner.querySelector('.signal-subtab[data-signal="' + pair[0] + '"]');
        if(next){ next.focus(); }
      });
      tabs.appendChild(btn);
    });
    return tabs;
  }
  function renderTrends(){
    var root = els.viewTrends;
    clear(root);
    var h = el('h1', 'dash-eyebrow', 'This month');
    h.id = 'trends-h'; h.tabIndex = -1;
    root.appendChild(h);
    root.appendChild(renderSignalSubtabs(state.monthSignal, function(v){ state.monthSignal = v; renderTrends(); }));
    var adherenceLegendStageB = false;
    if(state.monthSignal === 'fuelling'){
      root.appendChild(renderDisciplineInsights(fuelCat, disciplineFuelHeadline));
      // No stat bar in Month for Fuelling — neither the month-wide aggregate
      // that used to sit here (with its monthTally(fuelCat)) nor the per-week
      // one inside each block. This week still shows both, and Month's
      // Intensity section still shows its per-week one.
      root.appendChild(renderMonthSection('Fuelling', fuelCat, {
        nText: function(t){ return t.total + ' over 45 min'; }, bigDesc: 'at race concentration',
        goodLabel: 'race conc.', midLabel: 'lighter', badLabel: 'none', matrixSub: 'over 45 min only',
        hideStatBar: true
      }, resolveFuelInsight));
    } else if(state.monthSignal === 'adherence'){
      var monthPlan = monthHasPlan();
      root.appendChild(renderDisciplineInsights(planCat, disciplineAdherenceHeadline, monthPlan ? disciplinePlanTally : null));
      root.appendChild(renderMonthSection('Adherence', planCat, {
        planAware: true,
        nText: function(t){ return t.total + ' session' + (t.total === 1 ? '' : 's'); },
        nTextB: function(t){ return t.total + ' of ' + (t.total + t.pending) + ' planned' + (t.extra ? ' · ' + t.extra + ' unplanned' : ''); },
        bigDesc: 'went as planned',
        goodLabel: 'as planned', midLabel: 'adjusted', badLabel: 'didn’t happen', badLabelB: 'missed',
        matrixSub: 'by session', matrixSubB: 'planned vs logged',
        hideStatBar: true // Month only — This week's Adherence card keeps it
      }, resolveAdherenceInsight));
      adherenceLegendStageB = monthPlan;
    } else {
      root.appendChild(renderDisciplineInsights(driftCat, disciplineDriftHeadline));
      root.appendChild(renderMonthSection('Intensity drift', driftCat, {
        nText: function(t){ return t.total + ' session' + (t.total === 1 ? '' : 's'); }, bigDesc: 'finished at intent',
        goodLabel: 'at intent', midLabel: 'slightly over', badLabel: 'well over', matrixSub: 'by session'
      }, resolveDriftInsight));
    }
    root.appendChild(dashLegend(state.monthSignal, adherenceLegendStageB));
  }
  // ── "This week's plan" — Adherence subtab, This week only ──────────
  // A read-only listing of the displayed week's plan, day by day, with a
  // per-day link into the Plan view. It deliberately does *not* reuse
  // planItemCard(): that card carries a Remove button whose handler calls
  // renderPlan(), which draws into the hidden Plan view — pressed from
  // Review the session would disappear from the data while staying on
  // screen. Every mutation stays in the Plan view, which is exactly what
  // the per-day button navigates to.
  // One compact line: discipline dot, one-line summary, Edit on the right.
  // The Edit sits on the *session*, not on the day, because a day can hold
  // more than one — decision 27 established same-day same-discipline doubles
  // are real here, and decision 29 already refused a day-level tap target for
  // exactly this reason: with two sessions, one button has to guess which,
  // and guessing wrong here silently overwrites the wrong session's fields.
  // Stacked lines keep the day's date label appearing once, as specified.
  function dashPlanLine(item){
    var li = el('li', 'dash-plan-line');
    var dot = el('span', 'dash-plan-dot');
    // The existing discipline identity tokens (--swim/--bike/--run/--brick/
    // --strength), same as planItemCard — no new colours.
    dot.style.background = 'var(--' + item.disc + ')';
    // Decorative: the discipline is named in words in the summary beside it,
    // so the dot carries nothing on its own and needs no contrast floor.
    dot.setAttribute('aria-hidden', 'true');
    li.appendChild(dot);
    var text = el('span', 'dash-plan-line-text', planSummaryLine(item));
    li.appendChild(text);
    // Kept even though the specified summary is "discipline — title ·
    // duration": a key session is what decision 30 lets force a week's
    // severity to bad, so dropping the marker from a plan listing would hide
    // the one attribute the Adherence signal treats as load-bearing.
    if(item.key){ li.appendChild(el('span', 'plan-item-key', 'Key')); }
    var edit = el('button', 'dash-plan-edit', 'Edit');
    edit.type = 'button';
    edit.setAttribute('aria-label', 'Edit ' + (item.title || DISC_LABEL[item.disc] || 'session') + ' on ' + formatWeekdayDate(item.date));
    edit.addEventListener('click', function(){ openPlanEditor(item); });
    li.appendChild(edit);
    return li;
  }
  function dashPlanDay(dateISO){
    var row = el('li', 'dash-plan-day' + (dateISO === todayISO() ? ' is-today' : ''));
    var d = new Date(dateISO + 'T00:00:00');
    // Weekday + day-of-month only. The month is dropped because all seven
    // rows are one week and the Adherence panel above already names it; the
    // uppercase-tracked label style is the app's existing date treatment
    // (.plan-day-date, .race-month-label), not a new one.
    var dateLbl = el('span', 'dash-plan-date', MONTH_DAYS[(d.getDay() + 6) % 7] + ' ' + d.getDate());
    // The visible label is abbreviated; screen readers get the unabbreviated
    // date so a row is never announced as a bare "Mon 17".
    dateLbl.setAttribute('aria-label', formatWeekdayDate(dateISO) + (dateISO === todayISO() ? ', today' : ''));
    row.appendChild(dateLbl);

    var lines = el('ul', 'dash-plan-lines');
    var items = planItemsFor(dateISO);
    if(items.length){
      lines.setAttribute('aria-label', 'Planned sessions for ' + formatWeekdayDate(dateISO));
      items.forEach(function(item){ lines.appendChild(dashPlanLine(item)); });
    } else {
      // "Nothing planned", not "Rest day" — the splash Today card's "Rest
      // day" asserts something about *today* specifically; in a full 7-day
      // listing absence per row is already obvious and needs no claim.
      var empty = el('li', 'dash-plan-line');
      empty.appendChild(el('span', 'dash-plan-empty', 'Nothing planned'));
      var add = el('button', 'dash-plan-edit', 'Add');
      add.type = 'button';
      add.setAttribute('aria-label', 'Add a planned session on ' + formatWeekdayDate(dateISO));
      add.addEventListener('click', function(){ goToPlanDay(dateISO); });
      empty.appendChild(add);
      lines.appendChild(empty);
    }
    row.appendChild(lines);
    return row;
  }
  function dashPlanWeekSection(mondayISO){
    var wrap = el('section', 'dash-section dash-plan-week');
    wrap.setAttribute('data-label', 'This week’s plan');
    // .dash-section's eyebrow is a CSS ::before on attr(data-label) —
    // generated content, not a heading — so the region carries its own
    // accessible name rather than depending on it being announced.
    wrap.setAttribute('aria-label', 'This week’s plan');
    wrap.appendChild(el('p', 'dash-plan-week-sub', 'Every day this week, planned or not. Edit opens the Plan view on that day.'));
    var ul = el('ul', 'dash-plan-days');
    planWeekDates(mondayISO).forEach(function(dateISO){ ul.appendChild(dashPlanDay(dateISO)); });
    wrap.appendChild(ul);
    return wrap;
  }

  function renderDashboard(){
    var root = els.viewDash;
    clear(root);
    var h = el('h1', 'dash-eyebrow', 'Review');
    h.id = 'dash-h'; h.tabIndex = -1;
    root.appendChild(h);
    root.appendChild(renderSignalSubtabs(state.weekSignal, function(v){ state.weekSignal = v; renderDashboard(); }));
    // The Plan view has no bottom-nav tab of its own (same as Month), so
    // this link is the way in. Styled as dash-signal-link to match the
    // "See this month →" link the Month view is reached by.
    var planLink = document.createElement('button');
    planLink.type = 'button';
    planLink.className = 'dash-signal-link';
    planLink.textContent = 'Edit plan →';
    planLink.addEventListener('click', function(){ goToPlan(); });
    root.appendChild(planLink);
    var days = currentWeekDays();
    var weekLabel = 'Week ' + isoWeekNumber(mondayOf(new Date()));
    var adherenceLegendStageB = false;
    if(state.weekSignal === 'fuelling'){
      var fuelT = tallyDays(days, fuelCat);
      var fuelFacts = computeSignalFacts([{wk:'This week', days:days}], fuelCat);
      var fuelRule = resolveFuelInsight(fuelFacts);
      root.appendChild(dashSignalSection('Fuelling', fuelT, fuelCat, {severity: fuelRule.severity, headline: fuelRule.headline(fuelFacts)}, {
        nText: fuelT.total + ' over 45 min', bigDesc: 'at race concentration',
        goodLabel: 'race conc.', midLabel: 'lighter', badLabel: 'none', matrixSub: 'over 45 min only', signal: 'fuelling', weekLabel: weekLabel
      }, days));
    } else if(state.weekSignal === 'adherence'){
      // Stage B the moment this week has any plan row in it; otherwise the
      // Stage A path exactly as it shipped, so an athlete who has never opened
      // the Plan view sees no change at all.
      var useB = daysHavePlan(days);
      var planT = useB ? tallyPlanDays(days) : tallyDays(days, planCat);
      var planFacts = useB ? computePlanSignalFacts([{wk:'This week', days:days}])
                           : computeSignalFacts([{wk:'This week', days:days}], planCat);
      var planRule = resolveAdherenceInsight(planFacts);
      root.appendChild(dashSignalSection('Adherence', planT, planCat, {severity: planRule.severity, headline: planRule.headline(planFacts)}, {
        nText: useB ? (planT.total + ' of ' + (planT.total + planT.pending) + ' planned' + (planT.extra ? ' · ' + planT.extra + ' unplanned' : ''))
                    : (planT.total + ' session' + (planT.total === 1 ? '' : 's')),
        bigDesc: 'went as planned',
        goodLabel: 'as planned', midLabel: 'adjusted', badLabel: useB ? 'missed' : 'didn’t happen',
        matrixSub: useB ? 'planned vs logged' : 'by session',
        signal: 'adherence', weekLabel: weekLabel, cellFn: useB ? planDashCell : null
      }, days));
      adherenceLegendStageB = useB;
    } else {
      var driftT = tallyDays(days, driftCat);
      var driftFacts = computeSignalFacts([{wk:'This week', days:days}], driftCat);
      var driftRule = resolveDriftInsight(driftFacts);
      root.appendChild(dashSignalSection('Intensity drift', driftT, driftCat, {severity: driftRule.severity, headline: driftRule.headline(driftFacts)}, {
        nText: driftT.total + ' session' + (driftT.total === 1 ? '' : 's'), bigDesc: 'finished at intent',
        goodLabel: 'at intent', midLabel: 'slightly over', badLabel: 'well over', matrixSub: 'by session', signal: 'intensity', weekLabel: weekLabel
      }, days));
    }
    root.appendChild(dashLegend(state.weekSignal, adherenceLegendStageB));
    // Adherence subtab only, and This week only. Month's Adherence spans
    // several week blocks, where a 7-day listing per block is a different and
    // much larger layout problem — deliberately not attempted there.
    // Independent of the Stage A/B switch above: this is access to the week's
    // plan, not a reading of it, and is as useful on a week with no plan
    // entered (seven "Nothing planned" rows, each with an Add) as on one with.
    if(state.weekSignal === 'adherence'){
      root.appendChild(dashPlanWeekSection(weekKey(new Date())));
    }
  }

  // ═══════════════════════════════════════════════════════════════
  // RACE CALENDAR

  var RACE_STATUS_LABEL = {considering: 'Considering', locked: 'Locked in'};
  function addRace(fields){
    var race = {
      id: newRaceId(), name: fields.name.trim(), date: fields.date,
      url: (fields.url || '').trim(), notes: (fields.notes || '').trim(),
      status: fields.status === 'locked' ? 'locked' : 'considering'
    };
    races.push(race);

  function deleteRace(id){
    var race = races.filter(function(r){ return r.id === id; })[0];
    races = races.filter(function(r){ return r.id !== id; });

    submitRaceToSheet('delete', {id: id});

  function raceField(labelText, subText, inputEl){
    var wrap = el('div', 'race-field');
    var lbl = el('label', 'field-lbl');
    lbl.appendChild(document.createTextNode(labelText + ' '));
    if(subText){ lbl.appendChild(el('span', 'sub', subText)); }
    inputEl.id = inputEl.id || ('race-' + labelText.toLowerCase().replace(/[^a-z]+/g, '-'));
    lbl.htmlFor = inputEl.id;
    // Label and input are siblings, not nested, so the label's
    // margin-bottom creates real space above the input instead of relying
    // on a <br> (which most browsers don't apply vertical margin around).
    wrap.appendChild(lbl);

  function renderRaceForm(root, onCancel){

  // A native <details> disclosure — collapsed by default, so the list stays
  // scannable. The banner/meta/pill header (inside <summary>) is always
  // visible even collapsed, so "how far out is this race" never needs an
  // extra tap; only notes, the website, and remove are tucked behind the
  // expand. Banner + grey meta section echo the reference club-calendar
  // app's race card (coloured headline row, facts underneath), adapted to
  // this app's own tokens rather than its colours.
  function raceCard(race, isNext){
    var card = document.createElement('details');
    card.className = 'race-card' + (isNext ? ' is-next' : '');
    var summary = document.createElement('summary');

    var banner = el('div', 'race-card-banner');
    var bannerMain = el('div', 'race-card-banner-main');
    bannerMain.appendChild(el('span', 'race-card-headline', race.name));
    var statusCls = race.status === 'locked' ? 'locked' : 'considering';
    bannerMain.appendChild(el('span', 'race-status-pill ' + statusCls, RACE_STATUS_LABEL[statusCls]));
    banner.appendChild(bannerMain);
    var chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    chevron.setAttribute('class', 'race-card-chevron');
    chevron.setAttribute('viewBox', '0 0 24 24');
    chevron.setAttribute('fill', 'none');
    chevron.setAttribute('stroke', 'currentColor');
    chevron.setAttribute('stroke-width', '2');
    chevron.setAttribute('stroke-linecap', 'round');
    chevron.setAttribute('stroke-linejoin', 'round');
    chevron.setAttribute('aria-hidden', 'true');
    var chevronPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    chevronPath.setAttribute('d', 'M6 9l6 6 6-6');
    chevron.appendChild(chevronPath);
    banner.appendChild(chevron);
    summary.appendChild(banner);

    var meta = el('div', 'race-card-meta');
    meta.appendChild(el('span', 'race-card-date', formatRaceDateLabel(race.date)));
    var days = daysUntil(race.date);
    if(days >= 0){ meta.appendChild(el('span', 'race-card-countdown', raceCountdownLabel(days))); }
    summary.appendChild(meta);
    card.appendChild(summary);

    var body = el('div', 'race-card-body');
    if(race.notes){ body.appendChild(el('p', 'race-card-notes', race.notes)); }
    if(race.url){
      var website = el('div', 'race-card-website');
      website.appendChild(el('p', 'race-card-section-label', 'Race website'));
      var link = document.createElement('a');
      link.className = 'race-card-link';
      link.href = /^https?:\/\//i.test(race.url) ? race.url : 'https://' + race.url;
      link.target = '_blank'; link.rel = 'noopener noreferrer';
      link.textContent = race.url;
      website.appendChild(link);
      body.appendChild(website);

    var foot = el('div', 'race-card-foot');
    var del = el('button', 'race-card-delete', 'Remove');
    del.type = 'button';

    });
    foot.appendChild(del);
    body.appendChild(foot);
    card.appendChild(body);
    return card;
  }
  // Consecutive races sharing a month/year become one group — list is
  // already date-sorted (ascending for upcoming, descending for past), so
  // a same-key check against the previous race is enough, and groups come
  // out in the right order for either direction.
  function groupRacesByMonth(list){
    var groups = [];
    var lastKey = null;
    list.forEach(function(race){
      var d = new Date(race.date + 'T00:00:00');
      var key = d.getFullYear() + '-' + d.getMonth();
      if(key !== lastKey){
        groups.push({label: MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear(), races: []});
        lastKey = key;
      }
      groups[groups.length - 1].races.push(race);
    });
    return groups;
  }
  // Eyebrow + right-aligned count pill, echoing the Strength apps'
  // phase-card header (eyebrow + pill badge) rather than the plain
  // ::before label the rest of the app's .dash-section uses — races get
  // their own wrapper class so this doesn't bleed into This week/Month.
  function raceListSection(label, list, opts){
    var wrap = el('div', 'race-section');
    var hd = el('div', 'race-section-hd');
    hd.appendChild(el('span', 'race-section-eyebrow', label));
    if(list.length){
      hd.appendChild(el('span', 'race-section-count', list.length + (list.length === 1 ? ' race' : ' races')));
    }
    wrap.appendChild(hd);
    if(!list.length){
      wrap.appendChild(el('p', 'empty-note', opts.emptyText));
      return wrap;
    }
    var globalIndex = 0;
    groupRacesByMonth(list).forEach(function(group){
      wrap.appendChild(el('p', 'race-month-label', group.label));
      var ul = el('ul', 'race-list');
      ul.setAttribute('aria-label', label + ' — ' + group.label);
      group.races.forEach(function(race){
        var li = document.createElement('li');
        li.appendChild(raceCard(race, !!opts.markFirstAsNext && globalIndex === 0));
        ul.appendChild(li);
        globalIndex++;
      });
      wrap.appendChild(ul);
    });
    return wrap;
  }
  function raceHeroStat(cls, n, label){

  // The "Add a race" toggle lives inside the hero now (was its own

  // once it's open the form carries its own Add race / Cancel pair instead.

    h.appendChild(document.createTextNode('.'));
    wrap.appendChild(h);
    wrap.appendChild(el('p', 'race-hero-sub', 'Add a race and see how many weeks out it is. Synced to your training log Sheet, so it shows on every device.'));

    var consideringCount = races.length - lockedCount;

  // Whether the Add a race form is open — module state rather than derived
  // from the DOM, since renderRaces() fully rebuilds the view (including on
  // a background Sheet refresh) and a mid-fill-in form shouldn't silently
  // snap shut because of that.
  var raceFormOpen = false;
  function closeRaceForm(){
    raceFormOpen = false;
    renderRaces();
    var freshBtn = document.querySelector('.race-add-toggle');
    if(freshBtn){ freshBtn.focus(); }
  }
  function renderRaces(){
    var root = els.viewRaces;
    clear(root);
    root.appendChild(raceHero(function(){
      raceFormOpen = true;
      renderRaces();
      var nameInput = document.getElementById('race-name');
      if(nameInput){ nameInput.focus(); }
    }));

    var formWrap = el('div', 'race-form-wrap');

    root.appendChild(raceListSection('Upcoming', upcomingRaces(), {
      emptyText: 'No upcoming races yet — add one above.', markFirstAsNext: true
    }));
