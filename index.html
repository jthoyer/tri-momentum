<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRI Momentum — training log</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22TRI%20Momentum%22%2C%22short_name%22%3A%22TRI%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22theme_color%22%3A%22%23002DFF%22%2C%22background_color%22%3A%22%23F7F8FC%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: only light;
  --bg:#F7F8FC;--s1:#FFFFFF;--s3:#F0F2F8;--s4:#E8EBF5;
  --ink:#0E1020;--ink2:#4B5278;--ink3:#626B8C;
  --bd:rgba(14,16,32,0.08);--bd2:rgba(14,16,32,0.14);--bd3:rgba(14,16,32,0.25);
  --blue:#0022FF;--blue-l:#E8EFFE;--blue-m:#4F7BE8;
  --swim:#0022FF;--swim-l:#E8EFFE;
  --bike:#0F6E56;--bike-l:#E1F5EE;
  --run:#993C1D;--run-l:#FAECE7;
  --brick:#534AB7;--brick-l:#EEEDFE;
  --strength:#854F0B;--strength-l:#FAEEDA;
  --rest:#8B93B8;--rest-l:#F0F2F8;
  --phase-base:#0F6E56;--phase-base-l:#E1F5EE;
  --phase-build:#A64C09;--phase-build-l:#FFF1E0; /* darkened from #D9660B — original failed WCAG AA (3.23:1 on --phase-build-l); this clears 5.17:1 */
  --phase-peak:#993C1D;--phase-peak-l:#FAECE7;
  --done:#0F6E56;--done-l:#E1F5EE;
  --skipped:#993C1D;--skipped-l:#FAECE7;
  --modified:#854F0B;--modified-l:#FAEEDA;
  --dash-good:#0E9A5C;--dash-mid:#E0A100;--dash-bad:#C81E1E;
  /* The accent used on the app's dark hero panels — Warm up (#182542) and
     the shared .race-hero used by Races and Plan (--ink). Was a literal hex
     repeated in four Warm up rules; tokenised when the same yellow was
     adopted by .race-hero, so the two can't drift. Contrast measured per the
     standing rule (decisions 24/26): 9.41:1 on Warm up's navy, 11.67:1 on
     --ink — both clear 4.5:1 for the 11px eyebrows and 3:1 for the 23/25px
     headline accents. */
  --hero-accent:#F8C44F;
  --rmd:10px;--rlg:16px;--rxl:22px;--tabbar-h:84px;--tabbar-lift:0px;
  --fd:'Outfit',sans-serif;--fb:'Outfit',sans-serif;--fm:'Outfit',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:var(--fb);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh}
#app{max-width:430px;margin:0 auto;padding:0 1.25rem 3rem}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
a:focus,button:focus,input:focus,textarea:focus{outline:3px solid var(--blue);outline-offset:2px}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── Flow ── */
.flow{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;margin:0 -1.25rem}
.flow-hdr{position:sticky;top:0;z-index:2;flex:none;padding:1rem 1.25rem .8rem;background:var(--s1);border-bottom:0.5px solid var(--bd)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.eyebrow{font-family:var(--fm);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.counter{font-family:var(--fm);font-size:14px;color:var(--ink2);line-height:1.2;white-space:nowrap;flex:none}
.bar{height:4px;background:var(--s4);border-radius:2px;overflow:hidden}
.bar > i{display:block;height:100%;width:0;background:var(--blue);border-radius:2px;transition:width .2s ease}
.flow-phase-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.flow-phase-row[hidden]{display:none}
.flow-phase-change{padding:0;background:none;border:none;font-family:var(--fd);font-size:12px;font-weight:600;color:var(--blue);cursor:pointer}
.flow-body{flex:1;padding:1.5rem 1.25rem 6rem;min-height:0}
.q-set{border:none;padding:0;margin:0;display:block;min-width:0}
.q-set + .q-set{margin-top:5rem}
.q-set > legend{display:block;width:100%;padding:0;float:left}
h1{font-family:var(--fd);font-size:23px;font-weight:600;letter-spacing:-.3px;line-height:1.25;color:var(--ink)}
h1:focus,h1:focus-visible{outline:none}
.flow-body h2{font-family:var(--fd);font-size:23px;font-weight:600;letter-spacing:-.3px;line-height:1.25;color:var(--ink)}
.q-set h2:focus,.q-set h2:focus-visible{outline:none}
.hint{color:var(--ink2);font-size:14px;line-height:1.6;margin-top:10px;clear:both}
.choices-wrap{margin-top:2.5rem;clear:both}
.q-set .choices-wrap{margin-top:1.25rem}
.q-set.no-hint .choices-wrap{margin-top:2rem}
.choices{display:flex;flex-direction:column;gap:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:100%;height:100%;top:0;left:0;margin:0;cursor:pointer}
.choice{display:flex;align-items:center;gap:11px;min-height:56px;padding:12px 14px;background:var(--s1);border:1px solid var(--bd2);border-radius:var(--rmd);font-size:15px;color:var(--ink);line-height:1.35;cursor:pointer}
.opt input:checked + .choice{border-color:var(--blue);background:var(--blue-l);color:var(--blue);font-weight:600}
.opt input:focus-visible + .choice{outline:3px solid var(--blue);outline-offset:2px}
.choice .tick{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--bd3);display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.opt input:checked + .choice .tick{border-color:var(--blue);background:var(--blue);color:#fff}
.sev{flex-shrink:0;width:14px;height:14px;border-radius:3px;border:1px solid rgba(14,16,32,.25)}
.sev-strong{background:var(--done)}
.sev-solid{background:var(--blue-m)}
.sev-flat{background:var(--modified)}
.sev-rough{background:var(--run)}
.sev-1{background:var(--done-l);border-color:var(--done)}
.sev-2{background:#CFE8DE}
.sev-3{background:var(--modified)}
.sev-4{background:var(--run)}
.choices.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.choices.grid3 .choice{justify-content:center;min-height:56px;text-align:center}
.choices.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.choices.grid2 .choice{justify-content:center;min-height:56px;text-align:center}

.review-row{display:flex;width:100%;align-items:baseline;gap:12px;min-height:52px;padding:11px 13px;margin-bottom:8px;background:var(--s1);border:0.5px solid var(--bd2);border-radius:var(--rmd);text-align:left;cursor:pointer;font-family:var(--fb)}
.review-row:hover{background:var(--s3)}
.review-q{flex:1;font-size:14px;color:var(--ink2);line-height:1.45}
.review-a{flex:none;max-width:58%;font-size:14px;font-weight:600;color:var(--blue);text-align:right;line-height:1.45}
.review-a.none{color:var(--run);font-weight:500;font-style:italic}
label.note-lbl{display:block;font-family:var(--fd);font-size:15px;font-weight:600;margin:1.5rem 0 .5rem}
.note-lbl .sub{font-weight:400;font-size:14px;color:var(--ink2)}
textarea{width:100%;padding:12px 14px;border:1px solid var(--bd2);border-radius:var(--rmd);font-family:var(--fb);font-size:15px;color:var(--ink);background:var(--s1);resize:vertical;min-height:56px;line-height:1.5}
textarea::placeholder{color:var(--ink3)}

.saved-flag{display:flex;align-items:center;gap:8px;color:var(--done);font-size:14px;font-weight:600}
.saved-flag .g{font-size:15px}
.week-lead{color:var(--ink2);font-size:14px;line-height:1.6;margin-top:10px}
.week-list{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:1.25rem}
.week-row{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--s1);border:0.5px solid var(--bd2);border-radius:var(--rmd)}
.week-row.is-now{background:var(--blue-l);border:1px solid var(--blue)}
.week-day{font-family:var(--fm);font-size:14px;color:var(--ink3);width:36px;flex:none}
.week-row.is-now .week-day{color:var(--blue)}
.week-what{font-size:14px;color:var(--ink2);line-height:1.4}
.week-row.is-now .week-what{color:var(--ink);font-weight:600}
.week-state{margin-left:auto;font-size:14px;color:var(--ink3);white-space:nowrap;padding-left:6px}
.week-state.done{color:var(--done);font-weight:500}
.floor-card{background:var(--s1);border:0.5px solid var(--bd2);border-radius:var(--rlg);padding:1rem 1.05rem;margin-top:1.25rem}
.floor-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.floor-title{font-size:15px;font-weight:600;color:var(--ink)}
.floor-count{font-family:var(--fm);font-size:14px;color:var(--ink2);white-space:nowrap}
.floor-card .bar{margin-top:12px}
.floor-note{color:var(--ink2);font-size:14px;line-height:1.6;margin-top:12px}
.empty-note{color:var(--ink2);font-size:14px;line-height:1.6;margin-top:1.1rem;padding:1rem 1.05rem;background:var(--s1);border:0.5px dashed var(--bd2);border-radius:var(--rlg)}

.flow-foot{position:sticky;bottom:calc(var(--tabbar-h) + var(--tabbar-lift));z-index:2;flex:none;display:flex;gap:10px;padding:.75rem 1.25rem calc(.9rem + env(safe-area-inset-bottom));background:var(--s1);border-top:0.5px solid var(--bd)}
.btn{min-height:52px;padding:14px;border-radius:var(--rmd);font-family:var(--fd);font-size:17px;font-weight:600;letter-spacing:.01em;border:1px solid transparent;cursor:pointer}
.btn-primary{flex:1;background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-ghost{flex:none;padding:14px 18px;background:transparent;color:var(--ink);border-color:var(--bd2)}
.btn-primary:hover{background:#1246ad}
.btn-ghost:hover{background:var(--s3)}
.btn-ghost:disabled{color:var(--ink3);border-color:var(--bd);cursor:default}
.btn-ghost:disabled:hover{background:transparent}
/* Required, not incidental: .flow-foot sets display:flex, which beats the UA
   stylesheet's [hidden]{display:none}, so without this rule setting .hidden on
   the foot does nothing at all. Same reason every other [hidden] component in
   this file carries its own rule. */
.flow-foot[hidden]{display:none}
.flow-foot .btn{border-radius:999px}
.flow-foot .btn-primary{background:#002DFF;border-color:#002DFF}
.flow-foot .btn-primary:hover{background:#0022CC}
.flow-foot .btn-primary::after{content:"\2192";margin-left:8px;font-weight:600;display:inline-block}

/* ── Splash — shown on load until a nav tap dismisses it; no auto-advance ── */
.splash{min-height:100vh;min-height:100dvh;margin:0 -1.25rem;padding:2.5rem 1.25rem calc(2.5rem + var(--tabbar-h) + var(--tabbar-lift));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--blue)}
.splash[hidden]{display:none}
.splash-logo{width:192px;height:192px;border-radius:var(--rxl)}
.splash-headline{margin-top:12px;max-width:300px;font-family:var(--fd);font-size:23px;font-weight:600;letter-spacing:-.3px;line-height:1.25;color:#fff}
.splash-headline:focus,.splash-headline:focus-visible{outline:none}
/* width:100% (capped at 300px) on both cards, not shrink-to-fit — the splash
   is a centred column, so two content-sized cards stack at two different
   widths and read as a mistake. */
.splash-countdown{margin-top:56px;padding:14px 18px;width:100%;max-width:300px;box-sizing:border-box;border-radius:var(--rlg);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
.splash-countdown[hidden]{display:none}
/* .82 alpha, not .7/.75 — white at those alphas over the translucent card
   measures 3.97:1 and 4.35:1 against the card's own composited background,
   both under the 4.5:1 AA floor style-guide.md sets for normal text. .82
   measures 4.93:1. Applies to the new Today card's labels as well, so the
   two splash cards stay visually identical. */
.splash-countdown-eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.splash-countdown-race{margin-top:4px;font-family:var(--fd);font-size:15px;font-weight:600;color:#fff;line-height:1.35}
.splash-countdown-time{margin-top:2px;font-family:var(--fd);font-size:22px;font-weight:600;letter-spacing:-.3px;color:#fff}
.splash-countdown-time .u{font-size:14px;font-weight:500;color:rgba(255,255,255,.82)}

/* Splash "Today" card — sibling of the race countdown, same translucent-on-
   --blue treatment. Unlike the countdown (which stays in the DOM behind
   [hidden]), renderSplashToday() builds and removes this node outright, so
   "no plan anywhere in this week" leaves nothing behind at all. */
.splash-today{margin-top:14px;padding:14px 18px;width:100%;max-width:300px;box-sizing:border-box;border-radius:var(--rlg);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
.splash-countdown[hidden] + .splash-today{margin-top:56px}
.splash-today-eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.splash-today-list{list-style:none;margin:0;padding:0}
.splash-today-item + .splash-today-item{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22)}
.splash-today-btn{display:block;width:100%;min-height:44px;padding:2px 0;background:none;border:none;text-align:center;cursor:pointer;font:inherit}
/* The global focus ring is --blue, which is also the splash background — it
   would be invisible here. These are the only focusable controls on the
   splash, so they need a white ring (6.65:1 against the card) to satisfy
   WCAG 2.4.7 / 1.4.11. */
.splash-today-btn:focus,.splash-today-btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.splash-today-name{display:block;font-family:var(--fd);font-size:15px;font-weight:600;color:#fff;line-height:1.35;overflow-wrap:anywhere}
.splash-today-meta{display:block;margin-top:2px;font-family:var(--fd);font-size:13px;font-weight:500;color:rgba(255,255,255,.82);overflow-wrap:anywhere}
.splash-today-rest{margin-top:4px;font-family:var(--fd);font-size:15px;font-weight:600;color:#fff;line-height:1.35}
/* Already logged: a static record, not an offer. Rendered as a <div> so there
   is no cursor, no focus ring and nothing to activate — see splashTodayRow().
   No new colour token: rgba(255,255,255,.82) is the value the card's own
   eyebrow and meta line already use, measured at 4.93:1 against this card's
   composited background in decision 29. */
.splash-today-btn.is-logged{cursor:default}
.splash-today-btn.is-logged .splash-today-name{color:rgba(255,255,255,.82);font-weight:500}
.splash-today-logged{display:block;margin-top:4px;font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.82)}

/* "Earlier this week" — still-open sessions from earlier days in the current
   week, appended below Today inside the same card. Reuses .splash-today-list/
   -item/-btn/-name/-meta wholesale (same tap flow, same focus ring, same
   verified contrast) — only the date label above the name is new. */
.splash-prev{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22)}
.splash-prev-date{display:block;font-family:var(--fm);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.82);margin-bottom:2px}

/* Planned-session cards at the top of the check-in flow's first page. A
   shortcut into the same form — every value they set stays freely editable,
   and none of them is ever a1 (see CLAUDE.md decision 29). */
.flow-plan{margin-bottom:2.5rem}
.flow-plan-eyebrow{font-family:var(--fm);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.flow-plan-list{list-style:none;display:flex;flex-direction:column;gap:8px;margin:.6rem 0 0;padding:0}
.flow-plan-card{display:block;width:100%;min-height:44px;padding:12px 14px;text-align:left;background:var(--s1);border:1px solid var(--bd2);border-radius:var(--rmd);cursor:pointer;font:inherit;box-shadow:0 1px 2px rgba(14,16,32,.04),0 10px 24px -10px rgba(14,16,32,.16)}
.flow-plan-card:hover{border-color:var(--blue)}
.flow-plan-hd{display:flex;align-items:center;gap:10px}
.flow-plan-dot{flex:none;width:10px;height:10px;border-radius:3px;background:var(--rest)}
.flow-plan-title{flex:1;min-width:0;font-family:var(--fd);font-size:15px;font-weight:600;color:var(--ink);line-height:1.35;overflow-wrap:anywhere}
.flow-plan-key{flex:none;padding:3px 9px;border-radius:999px;background:var(--phase-peak-l);color:var(--phase-peak);font-family:var(--fd);font-size:11px;font-weight:600}
.flow-plan-meta{display:block;margin-top:4px;font-family:var(--fm);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.flow-plan-notes{display:block;margin-top:8px;font-family:var(--fb);font-size:13.5px;color:var(--ink2);line-height:1.5;overflow-wrap:anywhere}
.flow-plan-cta{display:block;margin-top:10px;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--blue)}
/* An already-logged planned session. Rendered as a static div rather than a
   disabled button (see flowPlanCard), so it deliberately has no hover, no
   pointer and no lift — it is a record, not an offer. Muted fill and no
   shadow keep it visibly behind the sessions still to log. */
.flow-plan-card.is-logged{background:var(--s3);border-color:var(--bd);box-shadow:none;cursor:default}
.flow-plan-card.is-logged .flow-plan-title{color:var(--ink2)}
.flow-plan-logged{display:block;margin-top:10px;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--done)}
/* Check-in landing (state.mode 'plan'). The cards are the same component as
   the in-flow hint list; on the landing they carry more weight (blue border,
   larger gap) because here they are the primary action rather than a shortcut
   sitting above the real question. */
.flow-landing-list{gap:12px;margin-top:1.4rem}
.flow-landing-list .flow-plan-card{padding:14px 16px}
/* :not(.is-logged) on both — an already-logged session must not pick up the
   landing list's primary-action emphasis or its hover, or it would read as
   just as tappable as the ones still to log, which is the whole defect. */
.flow-landing-list .flow-plan-card:not(.is-logged){border-color:var(--blue-m)}
.flow-landing-list .flow-plan-card:not(.is-logged):hover{border-color:var(--blue);background:var(--blue-l)}
/* Secondary by construction: a full-width text button with no fill, well
   clear of the cards, so "log something else" never competes with the
   planned session it sits under. */
.flow-landing-other{display:block;width:100%;min-height:44px;margin-top:2rem;padding:12px 14px;background:none;border:none;font-family:var(--fd);font-size:14px;font-weight:600;color:var(--blue);cursor:pointer;text-align:center}
.flow-landing-other:hover{color:var(--blue-m);text-decoration:underline}

/* ── One-time training phase screen ── */
.period{min-height:100vh;min-height:100dvh;margin:0 -1.25rem;padding:2.5rem 1.25rem calc(2.5rem + var(--tabbar-h) + var(--tabbar-lift));display:flex;flex-direction:column;justify-content:center}
.period[hidden]{display:none}

/* ── Bottom tabs ── */
.view-tabs[hidden]{display:none}
.view-tabs{position:fixed;left:0;right:0;bottom:var(--tabbar-lift);z-index:5;display:flex;gap:0;max-width:430px;margin:0 auto;padding:0;background:#002DFF;border-top:none;border-radius:0}
.view-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--tabbar-h);padding:10px 4px calc(10px + env(safe-area-inset-bottom));background:none;border:none;border-radius:0;font-family:var(--fd);font-size:11.5px;font-weight:600;color:rgba(255,255,255,.6);cursor:pointer}
.view-tab svg{flex:none}
.view-tab[aria-selected="true"]{color:#37C6FC;background:rgba(255,255,255,.16)}

/* ── Dashboard ── */
.dash{padding-top:1.5rem;padding-bottom:calc(var(--tabbar-h) + var(--tabbar-lift))}
.strength-frame{width:100%;border:0;display:block;background:transparent}
.dash-eyebrow{font-family:var(--fm);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.dash-section{margin-top:2.3rem;padding-top:1.1rem;border-top:1px solid var(--bd)}
.dash-eyebrow + .dash-section{margin-top:1.1rem;padding-top:0;border-top:none}
.dash-section::before{content:attr(data-label);display:block;font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:.9rem}
.dash-signal-link{display:block;margin-top:14px;padding:0;background:none;border:none;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--blue);cursor:pointer}
.dash-signal-link:hover{color:var(--blue-m)}
/* "This week's plan" — the read-only 7-day plan listing under the Adherence
   subtab. Own dash-plan-* namespace rather than reusing .plan-day/.plan-item:
   those belong to the Plan view's editable rows, and one selector serving an
   editable card and a read-only line item is how the two silently drift. */
.dash-plan-week-sub{margin:-.35rem 0 .2rem;font-size:13px;color:var(--ink2);line-height:1.5}
.dash-plan-days{list-style:none}
/* Compact row: fixed-width date column on the left, stacked session lines
   filling the rest. align-items:flex-start keeps the date pinned to the top
   line of a multi-session day rather than centring against the stack. */
.dash-plan-day{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.dash-plan-days > li:first-child{border-top:none}
/* Fixed width so all seven date labels form a straight column. padding-top
   optically aligns the smaller uppercase label with the first session line. */
.dash-plan-date{flex:none;width:52px;padding-top:13px;font-family:var(--fm);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.dash-plan-day.is-today .dash-plan-date{color:var(--blue);font-weight:600}
.dash-plan-lines{flex:1;min-width:0;list-style:none}
.dash-plan-line{display:flex;align-items:center;gap:8px;min-height:44px}
.dash-plan-dot{flex:none;width:8px;height:8px;border-radius:2px;background:var(--rest)}
/* min-width:0 + the wrap rules let a long title wrap instead of pushing the
   Edit button off the right edge at 320px. */
.dash-plan-line-text{flex:1;min-width:0;font-size:13.5px;line-height:1.4;color:var(--ink);overflow-wrap:anywhere}
.dash-plan-empty{flex:1;min-width:0;font-size:13.5px;color:var(--ink3)}
/* Text button, matching .dash-signal-link's weight/size rather than a boxed
   control — this section is a lower-emphasis addition under the signal panel,
   not a second hero. min-height carries the 44px target the row height gives. */
.dash-plan-edit{flex:none;min-width:44px;min-height:44px;padding:0 2px;background:none;border:none;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--blue);text-align:right;cursor:pointer}
.dash-plan-edit:hover{color:var(--blue-m)}
.dash-insight-strip{margin-top:.6rem;padding:.85rem 1rem;border-left:3px solid transparent;border-radius:0 10px 10px 0}
.dash-insight-strip:first-child{margin-top:0}
.dash-insight-strip-label{font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:.4rem}
.dash-insight-strip-headline{font-size:15.5px;font-weight:600;line-height:1.5;color:var(--ink)}
.dash-insight-strip + .dash-stat-hd{margin-top:1.1rem}
.signal-subtabs{display:flex;gap:4px;padding:3px;background:var(--s3);border-radius:999px;margin-top:1.4rem;margin-bottom:1.5rem}
.signal-subtab{flex:1;min-height:38px;padding:8px 4px;border:none;border-radius:999px;background:none;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.signal-subtab[aria-selected="true"]{background:var(--blue);color:#fff}
.month-week-block{margin-top:1.4rem;padding:1rem 1.05rem 1.2rem;background:var(--s1);border:0.5px solid var(--bd2);border-radius:var(--rlg)}
.month-week-block:first-child{margin-top:0}
.month-week-block .dash-matrix-hd{margin-top:.9rem}
.month-week-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.month-week-label{font-family:var(--fm);font-size:23px;font-weight:600;color:var(--ink2)}
.month-week-pill{font-family:var(--fd);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--s3);color:var(--ink2)}
.month-week-pill.phase-base{background:var(--phase-base);color:var(--phase-base-l)}
.month-week-pill.phase-build{background:var(--phase-build);color:var(--phase-build-l)}
.month-week-pill.phase-peak{background:var(--phase-peak);color:var(--phase-peak-l)}
.month-week-current{font-family:var(--fd);font-size:11.5px;font-weight:600;color:var(--blue);background:var(--blue-l);padding:3px 10px;border-radius:999px}
.dash-stat-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dash-stat-n{font-family:var(--fm);font-size:11.5px;color:var(--ink3);white-space:nowrap}
.dash-stat-big{display:flex;align-items:baseline;gap:9px;margin-top:10px}
.dash-stat-pct{font-family:var(--fd);font-size:32px;font-weight:600;letter-spacing:-.8px;color:var(--ink)}
.dash-stat-pct .u{font-size:18px;color:var(--ink2);font-weight:500}
.dash-stat-desc{font-size:13px;color:var(--ink2)}
.tri-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--s4);margin-top:9px}
.tri-bar span{display:block;height:100%}
.dash-counts{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--fm);font-size:12px;color:var(--ink2);margin-top:8px}
.dash-counts b{font-weight:600}
.dash-matrix-hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:1.6rem}
.dash-matrix-week{font-family:var(--fm);font-size:23px;font-weight:600;color:var(--ink2);white-space:nowrap}
.dash-matrix-rule{flex:1;height:1px;background:var(--bd)}
.dash-matrix-sub{font-family:var(--fm);font-size:11.5px;color:var(--ink3)}
.dash-grid{display:grid;grid-template-columns:52px repeat(7,1fr);gap:5px;margin-top:.7rem;align-items:center}
.dash-grid-day{font-family:var(--fm);font-size:10.5px;color:var(--ink3);text-align:center}
.dash-grid-disc{font-size:12.5px;color:var(--ink2)}
.dash-cell{height:16px;border-radius:4px;background:var(--s4);box-sizing:border-box;display:flex;gap:2px;overflow:hidden}
.dash-cell-seg{flex:1;border-radius:3px}
.dash-cell-seg.na{background:transparent;border:1px solid var(--bd2)}
.dash-cell-seg.good{background:var(--dash-good)}
.dash-cell-seg.mid{background:var(--dash-mid)}
.dash-cell-seg.bad{background:var(--dash-bad)}
/* ── Adherence Stage B only (objective, plan-anchored) ──
   Three states the grid never had to draw before, because every earlier signal
   started from a logged session. All three are non-text UI components, so each
   carries a solid 3:1-clearing edge or fill against BOTH --s1 (#FFFFFF, the card)
   and --s4 (#E8EBF5, the empty cell) per style-guide.md's Accessibility rule.
   Measured: --dash-bad #C81E1E = 5.74:1 on --s1, 4.82:1 on --s4.
             --ink3    #626B8C = 5.25:1 on --s1, 4.41:1 on --s4.
   No new token was needed: both are existing tokens whose semantics already
   fit (bad-severity red, neutral-informational grey), so there is nothing new
   to mirror into the design guide's own hardcoded palette copy.
   KNOWN, PRE-EXISTING, NOT INTRODUCED HERE: --dash-mid #E0A100 measures
   2.27:1 on --s1 and 1.90:1 on --s4, i.e. the existing `mid` segment has
   never cleared 3:1 on any signal. Same class of defect as decisions 24 and
   26. Left unchanged deliberately — darkening it is an app-wide token change
   affecting every grid, stat bar and insight strip, and belongs in its own
   pass, not smuggled into this one. See CLAUDE.md decision 30.
   The hatch fill is decorative — it reads as "absence" rather than a filled
   outcome — and deliberately carries none of the contrast burden itself. */
.dash-cell-seg.missed{background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--dash-bad) 42%, transparent) 0 2px, transparent 2px 5px);box-shadow:inset 0 0 0 1.5px var(--dash-bad)}
.dash-cell-seg.planned{background:transparent;box-shadow:inset 0 0 0 1px var(--ink3)}
/* An unplanned session is neutral, never a failure — grey, not red. */
.dash-cell-seg.extra{background:var(--ink3)}
.dash-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:1.6rem;padding-top:1rem;border-top:0.5px solid var(--bd)}
.dash-legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2)}
.dash-legend-sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none;box-sizing:border-box}
.dash-phase-change{display:block;margin-top:.6rem;margin-bottom:1rem;padding:0;background:none;border:none;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--blue);cursor:pointer}

/* ── Race calendar ── */
/* Hero banner echoing the reference club-calendar app's dark "Find your
   next start line" header — same dark-card/headline/stat-line shape, but
   with no club logo and recoloured to this app's own tokens (--ink for the
   dark fill rather than a literal navy, --blue-m for the accent rather than
   the reference's orange), and the stat line swapped for this app's own
   commitment counts (locked in / considering) instead of "club events". */
.race-hero{margin-top:0;padding:1.5rem 1.3rem 1.6rem;background:var(--ink);border-radius:var(--rlg);color:#fff}
/* .race-hero is shared: raceHero() and planHero() both build one, so the
   eyebrow/accent colour here lands on the Races view and the Plan view
   together. The stat colours below are deliberately NOT part of this
   treatment — they encode commitment status (green locked in, tangerine
   considering), so flattening them to the accent would delete information. */
.race-hero-eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--hero-accent)}
.race-hero-headline{margin-top:.6rem;font-family:var(--fd);font-size:23px;font-weight:600;line-height:1.3;color:#fff}
.race-hero-headline .accent{color:var(--hero-accent)}
.race-hero-sub{margin-top:.7rem;font-size:14px;line-height:1.55;color:rgba(255,255,255,.68)}
.race-hero-stats{display:flex;flex-wrap:wrap;gap:20px;margin-top:1.3rem;padding-top:1.1rem;border-top:1px solid rgba(255,255,255,.14)}
.race-hero-stat{font-family:var(--fd);font-size:13.5px;color:rgba(255,255,255,.68)}
.race-hero-stat b{font-size:18px;font-weight:600;margin-right:5px}
.race-hero-stat.locked b{color:var(--done-l)}
.race-hero-stat.considering b{color:var(--phase-build-l)}
/* Plan reuses the race hero, but not its commitment semantics — planned
   takes the brand blue (the plan), logged takes the done green. */
.race-hero-stat.planned b{color:var(--blue-m)}
.race-hero-stat.logged b{color:var(--done-l)}
.text-input{width:100%;min-height:52px;padding:12px 14px;border:1px solid var(--bd2);border-radius:var(--rmd);font-family:var(--fb);font-size:15px;color:var(--ink);background:var(--s1)}
.text-input::placeholder{color:var(--ink3)}
.race-add-toggle{width:100%;min-height:52px;margin-top:1.3rem;padding:14px;border-radius:999px;border:1px solid transparent;background:var(--blue);color:#fff;font-family:var(--fd);font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.race-add-toggle:hover{background:#1246ad}
.race-form-wrap[hidden]{display:none}
.race-form{margin-top:1.1rem;padding:1rem 1.05rem 1.1rem;background:var(--s1);border:0.5px solid var(--bd2);border-radius:var(--rlg);display:flex;flex-direction:column;gap:14px}
.race-field .field-lbl{display:block;font-family:var(--fd);font-size:13.5px;font-weight:600;margin-bottom:12px}
.race-field .sub{font-weight:400;font-size:12.5px;color:var(--ink2)}
.race-field textarea{min-height:48px}
.race-form-actions{display:flex;gap:10px;margin-top:2px}
.race-form-actions .btn{border-radius:999px}
.race-section{margin-top:2.3rem;padding-top:1.1rem;border-top:1px solid var(--bd)}
.race-section-hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.race-section-eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.race-section-count{flex:none;padding:3px 10px;border-radius:999px;background:var(--s3);color:var(--ink2);font-family:var(--fd);font-size:12.5px;font-weight:600}
.race-month-label{margin-top:1.3rem;font-family:var(--fm);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.race-list{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:.7rem}
/* Soft two-layer shadow instead of a flat border — same "lifted card"
   treatment as the Strength apps' exercise rows, recoloured from their ink
   (24,37,66) to ours (14,16,32) rather than reusing their palette. */
/* Banner headline + grey date/countdown section — echoes the reference
   club-calendar app's race card (a coloured header row, facts underneath),
   adapted to this app's own tokens rather than its colours. */
.race-card{background:var(--s1);border-radius:var(--rlg);box-shadow:0 1px 2px rgba(14,16,32,.04),0 10px 24px -10px rgba(14,16,32,.16);transition:box-shadow .2s ease;overflow:hidden}
.race-card.is-next{box-shadow:0 0 0 1.5px var(--blue),0 10px 24px -10px rgba(0,34,255,.22)}
.race-card summary{cursor:pointer;list-style:none;display:block}
.race-card summary::-webkit-details-marker{display:none}
.race-card summary::marker{display:none}
.race-card-banner{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 14px;background:var(--bd2)}
.race-card-banner-main{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px}
.race-card-headline{font-family:var(--fd);font-size:17px;font-weight:600;line-height:1.32;color:var(--ink)}
.race-card-chevron{flex:none;width:18px;height:18px;margin-top:1px;color:var(--ink);transition:transform .15s ease}
.race-card[open] .race-card-chevron{transform:rotate(180deg)}
.race-card-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--s3)}
.race-card-date{font-family:var(--fm);font-size:12.5px;color:var(--ink2)}
.race-card-countdown{font-family:var(--fm);font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.race-status-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-family:var(--fd);font-size:11.5px;font-weight:600}
.race-status-pill.locked{background:var(--done);color:var(--done-l)}
.race-status-pill.considering{background:var(--phase-build);color:var(--phase-build-l)}
.race-card-body{padding:12px 16px 16px}
.race-card-notes{font-size:13.5px;color:var(--ink2);line-height:1.5}
.race-card-section-label{margin-top:16px;font-family:var(--fm);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.race-card-website{margin-top:6px}
.race-card-foot{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:16px}
.race-card-link{font-family:var(--fd);font-size:14px;font-weight:600;color:var(--blue);text-decoration:none;word-break:break-word}
.race-card-link:hover{color:var(--blue-m)}
.race-card-delete{margin-left:auto;padding:0;background:none;border:none;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer}
.race-card-delete:hover{color:var(--run)}
/* ── Training plan ───────────────────────────────────────────────────
   The athlete's own planned sessions, transcribed by hand. Deliberately
   reuses the Races component language rather than inventing a second one:
   the same hero, the same label/input field pairs, the same lifted-card
   shadow and native <details> disclosure. See decision 28 in CLAUDE.md. */
/* The chip groups are real <fieldset>/<legend> pairs so the group has a
   programmatic label, not just its first radio. Fieldsets carry a default
   border the global reset doesn't clear, and an intrinsic min-width that
   breaks them inside a flex column — both neutralised here. */
fieldset.plan-field{border:0;min-width:0}
.plan-field .field-lbl{display:block;font-family:var(--fd);font-size:13.5px;font-weight:600;margin-bottom:12px}
.plan-field .sub{font-weight:400;font-size:12.5px;color:var(--ink2)}
.plan-field textarea{min-height:48px}
.plan-week-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:1.6rem;padding:10px 12px;background:var(--s3);border-radius:var(--rmd)}
.plan-week-nav-label{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;flex:1}
.plan-week-num{font-family:var(--fd);font-size:15px;font-weight:600;color:var(--ink)}
.plan-week-btn{flex:none;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd2);border-radius:var(--rmd);background:var(--s1);color:var(--ink);font-family:var(--fd);font-size:17px;font-weight:600;cursor:pointer}
.plan-week-btn:hover{background:var(--s4)}
.plan-day{margin-top:1.1rem;padding-top:1rem;border-top:1px solid var(--bd)}
.plan-day-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.plan-day-name{font-family:var(--fd);font-size:14px;font-weight:600;color:var(--ink)}
.plan-day.is-today .plan-day-name{color:var(--blue)}
.plan-day-date{font-family:var(--fm);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.plan-item-list{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:.7rem}
.plan-item{background:var(--s1);border-radius:var(--rmd);box-shadow:0 1px 2px rgba(14,16,32,.04),0 10px 24px -10px rgba(14,16,32,.16);overflow:hidden}
.plan-item summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:44px}
.plan-item summary::-webkit-details-marker{display:none}
.plan-item summary::marker{content:''}
.plan-item-dot{flex:none;width:10px;height:10px;border-radius:3px;background:var(--rest)}
.plan-item-main{flex:1;min-width:0}
.plan-item-title{display:block;font-family:var(--fd);font-size:15px;font-weight:600;color:var(--ink);line-height:1.35}
.plan-item-meta{display:block;margin-top:2px;font-family:var(--fm);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.plan-item-key{flex:none;padding:3px 9px;border-radius:999px;background:var(--phase-peak-l);color:var(--phase-peak);font-family:var(--fd);font-size:11px;font-weight:600}
.plan-item-chevron{flex:none;width:16px;height:16px;color:var(--ink3);transition:transform .15s ease}
.plan-item[open] .plan-item-chevron{transform:rotate(180deg)}
/* --dash-bad on white is 5.74:1 — clears the 4.5:1 AA bar for body text. */
.plan-form-error{padding:10px 12px;border-radius:var(--rmd);background:var(--skipped-l);color:var(--dash-bad);font-size:13.5px;font-weight:500;line-height:1.5}
.plan-form-error[hidden]{display:none}
/* Same node as the form's error surface, but rendered by the day row after
   the form it belonged to has been closed — so it needs its own spacing. */
.plan-day-notice{margin:10px 0 0}
.plan-item-body{padding:0 14px 14px}
.plan-item-notes{font-size:13.5px;color:var(--ink2);line-height:1.5}
/* space-between, not flex-end: the safe action (Edit) and the destructive one
   (Remove) sit at opposite ends rather than adjacent, so a mis-tap on a phone
   doesn't delete a session the athlete meant to edit. */
.plan-item-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.plan-item-edit{min-height:44px;padding:0;background:none;border:none;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--blue);cursor:pointer}
.plan-item-edit:hover{color:var(--blue-m)}
.plan-item-delete{min-height:44px;padding:0;background:none;border:none;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer}
.plan-item-delete:hover{color:var(--run)}
/* Dashed border in --blue-m, not --bd3: --bd3 over --bg only reaches
   1.73:1, under the 3:1 non-text-contrast rule in style-guide.md's
   Accessibility section. --blue-m clears it at 3.71:1 and ties the outline
   to the blue label inside it. */
.plan-day-add{margin-top:.7rem;width:100%;min-height:44px;padding:10px 14px;border:1px dashed var(--blue-m);border-radius:var(--rmd);background:none;color:var(--blue);font-family:var(--fd);font-size:14px;font-weight:600;cursor:pointer}
.plan-day-add:hover{background:var(--blue-l)}
.plan-form-wrap[hidden]{display:none}
.plan-form{margin-top:.8rem;padding:1rem 1.05rem 1.1rem;background:var(--s1);border:0.5px solid var(--bd2);border-radius:var(--rlg);display:flex;flex-direction:column;gap:14px}
.plan-form-actions{display:flex;gap:10px;margin-top:2px}
.plan-form-actions .btn{border-radius:999px}
.plan-tools{margin-top:2.3rem;padding-top:1.1rem;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.plan-copy summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;font-family:var(--fd);font-size:14px;font-weight:600;color:var(--blue)}
.plan-copy summary::-webkit-details-marker{display:none}
.plan-copy summary::marker{content:''}
.plan-copy-list{list-style:none;display:flex;flex-direction:column;gap:2px;margin-top:.5rem}
.plan-copy-opt{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:var(--ink2)}
.plan-copy-opt input{flex:none;width:20px;height:20px;accent-color:var(--blue)}
.plan-clear{align-self:flex-start;min-height:44px;padding:0;background:none;border:none;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer}
.plan-clear:hover{color:var(--run)}

/* ── Warm up ── */
.warmup-hero{margin-top:1.4rem;padding:1.5rem 1.3rem 1.4rem;border-radius:var(--rxl);background:#182542;color:#fff}
.warmup-hero-eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-accent)}
.warmup-hero h2{margin-top:9px;font-family:var(--fd);font-size:25px;font-weight:600;line-height:1.22;letter-spacing:-.3px;color:#fff}
.warmup-hero h2 em{color:var(--hero-accent);font-style:normal}
.warmup-hero-desc{margin-top:11px;font-size:14px;line-height:1.6;color:#EDF0F7}
.warmup-hero-meta{display:grid;gap:11px;margin-top:18px;padding:13px 15px;border-radius:var(--rmd);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.warmup-hero-meta-item{display:grid;gap:2px;font-size:13px;color:#EDF0F7}
.warmup-hero-meta-label{display:block;font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.warmup-hero-progress{margin-top:18px}
.warmup-hero-progress-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-family:var(--fd);font-size:13.5px;font-weight:600;color:#fff}
.warmup-hero-progress-pct{color:var(--hero-accent)}
.warmup-hero-bar{margin-top:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden}
.warmup-hero-bar-fill{height:100%;width:0%;border-radius:999px;background:var(--hero-accent);transition:width .2s ease}
.warmup-hero-sessions{margin-top:10px;font-size:12.5px;color:rgba(255,255,255,.7)}
.warmup-completion-banner{margin-top:1.4rem;padding:20px 22px;border-radius:var(--rmd);background:var(--done-l);border:1px solid rgba(15,110,86,.25);text-align:center}
.warmup-completion-title{font-family:var(--fd);font-size:19px;font-weight:600;color:var(--done)}
.warmup-completion-sub{margin-top:6px;font-size:13.5px;color:var(--ink)}
.warmup-completion-btn{margin-top:14px;min-height:48px;padding:12px 26px;border-radius:999px;border:1px solid transparent;background:var(--blue);color:#fff;font-family:var(--fd);font-size:15px;font-weight:600;cursor:pointer}
.warmup-completion-btn:hover{background:#001DD9}
.warmup-video-link{display:inline-flex;align-items:center;gap:6px;margin-top:1.1rem;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--blue);text-decoration:none}
.warmup-video-link:hover{color:var(--blue-m)}
.warmup-list{display:flex;flex-direction:column;gap:26px;margin-top:1.4rem}
.warmup-row{display:flex;gap:14px;padding:24px 22px;background:var(--s1);border-radius:var(--rlg);box-shadow:0 1px 2px rgba(14,16,32,.04),0 10px 24px -10px rgba(14,16,32,.16);transition:background .2s ease,box-shadow .2s ease}
.warmup-row.active{box-shadow:0 0 0 2px rgba(0,34,255,.35),0 10px 24px -10px rgba(14,16,32,.16)}
.warmup-row.checked{background:var(--done-l);box-shadow:0 1px 2px rgba(15,110,86,.05),0 10px 24px -10px rgba(15,110,86,.18)}
.warmup-check{flex:none;width:30px;height:30px;margin-top:1px;border-radius:999px;border:1.5px solid var(--bd3);background:var(--s1);color:transparent;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.warmup-check:hover{border-color:var(--done)}
.warmup-check.checked{border-color:var(--done);background:var(--done);color:#fff}
.warmup-body{min-width:0;flex:1}
.warmup-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:5px 12px}
.warmup-name{font-family:var(--fd);font-size:15px;font-weight:600;color:var(--ink);line-height:1.35}
.warmup-row.checked .warmup-name{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink3)}
.warmup-dose{flex:none;font-family:var(--fm);font-size:11.5px;font-weight:500;color:var(--blue);white-space:nowrap}
.warmup-cue{margin-top:8px;font-size:13.5px;color:var(--ink2);line-height:1.55}
.warmup-ts{display:inline-flex;align-items:center;gap:4px;margin-top:14px;font-family:var(--fm);font-size:11.5px;font-weight:500;color:var(--ink3);text-decoration:none}
.warmup-ts:hover{color:var(--blue)}
.warmup-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.warmup-reset{flex:none;padding:0;background:none;border:none;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--blue);cursor:pointer}

.date-input{width:200px;max-width:100%;min-height:56px;padding:12px 14px;border:1px solid var(--bd2);border-radius:var(--rmd);font-family:var(--fb);font-size:16px;color:var(--ink);background:var(--s1)}

@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;scroll-behavior:auto!important} }
@media (prefers-reduced-motion: no-preference){ .btn,.choice,.opt input:checked + .choice{transition:background .15s, border-color .15s, color .15s} }
</style>

<body>
<div id="app">

  <!-- ══════════ SPLASH — dismissed by tapping any nav tab, never auto-advances ══════════ -->
  <section class="splash" id="view-splash" aria-labelledby="splash-h">
    <img class="splash-logo" src="favicon.png" alt="TRI Momentum" width="192" height="192">
    <h1 class="splash-headline" id="splash-h" tabindex="-1">Helping you prepare for your next race</h1>
    <div class="splash-countdown" id="splash-countdown" hidden>
      <p class="splash-countdown-eyebrow">Next race</p>

      <p class="splash-countdown-time" id="splash-countdown-time"></p>
    </div>
  </section>

  <!-- ══════════ TRAINING PHASE — asked once, ever ══════════ -->
  <section class="period" id="view-period" hidden aria-labelledby="period-h">
    <p class="eyebrow">TRI Momentum</p>
    <h1 id="period-h" tabindex="-1">What phase is this training block?</h1>
    <p class="hint">Sets the context This week and Month review your sessions against. Change it any time from the dashboard.</p>
    <div class="choices-wrap">
      <div class="choices grid2" id="period-choices"></div>
    </div>
  </section>

  <!-- ══════════ VIEW TABS ══════════ -->
  <div class="view-tabs" id="view-tabs" role="tablist" aria-label="Sections">
    <button type="button" class="view-tab" id="tab-warmup" role="tab" aria-selected="false" aria-controls="view-warmup">

      <span>Warm up</span>
    </button>
    <button type="button" class="view-tab" id="tab-strength" role="tab" aria-selected="false" aria-controls="view-strength">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 7v10"></path><path d="M4 9v6"></path><path d="M17.5 7v10"></path><path d="M20 9v6"></path><path d="M6.5 12h11"></path></svg>
      <span>Strength</span>
    </button>
    <button type="button" class="view-tab" id="tab-flow" role="tab" aria-selected="true" aria-controls="view-flow">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12.75 9C12.75 8.58579 12.4142 8.25 12 8.25C11.5858 8.25 11.25 8.58579 11.25 9L11.25 11.25H9C8.58579 11.25 8.25 11.5858 8.25 12C8.25 12.4142 8.58579 12.75 9 12.75H11.25V15C11.25 15.4142 11.5858 15.75 12 15.75C12.4142 15.75 12.75 15.4142 12.75 15L12.75 12.75H15C15.4142 12.75 15.75 12.4142 15.75 12C15.75 11.5858 15.4142 11.25 15 11.25H12.75V9Z" fill="currentColor"></path><path fill-rule="evenodd" clip-rule="evenodd" d="M12 1.25C6.06294 1.25 1.25 6.06294 1.25 12C1.25 17.9371 6.06294 22.75 12 22.75C17.9371 22.75 22.75 17.9371 22.75 12C22.75 6.06294 17.9371 1.25 12 1.25ZM2.75 12C2.75 6.89137 6.89137 2.75 12 2.75C17.1086 2.75 21.25 6.89137 21.25 12C21.25 17.1086 17.1086 21.25 12 21.25C6.89137 21.25 2.75 17.1086 2.75 12Z" fill="currentColor"></path></svg>
      <span>Check-in</span>
    </button>
    <button type="button" class="view-tab" id="tab-dash" role="tab" aria-selected="false" aria-controls="view-dashboard">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>

      <span>Races</span>

  </div>

  <div id="app-main" hidden>

  <div id="view-flow">

  <!-- ══════════ THE STEPPED FLOW ══════════ -->
  <section class="flow" aria-label="After-session check-in">
    <div class="flow-hdr">
      <div class="hdr-row">
        <p class="eyebrow" id="eyebrow">Just finished</p>
        <p class="counter" id="counter">1 / 9</p>
      </div>
      <div class="bar" aria-hidden="true"><i id="bar-fill"></i></div>
      <div class="flow-phase-row" id="flow-phase-row">

  </section>

  </div>

  <!-- ══════════ WEEKLY DASHBOARD ══════════ -->
  <div class="dash" id="view-dashboard" role="tabpanel" aria-labelledby="tab-dash" hidden></div>

  <!-- ══════════ MONTH ══════════ -->
  <!-- No longer on the bottom nav (replaced by Warm up, below) — still reachable
       via the "See this month →" links in the This week dashboard's signal sections. -->
  <div class="dash" id="view-trends" role="tabpanel" aria-labelledby="tab-dash" hidden></div>

  <!-- ══════════ WARM UP ══════════ -->
  <div class="dash" id="view-warmup" role="tabpanel" aria-labelledby="tab-warmup" hidden></div>

  <!-- ══════════ STRENGTH ══════════ -->
  <div class="dash" id="view-strength" role="tabpanel" aria-labelledby="tab-strength" hidden>
    <h1 class="dash-eyebrow" id="strength-h" tabindex="-1">Strength</h1>
    <div class="signal-subtabs" id="strength-subtabs" role="tablist" aria-label="Strength discipline">
      <button type="button" class="signal-subtab" id="tab-strength-swim" role="tab" aria-selected="true">Swim</button>
      <button type="button" class="signal-subtab" id="tab-strength-run" role="tab" aria-selected="false">Ride / Run</button>
    </div>
    <iframe class="strength-frame" id="strength-frame" src="TRI-swim-strength mobile app/index.html" title="Swim strength session" loading="lazy"></iframe>
  </div>

  <!-- ══════════ RACE CALENDAR ══════════ -->
  <div class="dash" id="view-races" role="tabpanel" aria-labelledby="tab-races" hidden></div>

  <!-- Training plan — a full view with no bottom-nav tab of its own,
       reached from the "Edit plan →" link in This week. Same treatment as
       the Month view (#view-trends): the nav is a fixed five buttons, and a
       plan editor visited once a week doesn't earn permanent nav space.
       role="region" rather than "tabpanel" precisely because no tab owns
       it — it's labelled by its own heading instead. -->
  <div class="dash" id="view-plan" role="region" aria-labelledby="plan-h" hidden></div>

  </div>
  <!-- /#app-main -->

</div>

<script>
"use strict";

// An earlier build registered a cache-first service worker that precaches
// index.html forever, so returning visitors never see a new deploy. This
// app ships no service worker — tear down any leftover registration/cache
// from that build so published updates actually reach people who've
// visited before.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(reg){ reg.unregister(); });
  });
}
if(window.caches && caches.keys){
  caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); });
}

(function(){

  // ═══════════════════════════════════════════════════════════════

    {
      k:'b3', layout:'list',
      legend:'Any pain, tightness or niggle?',

  // Pages group multiple questions onto one screen while keeping each

  var DISC_LABEL = {swim:'Swim',bike:'Bike',run:'Run',brick:'Brick',strength:'Strength'};

  var PERIOD = [

  var PHASE_ALIASES = {'base / taper':'base', 'base/taper':'base'};
  function normalizePhaseKey(raw){

  }

  // ═══════════════════════════════════════════════════════════════
  // WARM UP — dryland mobility routines, one per discipline. Content

        {name:'Dead Bugs', dose:'', ts:341, cue:'On your back, knees raised to a 90° tabletop, arms pointing straight up. Slowly extend your right arm and left leg, return to centre, and alternate sides. Keep your lower back flat and glued to the floor throughout.'},

    },
    bike: {
      label: 'Bike', video: 'zp_-SNNvph8',
      titlePre: 'Hips, ankles & ', titleEm: 'lower back', titlePost: ' warm-up',

      structure: '8 exercises · about 6 minutes',
      equipment: 'None — bodyweight only',
      exercises: [
        {name:'4-Way Wrist Circles', dose:'', ts:6, cue:'Switch your hand position with every repetition to mobilise the wrists.'},
        {name:'Cat-Cow', dose:'', ts:55, cue:'Alternate between rounding your upper back and opening up your chest.'},
        {name:'Knee & Ankle Circles', dose:'', ts:105, cue:'Stand on one leg and move your opposite lower leg in a circular, pendulum motion.'},
        {name:'Knee & Ankle Circles — opposite leg', dose:'', ts:155, cue:'Switch legs and repeat the circular motion on the other side.'},
        {name:'Good Mornings', dose:'', ts:205, cue:'Push your hips back into a hinge position while maintaining a slight bend in your knees.'},
        {name:'Inchworm to Walk the Dog', dose:'', ts:255, cue:'Roll down to the floor, walk your hands out to a high plank, and press back into a downward dog.'},
        {name:'Alternating Quad Stretch', dose:'', ts:305, cue:'From a seated position, extend your hips to stretch the quad, alternating sides.'},
        {name:'Alternating Pendulum', dose:'', ts:355, cue:'On your back, both knees bent, rotate your legs side to side to loosen the lower back.'}
      ]
    },
    run: {
      label: 'Run', video: '3WUtJxLv-wI',
      titlePre: 'Ankles, hips & ', titleEm: 'shoulders', titlePost: ' warm-up',
      desc: 'Wake up the ankles and hips and prime the arm drive before you head out the door.',
      structure: '10 exercises · about 7 minutes',
      equipment: 'A wall for balance on a few moves',
      exercises: [
        {name:'Ankle Inversion / Eversion', dose:'', ts:10, cue:'Standing, roll one ankle inward and outward through its full range of motion, then switch sides.'},
        {name:'Ankle Rocks', dose:'', ts:44, cue:'Rock back and forth from your heels to your toes — use a wall for balance if needed. Targets dorsiflexion and plantar flexion while strengthening the anterior tibialis and calves.'},
        {name:'Hip Flexion Pulls', dose:'', ts:80, cue:'Bring your knee toward your chest, rotate your thigh outward, and grab the outside of your foot. Alternate legs, adding a forward and backward stepping motion, as if walking.'},
        {name:'Standing Twists', dose:'', ts:116, cue:'Knuckles to your temples, thumbs pointing down. Bring one knee up and twist your torso so the opposite elbow meets the knee. Alternate sides.'},

  var PLANNED_SESSIONS_PER_WEEK = 8;
  var WEEK_FLOOR_FRACTION = 0.6;

  // ═══════════════════════════════════════════════════════════════
  // STORAGE — the Google Sheet (see GOOGLE SHEET SYNC below) is the source

  // ═══════════════════════════════════════════════════════════════
  var LOG_KEY = 'triMomentumLog_v1';
  var PHASE_KEY = 'triMomentumPhase_v1';
