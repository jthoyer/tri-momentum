<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRI Momentum Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a three-column wiki (page tree, article, outline) in the app's own palette.
   Brand blue leads, a dark ink hero carries the yellow accent the app uses on its dark panels. */
:root{
  --bg:#F7F8FC; --surface:#FFFFFF; --s3:#F0F2F8; --s4:#E8EBF5;
  --ink:#0E1020; --ink2:#4B5278; --ink3:#626B8C;
  --line:rgba(14,16,32,.12); --line2:rgba(14,16,32,.07);
  --accent:#0022FF; --accent-l:#E8EFFE; --on-accent:#FFFFFF;
  --hero-bg:#0E1020; --hero-fg:#FFFFFF; --hero-mute:rgba(255,255,255,.78); --hero-accent:#F8C44F;
  --warn-bg:#FFF1E0; --warn-ink:#7A3606;
  --p-base:#0F6E56; --p-base-l:#E1F5EE;
  --p-build:#A64C09; --p-build-l:#FFF1E0;
  --p-peak:#993C1D; --p-peak-l:#FAECE7;
  --p-taper:#5B3A93; --p-taper-l:#F0EAFA;
  --d-swim:#0022FF; --d-swim-l:#E8EFFE;
  --d-bike:#0F6E56; --d-bike-l:#E1F5EE;
  --d-run:#993C1D; --d-run-l:#FAECE7;
  --d-brick:#534AB7; --d-brick-l:#EEEDFE;
  --d-strength:#854F0B; --d-strength-l:#FAEEDA;
  --fd:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fb:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fm:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side-w:300px; --bar-h:56px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--fb);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
code{font:500 .86em var(--fm);background:var(--s3);border:1px solid var(--line2);padding:.08em .35em;border-radius:5px;overflow-wrap:anywhere}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:8px;z-index:60}
.skip:focus{left:max(16px,env(safe-area-inset-left,0px))}

/* shell */
.wiki{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-top:env(safe-area-inset-top,0px)}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:600 17px/1 var(--fd);letter-spacing:-.2px}
.logo{width:32px;height:32px;border-radius:9px;background:#0022FF;color:#fff;display:grid;place-items:center;font:700 13px/1 var(--fd);letter-spacing:.02em}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--s3)}
#sideclose{display:none}
.search{position:relative;padding:4px 16px 12px max(16px,env(safe-area-inset-left,0px))}
.search input{width:100%;height:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:0 40px 0 14px;font:400 15px var(--fb)}
.search input::placeholder{color:var(--ink3)}
.search kbd{position:absolute;right:28px;top:11px;font:500 12px var(--fm);color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.treewrap,.results{flex:1;overflow:auto;padding:0 8px 24px max(8px,env(safe-area-inset-left,0px));min-height:0}
.tl{list-style:none;margin:0;padding:0}
.tl .tl{margin-left:14px;border-left:1px solid var(--line2);padding-left:4px}
.row{display:flex;align-items:center}
.tg{width:32px;height:44px;flex:none;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:8px}
.tg.sp{cursor:default}
.tg::before{content:"";width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(-45deg);transition:transform .15s}
.tg[aria-expanded="true"]::before{transform:rotate(45deg)}
.tg.sp::before{display:none}
.item{flex:1;display:block;min-height:44px;padding:10px 10px;border-radius:10px;text-decoration:none;color:var(--ink2);font:500 15px/1.3 var(--fb)}
.item:hover{background:var(--s3);color:var(--ink)}
.item[aria-current="page"]{background:var(--accent-l);color:var(--accent);font-weight:600}
.top>.row>.item{color:var(--ink);font-weight:600}
.top>.row>.item[aria-current="page"]{color:var(--accent)}
.results a{display:block;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink);margin-bottom:2px}
.results a:hover{background:var(--s3)}
.results b{display:block;font-weight:600}
.results .path{display:block;font-size:12px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase}
.results .snip{display:block;font-size:13.5px;color:var(--ink2);line-height:1.45;margin-top:2px}
.results mark{background:var(--accent-l);color:var(--accent);border-radius:3px;padding:0 2px}
.results .none{padding:12px;color:var(--ink2)}
.scrim{position:fixed;inset:0;background:rgba(7,9,20,.5);z-index:30}

.mainwrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:8px;min-height:var(--bar-h);padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line2)}
#menu{display:none}
.crumbs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:2px 8px;font-size:14px;color:var(--ink3);min-width:0}
.crumbs li+li::before{content:"/";margin-right:8px;color:var(--ink3)}
.crumbs a{color:var(--ink2);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs [aria-current]{color:var(--ink);font-weight:500}
main{flex:1;overflow:auto;min-height:0}
main:focus{outline:none}
.mainin{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:40px;max-width:1120px;margin:0 auto;padding:40px max(24px,env(safe-area-inset-right,0px)) 96px max(24px,env(safe-area-inset-left,0px))}
.doc{min-width:0;max-width:760px}

/* article type */
.doc h1{font:600 clamp(28px,4vw,38px)/1.15 var(--fd);letter-spacing:-.6px;margin:0 0 12px;text-wrap:balance}
.doc h1:focus{outline:none}
.eyebrow{font:600 13px/1 var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 0 14px}
.lead{font-size:19px;line-height:1.55;color:var(--ink2);margin:0 0 28px;max-width:60ch}
.doc h2{font:600 24px/1.25 var(--fd);letter-spacing:-.3px;margin:48px 0 12px;scroll-margin-top:24px;text-wrap:balance}
.doc h3{font:600 18px/1.3 var(--fd);margin:28px 0 8px;scroll-margin-top:24px}
.doc p,.doc li{max-width:68ch}
.doc p{margin:0 0 14px}
.doc ul,.doc ol{padding-left:22px;margin:0 0 16px}
.doc li{margin-bottom:6px}
.doc li::marker{color:var(--ink3)}
.note{margin:20px 0;padding:14px 16px;border-radius:12px;background:var(--accent-l);border:1px solid var(--line2);max-width:68ch}
.note p:last-child{margin:0}
.note.warn{background:var(--warn-bg);color:var(--warn-ink)}
.note.warn a{color:inherit}
.note strong:first-child{display:block;font:600 13px/1 var(--fd);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.tblwrap{overflow-x:auto;margin:16px 0 24px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tblwrap:focus-visible{outline-offset:0}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:480px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
thead th{font:600 12.5px/1.2 var(--fd);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);background:var(--s3)}
tbody tr:last-child>*{border-bottom:0}
tbody th{font-weight:600;color:var(--ink)}
td{color:var(--ink2)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font:600 12.5px/1 var(--fd);padding:5px 11px;border-radius:999px;white-space:nowrap}
.ph-base{background:var(--p-base-l);color:var(--p-base)}
.ph-build{background:var(--p-build-l);color:var(--p-build)}
.ph-peak{background:var(--p-peak-l);color:var(--p-peak)}
.ph-taper{background:var(--p-taper-l);color:var(--p-taper)}
.ds-swim{background:var(--d-swim-l);color:var(--d-swim)}
.ds-bike{background:var(--d-bike-l);color:var(--d-bike)}
.ds-run{background:var(--d-run-l);color:var(--d-run)}
.ds-brick{background:var(--d-brick-l);color:var(--d-brick)}
.ds-strength{background:var(--d-strength-l);color:var(--d-strength)}
.sw{display:inline-block;width:18px;height:18px;border-radius:5px;border:1px solid var(--line);vertical-align:-4px;margin-right:8px}
.status{display:inline-block;font:600 12.5px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:6px}
.st-live{background:var(--p-base-l);color:var(--p-base)}
.st-plan{background:var(--s4);color:var(--ink2)}
.st-orph{background:var(--p-build-l);color:var(--p-build)}

/* hero + cards */
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:20px;padding:32px 28px 30px;margin:0 0 28px}
.hero .eyebrow{color:var(--hero-accent)}
.hero h1{color:var(--hero-fg);font-size:clamp(32px,5vw,46px);margin-bottom:14px}
.hero h1 em{font-style:normal;color:var(--hero-accent)}
.hero .lead{color:var(--hero-mute);margin:0}
.kidgrid{list-style:none;padding:0;margin:16px 0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.kidgrid li{margin:0;max-width:none}
.kid{display:flex;flex-direction:column;gap:4px;height:100%;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:0 1px 2px rgba(14,16,32,.04),0 10px 24px -14px rgba(14,16,32,.18)}
.kid:hover{border-color:var(--accent)}
.kid .kk{font:600 12px/1 var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.kid b{font:600 17px/1.25 var(--fd)}
.kid .kd{font-size:14.5px;line-height:1.5;color:var(--ink2)}
.doc .kidgrid,.doc .flow{padding-left:0}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;margin:16px 0 24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel h3{margin:0 0 6px;font-size:17px}
.panel p:last-child,.panel ul:last-child{margin-bottom:0}
.flow{list-style:none;padding:0;margin:16px 0 24px;display:grid;gap:10px;counter-reset:s}
.flow li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;max-width:none;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.flow li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--accent-l);color:var(--accent);display:grid;place-items:center;font:600 14px var(--fd)}
.flow li b{display:block}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px}
.pager a{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface)}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;font:600 12px/1 var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.pager .nx{text-align:right;grid-column:2}
.pager .pv{grid-column:1}
.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:var(--accent-l)}100%{background:transparent}}

/* blueprint + screen flow */
.mainin.full{grid-template-columns:minmax(0,1fr);max-width:none}
.mainin.full .doc{max-width:none}
.mainin.full .doc>p,.mainin.full .doc>.note,.mainin.full .doc>ul{max-width:68ch}
.small{font-size:14.5px;color:var(--ink2)}
.sw-t,.l-t .sw{background:var(--d-swim)}
.sw-a{background:var(--p-taper)}
.sw-o{background:var(--d-strength)}
.sw-s{background:var(--ink3)}
.sw-m{background:var(--p-base)}
.sw-w{background:var(--p-peak)}
.sw-n{background:var(--d-brick)}
.legend{list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;padding:0;margin:0 0 20px;font-size:14.5px}
.legend li{margin:0;max-width:none}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);-webkit-overflow-scrolling:touch}
.scroller:focus-visible{outline-offset:0}
.bp .grid{display:grid;gap:0}
.bp h2{margin-top:32px}
.cell{padding:12px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);min-width:0;display:flex;flex-direction:column;gap:8px}
.cell p{margin:0}
.cell.lanehead{background:var(--s3);position:sticky;left:0;z-index:2;font-size:13.5px;line-height:1.35;border-right:1px solid var(--line)}
.cell.lanehead strong{font:600 14px/1.2 var(--fd)}
.cell.lanehead span{color:var(--ink2)}
.cell.lanehead.corner{font:600 12px/1 var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.cell.lanehead[class*="l-"]{box-shadow:inset 4px 0 0 var(--lc)}
.l-t{--lc:var(--d-swim);--lb:var(--d-swim-l)}
.l-a{--lc:var(--p-taper);--lb:var(--p-taper-l)}
.l-o{--lc:var(--d-strength);--lb:var(--d-strength-l)}
.l-s{--lc:var(--ink3);--lb:var(--s3)}
.l-m{--lc:var(--p-base);--lb:var(--p-base-l)}
.l-w{--lc:var(--p-peak);--lb:var(--p-peak-l)}
.cell.l-t,.cell.l-a,.cell.l-o,.cell.l-s,.cell.l-m,.cell.l-w{background:var(--lb)}
.cell.stage{flex-direction:row;gap:12px;align-items:flex-start;background:var(--surface);border-bottom:2px solid var(--line)}
.cell.stage .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:600 16px var(--fd)}
.sname{display:flex;flex-direction:column;gap:2px;min-width:0}
.sname b{font:600 17px/1.25 var(--fd)}
.stagetag{font-size:13.5px;color:var(--ink2);line-height:1.4}
.key{font:500 11.5px/1 var(--fm);color:var(--ink3);letter-spacing:.02em}
.sname .key{display:block}
.cell.line{grid-column:1/-1;padding:5px 12px;background:var(--bg);border-bottom:1px dashed var(--ink3);border-top:1px dashed var(--ink3);flex-direction:row}
.cell.line span{font:600 11.5px/1 var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.inside{margin:0;padding-left:20px;font-size:14.5px}
.inside li{margin-bottom:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14.5px;line-height:1.45;scroll-margin-top:24px;display:flex;flex-direction:column;gap:5px}
.card p{margin:0;max-width:none}
.card .src{align-self:flex-start;font:500 11.5px/1 var(--fm);color:var(--ink2);background:var(--s3);border-radius:5px;padding:3px 6px}
.status{white-space:nowrap;align-self:flex-start}
.fstripwrap{margin:22px 0}
.fstripwrap h3{margin:0 0 8px}
.fstrip{list-style:none;display:flex;align-items:center;gap:6px;margin:0;padding:14px;min-width:min-content}
.fstrip li{margin:0;max-width:none}
.fnode{flex:none}
.fnode a{display:flex;flex-direction:column;align-items:flex-start;gap:5px;width:132px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-decoration:none;color:var(--ink)}
.fnode a:hover{border-color:var(--accent)}
.fnode img{display:block;width:100%;height:150px;object-fit:cover;object-position:top;border-radius:7px;border:1px solid var(--line2);background:var(--s3)}
.fnode b{font:600 14px/1.25 var(--fd)}
.fnode.txt{width:132px;padding:10px;border:1px dashed var(--ink3);border-radius:12px;color:var(--ink2);display:flex;flex-direction:column;gap:4px;align-self:stretch;justify-content:center}
.fnode.txt b{color:var(--ink)}
.fnode.txt small{font-size:13px;line-height:1.35}
.noshot{display:grid;place-items:center;width:100%;height:150px;border-radius:7px;background:var(--s3);color:var(--ink3);font-size:13px;text-align:center}
.farrow{flex:none;color:var(--ink3);font-size:20px;padding:0 2px}
.zrow{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 16px}
.zlink{font-size:14.5px}
.sv{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:32px;align-items:start;margin-top:16px}
.svshot{display:flex;flex-direction:column;gap:16px;position:sticky;top:12px}
.phone{background:var(--ink);padding:8px;border-radius:30px;box-shadow:0 18px 40px -18px rgba(14,16,32,.5)}
.phone img{display:block;width:100%;height:auto;border-radius:22px;background:var(--surface)}
.phone.noshotbox{background:var(--s3);color:var(--ink2);padding:24px;border-radius:20px;font-size:15px;box-shadow:none}
.svcards h2{margin-top:0}
.lanegrp{margin:0 0 20px}
.lanehd{display:flex;align-items:center;gap:8px;margin:0 0 8px!important;font-size:16px!important}
.lanehd span{font:400 14px var(--fb);color:var(--ink3)}
.lanecards{display:grid;gap:8px}
@media (max-width:900px){.sv{grid-template-columns:minmax(0,1fr)}.svshot{position:static;flex-direction:row;overflow-x:auto}.svshot .phone{flex:none;width:260px}}


.cite{font-size:.72em;line-height:0;margin-left:2px}
.cite a{text-decoration:none;font-weight:600;padding:0 1px}
.conf{display:inline-block;font:600 12px/1 var(--fd);letter-spacing:.04em;padding:4px 8px;border-radius:6px;white-space:nowrap;vertical-align:1px}
.conf-h{background:var(--p-base-l);color:var(--p-base)}
.conf-m{background:var(--p-build-l);color:var(--p-build)}
.conf-l{background:var(--p-peak-l);color:var(--p-peak)}
.tblwrap td .conf{margin:0}
.sources{list-style:none;padding:0;margin:16px 0;display:grid;gap:10px}
.sources li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;max-width:none;margin:0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;scroll-margin-top:24px}
.sources .srcno{font:600 14px var(--fm);color:var(--ink3)}
.sources p{margin:4px 0 0;overflow-wrap:anywhere}
/* outline */
.toc{position:sticky;top:0;align-self:start;max-height:calc(100vh - 140px);overflow:auto;font-size:14px;padding-top:4px}
.toc h2{font:600 12px/1 var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px}
.toc ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.toc a{display:block;padding:5px 12px;color:var(--ink2);text-decoration:none;margin-left:-1px;border-left:2px solid transparent;line-height:1.35}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:600}
.toc a.d3{padding-left:24px;font-size:13.5px}

@media (max-width:1180px){.mainin{grid-template-columns:minmax(0,1fr)}.toc{display:none!important}}
@media (max-width:900px){
  .wiki{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,340px);z-index:40;transform:translateX(-102%);transition:transform .2s}
  body[data-nav="open"] .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  #menu,#sideclose{display:grid}
  .mainin{padding-top:24px;padding-bottom:72px}
  .hero{padding:24px 20px}
  .pager{grid-template-columns:1fr}.pager .nx,.pager .pv{grid-column:auto;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  function researchHTML() { return '' +
'<p class="eyebrow">Level 0 · Research</p><h1>Market research</h1>' +
'<p class="lead">Where the gap is for TRI Momentum, how big the opportunity might be, and what to test next.</p>' +

'<h2 id="summary">Summary</h2>' +
'<p><b>The gap.</b> Training apps for triathletes tend to do one of two jobs. They generate a plan, or they analyse what a watch recorded. In the sources reviewed, I found none positioned on a third job: helping an athlete who already has a plan check whether they trained the way they meant to, and decide what to change. ' + conf('L', 'Low to medium') + '</p>' +
'<ul>' +

'<li><b>The market is crowded and consolidating.</b> Strava bought Runna in April 2025 ' + c(22) + '. Garmin put AI insights behind a paid tier in March 2025 ' + c(23) + '. Platforms now bundle coaching at $70 to $150 a year. ' + conf('M') + '</li>' +
'<li><b>Intensity discipline is the recurring problem.</b> Recreational athletes tend to run easy sessions too hard ' + c(27) + '. The evidence for the best fix is still thin for triathletes ' + c(26) + '. ' + conf('M') + '</li>' +

'<h2 id="themes">Themes and insights</h2>' +
'<div class="cols2">' +
'<div class="panel"><h3>1. Easy days run too hard</h3><p>Recreational triathletes do not follow a polarised intensity pattern, and recreational runners tend to run easy sessions too fast ' + c(27) + '. Coaching sources call the middle band the "grey zone", where many amateurs spend most of their time ' + c(26) + '.</p><p class="small">Caveat: sources disagree on where the grey zone starts and ends, and a 2020 pilot found a lack of evidence on which approach is better for triathletes ' + c(26) + '.</p>' + conf('M') + '</div>' +
'<div class="panel"><h3>2. Self-report works</h3><p>A systematic review of 56 studies found that subjective measures were more sensitive and consistent than objective ones for acute and chronic training load ' + c(25) + '.</p><p class="small">Caveat: the title says subjective measures "trump" objective ones. The findings support them as sensitive monitors, not as a replacement in every setting.</p>' + conf('H') + '</div>' +
'<div class="panel"><h3>3. Injury is common and load is not the whole story</h3><p>Overuse injury incidence runs from 37 to 91% in long-distance triathlon. Short-course rates are 15.7 to 24.3 per 1,000 exposures ' + c(28) + '. Running and cycling drive most of it.</p><p class="small">Neither review isolates training load as the cause. The app should capture niggles, not claim to prevent injury.</p>' + conf('H') + '</div>' +
'<div class="panel"><h3>4. Plans are cheap, reconciliation is not</h3><p>Plan generation is crowded ' + c(20, 22, 24) + '. Many athletes already hold a plan from a coach, a club or a spreadsheet. In the sources reviewed, few products start from that plan and score the log against it.</p><p class="small">This is my synthesis. It needs interviews to confirm.</p>' + conf('L') + '</div>' +
'<div class="panel"><h3>5. The audience is newer and younger</h3><p>Growth in the twenties and thirties, and in one-day memberships ' + c(1) + ', suggests many people are new to structured training and want help deciding, not just a plan.</p>' + conf('M') + '</div>' +
'<div class="panel"><h3>6. Retention is the hard part</h3><p>Fitness apps lose most users in the first month ' + c(29) + '. A log-based tool depends on a habit. Reducing the effort of each entry matters more than adding features.</p><p class="small">Retention figures are second-hand and vary by vendor.</p>' + conf('L') + '</div>' +
'</div>' +

'<h2 id="opportunities">Opportunity areas</h2>' +
'<p>Ranked by how well the evidence supports them and how close the current app is. Fit comes from the project file ' + c(32) + '.</p>' +
'<div class="tblwrap" tabindex="0" role="region" aria-label="Opportunity areas"><table><thead><tr><th scope="col">#</th><th scope="col">Opportunity</th><th scope="col">Evidence</th><th scope="col">Fit with the app today</th><th scope="col">Confidence</th></tr></thead><tbody>' +
'<tr><th scope="row">1</th><td><b>Intent against outcome.</b> Show an athlete how often they finished at the effort they meant to hold.</td><td>Easy days run too hard ' + c(27) + '. Self-report is sensitive ' + c(25) + '.</td><td>Built. The Intensity drift signal, with an under-intent side.</td><td>' + conf('M') + '</td></tr>' +
'<tr><th scope="row">2</th><td><b>Bring your own plan.</b> Score the log against a plan from a coach or Notion.</td><td>Plan generation is crowded ' + c(20, 24) + '. Reconciliation is thin in the sources.</td><td>Built manually. Adherence scores plan against log. Strava minutes already reach the Sheet and nothing reads them.</td><td>' + conf('L') + '</td></tr>' +
'<tr><th scope="row">3</th><td><b>Race-anchored phase map.</b> Orient newer athletes in a block that ends on race day.</td><td>Growth is in newer, younger members ' + c(1) + '.</td><td>Partly built. The races calendar edits each week\'s phase. The cycle builder exists but has no link into it.</td><td>' + conf('M') + '</td></tr>' +
'<tr><th scope="row">4</th><td><b>Low-friction logging.</b> Make each entry take seconds.</td><td>Most fitness app users drop off in a month ' + c(29) + '.</td><td>Built. Auto-progress, the Today card, and the Earlier this week carousel.</td><td>' + conf('L') + '</td></tr>' +
'<tr><th scope="row">5</th><td><b>Thinking prompts.</b> A short, mechanism-first prompt per phase.</td><td>No direct evidence of demand found.</td><td>Not built. Described in the target architecture only.</td><td>' + conf('L') + '</td></tr>' +
'<tr><th scope="row">6</th><td><b>Price below the specialists.</b> Hold near A$79, near the platforms.</td><td>Anchors cluster at $70 to $150 ' + c(19, 20, 22, 23) + '.</td><td>Planned. No paywall exists yet.</td><td>' + conf('M') + '</td></tr>' +
'</tbody></table></div>' +
'<h3>Not supported by the evidence yet</h3>' +
'<ul>' +
'<li><b>Injury prevention claims.</b> The reviews do not isolate training load ' + c(28) + '.</li>' +
'<li><b>Club and coach features.</b> I found no evidence of demand. The decision log already places them last.</li>' +
'<li><b>Beating platforms on features.</b> Strava and Garmin are bundling AI ' + c(22, 23) + '.</li></ul>' +

'<h2 id="risks">Risks</h2>' +
'<ul>' +
'<li><b>Platform bundling.</b> A free or cheap feature inside Strava or Garmin could cover opportunity 1 ' + c(22, 23) + '.</li>' +
'<li><b>Thin evidence on the gap.</b> The central claim rests on my reading of vendor positioning, not on athlete interviews.</li>' +
'<li><b>Small, churny market.</b> About 480,000 reachable people and high early churn ' + c(1, 13, 29) + '.</li>' +
'<li><b>Self-report fatigue.</b> A check-in only works if athletes keep answering it. The three answers that feed signals matter most.</li></ul>' +

'<h2 id="next">What to do next</h2>' +
'<ol class="flow">' +
'<li><div><b>Interview ten athletes.</b>Age-groupers training for an Olympic or 70.3 race, mixed between coached, self-coached and app-led. Ask what they do after a session and how they notice drift.</div></li>' +

'<h2 id="sources">Sources</h2>' +

  page('strategy', 'Strategy', null, 'The user, the job, the value loop and the limits.', function () { return '' +
'<p class="eyebrow">Level 1</p><h1>Strategy</h1>' +
'<p class="lead">TRI Momentum is a mobile-first progressive web app for intermediate triathletes training for Olympic distance and 70.3 events. It is not a training log. It is a decision-support tool.</p>' +
'<h2>Who it is for</h2>' +
'<p>One user type. A time-pressured age-grouper with 10 to 15 hours a week of training and strong self-knowledge. They have no interest in being hand-held. The copy in the app reflects that.</p>' +
'<h2>The job</h2>' +
'<p>Help the athlete make better choices about load, recovery and race preparation across a repeating block: base, build, peak, recovery.</p>' +
'<h2>The value loop</h2>' +
'<p>This is the direction of travel. Today\'s app delivers a working subset of it.</p>' +
'<ol class="flow">' +
'<li><div><b>Set dates</b>The athlete sets a training start date and a race date.</div></li>' +
'<li><div><b>Resolve position</b>The app works out the phase, block week and emphasis pillar from those dates.</div></li>' +
'<li><div><b>Prompt</b>It shows the right thinking prompt for that point in the cycle.</div></li>' +
'<li><div><b>Log</b>The athlete logs session outcomes and a weekly reflection.</div></li>' +
'<li><div><b>Track</b>The app follows readiness, grey-zone training and vulnerable sessions.</div></li>' +
'<li><div><b>Reveal</b>Trends surface patterns the athlete cannot see week to week.</div></li>' +
'</ol>' +
'<h2 id="two-codebases">Two codebases</h2>' +
'<p>The repository holds two things at once. It matters which one you are touching.</p>' +
'<div class="cols2">' +
'<div class="panel"><h3>Current app <span class="status st-live">Live</span></h3><ul>' +
'<li><code>index.html</code> at the repo root. Static, no build step, no framework, no accounts.</li>' +
'<li>Three Strength PWAs embedded by iframe.</li>' +
'<li>Served by GitHub Pages straight from the repo root.</li>' +
'<li>A reactive check-in log with rule-based pattern detection.</li></ul></div>' +
'<div class="panel"><h3>Target architecture <span class="status st-plan">Planned</span></h3><ul>' +
'<li><code>frontend/</code>, <code>backend/</code> and <code>supabase/</code>.</li>' +
'<li>React, Vite, Hono, Supabase and Stripe.</li>' +
'<li>Accounts, cross-device sync, a phase-aware tip system and a paywall.</li>' +
'<li>Scaffolded with one initial commit. Not wired up.</li></ul></div></div>' +
'<div class="note"><strong>Rule of thumb</strong><p>If a feature is not described under <a href="#product">The app</a>, assume it does not exist in the shipped app yet. Documented does not mean shipped.</p></div>' +
'<h2 id="principles">Principles</h2>' +
'<ul>' +
'<li><b>The app stores what the athlete planned. It never decides what they should plan.</b> This line separates a plan copy from a plan generator.</li>' +
'<li><b>Infer, do not ask.</b> Signals come from logged data, not from a readiness score the athlete types in.</li>' +
'<li><b>Mechanism first.</b> Any future tip explains why before what.</li>' +
'<li><b>Fail quietly and locally.</b> A failed Sheet write never blocks a check-in.</li>' +
'<li><b>Measure contrast.</b> Every new colour passes WCAG AA before it ships.</li></ul>' +
'<h2 id="not-build">What we will not build</h2>' +
'<ul>' +
'<li>A native iOS or Android app. The PWA is the target.</li>' +
'<li>Tailwind, Bootstrap or any library that overrides the tokens.</li>' +
'<li>Server-side rendering.</li>' +
'<li>An admin dashboard. Use the Supabase dashboard once it exists.</li>' +
'<li><b>Training plan generation.</b> The app never authors, suggests or adjusts a session. The athlete\'s periodisation is written in Notion.</li>' +
'<li>Sheet-driven drag-and-drop plan editing, or changing a planned session\'s date.</li>' +
'<li>Notion sync, plan import or AI plan generation.</li></ul>' +
'<p>The phase-cycle builder dates phase blocks backwards from a race, using week counts the athlete typed. It writes ordinary rows the athlete can edit. It does not generate sessions.</p>';
  });

  page('checkin', 'Check-in', 'product', 'The after-session logging wizard.', function () { return '' +

  page('plan', 'Training plan', 'product', 'A manual copy of the athlete\'s planned sessions.', function () { return '' +

  page('strength', 'Strength', 'product', 'Three embedded PWAs: Swim, Ride/Run and Rehab.', function () { return '' +

  page('signals', 'Signals', null, 'Rule-based patterns computed from your log.', function () { return '' +
'<p class="eyebrow">How it works</p><h1>Signals</h1>' +
'<p class="lead">Signals are inferred from logged sessions at read time. They are never stored. They replace a self-reported readiness score.</p>' +
'<div class="tblwrap" tabindex="0" role="region" aria-label="Signals"><table><thead><tr><th scope="col">Signal</th><th scope="col">Reads</th><th scope="col">Question behind it</th></tr></thead><tbody>' +
'<tr><th scope="row">Intensity drift</th><td><code>a1</code></td><td>Did it finish at the effort you intended?</td></tr>' +
'<tr><th scope="row">Fuelling</th><td><code>a3</code></td><td>How did fuelling go on long sessions?</td></tr>' +
'<tr><th scope="row">Adherence</th><td>plan and log, or <code>a2</code></td><td>Did you do what you planned?</td></tr>' +
'</tbody></table></div>' +
'<h2>How a signal is built</h2>' +
'<ol class="flow">' +
'<li><div><b>Categorise</b>Each session scores good, mid or bad for that signal.</div></li>' +
'<li><div><b>Detect pairs</b>Two bad sessions back to back are a compound pair. That outranks an isolated bad one.</div></li>' +
'<li><div><b>Pick severity</b>The period gets good, mid or bad.</div></li>' +
'<li><div><b>Write a headline</b>Plain language, for example "Your Swim on Mon ran well under intent, and the Run on Tue that followed did too".</div></li>' +
'</ol>' +
'<h2 id="drift">Intensity drift</h2>' +
'<div class="tblwrap" tabindex="0" role="region" aria-label="Drift scoring"><table><thead><tr><th scope="col">Answer</th><th scope="col">Score</th><th scope="col">Direction</th></tr></thead><tbody>' +
'<tr><th scope="row">At intent</th><td>good</td><td>none</td></tr>' +
'<tr><th scope="row">Slightly over, Slightly under</th><td>mid</td><td>over, under</td></tr>' +
'<tr><th scope="row">Well over, Well under</th><td>bad</td><td>over, under</td></tr>' +
'<tr><th scope="row">I hadn\'t set one</th><td>not scored</td><td>none</td></tr>' +
'</tbody></table></div>' +
'<p>Headlines that name two specific sessions state each direction exactly. Headlines that count a mix fall back to the neutral word "off".</p>' +
'<h2 id="adherence">Adherence, two stages</h2>' +
'<div class="cols2">' +
'<div class="panel"><h3>Stage A, self-reported</h3><p>Used when no plan rows exist in the period. Reads <code>a2</code>. This is how it first shipped, and it is untouched.</p></div>' +
'<div class="panel"><h3>Stage B, objective</h3><p>Used when any plan row falls in the period. Scores the plan against the log, including sessions that never happened.</p></div></div>' +
'<p>The switch is per period, and in Month per week. A month can hold both kinds of week. Nobody who skips the Plan view loses anything.</p>' +
'<h3>Stage B rules</h3>' +
'<ul>' +
'<li><b>Matching.</b> Greedy one-to-one by date and discipline. Two planned and two logged swims give two scored results, not a false miss plus a false extra. With different durations the pairing can be the wrong way round. The count is right, the attribution may not be.</li>' +
'<li><b>Not due yet.</b> A planned session today or later is pending. Only a passed day can score bad.</li>' +
'<li><b>Extra.</b> A logged session with no plan row is counted, never scored bad.</li>' +
'<li><b>Missed key session.</b> A planned <code>key</code> session never logged forces the period to bad, however clean the rest.</li>' +
'<li><b>Partial weeks.</b> Computed against the rows that exist. No completeness threshold.</li></ul>' +
'<h2>Known gaps</h2>' +
'<ul>' +
'<li><code>b2</code> (feel) and <code>b3</code> (niggle) feed no signal yet.</li>' +
'<li>An exact plan id on each check-in would end the matching heuristic. It needs a Sheet column and a redeploy, so it is deferred.</li>' +
'<li>Strava already syncs objective minutes, distance and heart rate into the Sheet. Nothing reads them back. The plan to change that is on <a href="#integrations">Garmin and Strava</a>.</li></ul>';

  page('data', 'Data and sync', null, 'The Sheet is the source of truth.', function () { return '' +
'<p class="eyebrow">Where it lives</p><h1>Data and sync</h1>' +
'<p class="lead">No accounts, no server of our own. A personal Google Sheet holds the data, reached through an Apps Script web app. That keeps the phone and the laptop in agreement.</p>' +
'<div data-children></div>' +
'<h2>The pattern</h2>' +
'<ul>' +
'<li><b>Write:</b> a <code>no-cors</code> POST. Fire and forget. An opaque response. A failed write never blocks a check-in.</li>' +
'<li><b>Read:</b> a normal <code>cors</code> GET, because the JSON body needs parsing. It runs on load and whenever This week or Month opens.</li>' +
'<li><b>Cache:</b> <code>localStorage</code> paints the last-known state instantly and covers a failed fetch. It is never authoritative.</li>' +
'<li><b>Ids:</b> generated in the browser, so a delete never has to read an id out of an opaque response.</li></ul>';
  });

  page('sheet', 'The Sheet', 'data', 'Four tabs and what each holds.', function () { return '' +
'<p class="eyebrow">Data and sync</p><h1>The Sheet</h1>' +
'<p class="lead">One spreadsheet, four tabs. The code lives in <code>apps-script/Code.gs</code>.</p>' +
'<div class="tblwrap" tabindex="0" role="region" aria-label="Sheet tabs"><table><thead><tr><th scope="col">Tab</th><th scope="col">Holds</th><th scope="col">Read</th><th scope="col">Write actions</th></tr></thead><tbody>' +
'<tr><th scope="row">Sessions</th><td>One row per check-in.</td><td><code>?list=1</code></td><td>Append</td></tr>' +
'<tr><th scope="row">Races</th><td>The race calendar.</td><td><code>?races=1</code></td><td>add, delete</td></tr>' +
'<tr><th scope="row">Plan</th><td>One row per planned session.</td><td><code>?plan=1</code></td><td>add, addBatch, update, delete, deleteWeek</td></tr>' +
'<tr><th scope="row">Phases</th><td>One row per phase block.</td><td><code>?phases=1</code></td><td>add, addBatch, update, delete, deleteRange, replaceAll</td></tr>' +
'</tbody></table></div>' +
'<p>The Races, Plan and Phases tabs are created on demand. Writes are bodies shaped like <code>{kind:\'plan\', action:\'add\', ...}</code>.</p>' +
'<h2>Why batch actions exist</h2>' +
'<p>A week is about ten sessions. Ten concurrent no-cors POSTs race each other on <code>appendRow</code>. <code>addBatch</code> writes them in one block. <code>deleteWeek</code> walks the sheet bottom-up, because <code>deleteRow</code> shifts later rows up and a top-down loop skips and then mis-deletes.</p>' +
'<h2>Plan update touches seven columns</h2>' +
'<p>The <code>update</code> action writes Disc, Title, Intensity, DurationMin, Key, Notes and Phase. ID, Date and CreatedAt sit outside the written range by construction. It takes the document lock, because a concurrent <code>deleteWeek</code> could otherwise point a blind write at the wrong row.</p>' +
'<h2>Why an empty Phases response is special</h2>' +
'<p>A phase plan can never legitimately be empty once it exists. So an empty reply is ambiguous. It could mean a new setup, or a device that has never pushed its plan. Trusting it would wipe every existing user\'s plan on first load. The client pushes its local plan up once per device instead, then follows normal incremental writes.</p>' +
'<h2>Hand-editable by design</h2>' +
'<p>The tabs are meant to survive manual edits. A Key column accepts TRUE, true, yes, y or 1. A race status accepts "Locked in", "locked" or "LOCKED".</p>' +
'<h2>Strava, already running</h2>' +
'<p>A complete Strava OAuth flow and a two-hourly sync write objective columns N to T of the session sheet: actual minutes, kilometres, average heart rate, pace or power, elevation and suffer score. <code>listSessions_</code> only reads columns 1 to 13, so none of it reaches the app. It is a disposable precursor to the target Garmin work.</p>' +
'<p>The plan to read it back, and to add Garmin, is on <a href="#integrations">Garmin and Strava</a>.</p>';

  page('deploy', 'Deploying the script', 'data', 'Why Code.gs changes need a manual redeploy.', function () { return '' +
'<p class="eyebrow">Data and sync</p><h1>Deploying the script</h1>' +

  page('integrations', 'Garmin and Strava', 'data', 'A plan to read device-recorded sessions back into the app.', function () { return '' +
'<p class="eyebrow">Data and sync</p><h1>Garmin and Strava</h1>' +
'<p class="lead">Your watch already records the session. The app only knows what you typed. This plan brings the recording back, without touching what you reported yourself.</p>' +
'<div class="note"><strong>Status, 9 November 2026</strong><p>A plan. Nothing is built. The OpenAthlete REST docs could not be reached when this was written, so every claim about its auth, limits and terms is marked <b>unverified</b> until phase 0 checks it. What it returns for an activity was read from its connector, not its docs.</p></div>' +
'<h2>What exists today</h2>' +
'<div class="tblwrap" tabindex="0" role="region" aria-label="Current state"><table><thead><tr><th scope="col">Piece</th><th scope="col">State</th></tr></thead><tbody>' +
'<tr><th scope="row">Strava sync</th><td>Live in <code>Code.gs</code>. OAuth, a two-hourly trigger, tokens in Script Properties.</td></tr>' +
'<tr><th scope="row">What it writes</th><td>Columns N to T of an <em>existing check-in row</em>: StravaId, ActualMin, ActualKm, AvgHR, AvgPaceOrPower, ElevM, SufferScore.</td></tr>' +
'<tr><th scope="row">What the app reads</th><td><code>listSessions_</code> stops at column 13. None of it arrives.</td></tr>' +
'<tr><th scope="row">Garmin</th><td>Nothing. The target architecture parks it as session 7.</td></tr>' +
'<tr><th scope="row">OpenAthlete</th><td>Attached to this Claude session as a connector. It holds your synced activities, including Zwift rides. The app does not use it.</td></tr>' +
'</tbody></table></div>' +
'<h2 id="integration-gap">The gap that matters</h2>' +
'<p>Strava only attaches to a row you already logged. So a planned session that your watch recorded, but you never checked in, scores as <b>missed</b> in Adherence. That is wrong, and it is the case Adherence exists to get right. A recording is the best proof a session happened.</p>' +
'<h2>Four rules</h2>' +
'<ol class="flow">' +
'<li><div><b>Device data never fills a self-report</b>Not <code>a1</code>, not <code>a2</code>, not <code>a3</code>, not <code>b2</code>, not <code>b3</code>, not <code>rpe</code>. Decision 29 protects <code>a1</code> for a reason: the app must not answer its own question. Measured effort gets its own signal beside the self-reported one.</div></li>' +
'<li><div><b>Add, never replace</b>No device data in range means the app behaves exactly as it does today. Same pattern as Adherence Stage A and B.</div></li>' +
'<li><div><b>One store, any source</b>A new Activities tab holds every recording with a <code>Source</code> column. The app never knows whether Garmin, Strava or OpenAthlete supplied a row.</div></li>' +
'<li><div><b>Secrets stay server-side</b>Keys and tokens live in Script Properties. The browser sees finished rows only.</div></li>' +
'</ol>' +
'<h2>Where the data comes from</h2>' +
'<div class="tblwrap" tabindex="0" role="region" aria-label="Source options"><table><thead><tr><th scope="col">Option</th><th scope="col">Covers</th><th scope="col">Cost and risk</th><th scope="col">Verdict</th></tr></thead><tbody>' +
'<tr><th scope="row">A. Extend the Strava sync</th><td>Strava, and so Garmin if Garmin already pushes to Strava.</td><td>No new auth. Cheap. Strava only, and a Garmin to Strava double record is possible.</td><td>The fallback.</td></tr>' +
'<tr><th scope="row">B. OpenAthlete as the feed</th><td>Garmin, Strava and Zwift in one place, already synced.</td><td>Needs a REST key (unverified). Auth, rate limits, terms and webhooks are unverified. Adds a third party between you and your data.</td><td>The likely pick, once phase 0 confirms it.</td></tr>' +
'<tr><th scope="row">C. Garmin directly</th><td>Garmin only.</td><td>As far as I know, the official API needs an approved business application, and the unofficial wrapper breaks without notice. General knowledge, check before relying on it.</td><td>Not worth it for one athlete.</td></tr>' +
'</tbody></table></div>' +
'<p>Apps Script calls the feed server to server, so browser CORS does not apply to B. That removes one worry, not the unknowns above.</p>' +
'<p>The plan builds the store and the screens first, and keeps the feed swappable. Phase 0 picks A or B.</p>' +
'<h2>The Activities tab</h2>' +
'<p>A fifth sheet tab, created on demand like Plan and Phases. Read with <code>?activities=1</code>. Written only by the script, never by the browser.</p>' +
'<div class="tblwrap" tabindex="0" role="region" aria-label="Activities columns"><table><thead><tr><th scope="col">Column</th><th scope="col">Notes</th></tr></thead><tbody>' +
'<tr><th scope="row">ID</th><td>Source plus external id. Makes a re-sync safe to repeat.</td></tr>' +
'<tr><th scope="row">Source</th><td>strava, garmin or openathlete.</td></tr>' +
'<tr><th scope="row">Date, Start</th><td>Local date and time. Strava ships a UTC Z on a local time, so slice the date as the existing sync does.</td></tr>' +
'<tr><th scope="row">Disc</th><td>Mapped to swim, bike, run or strength. Blank when no mapping applies. The row is still kept.</td></tr>' +
'<tr><th scope="row">Name</th><td>The recording title.</td></tr>' +
'<tr><th scope="row">MovingMin, DistanceKm, ElevM</th><td>Duration, distance and climb.</td></tr>' +
'<tr><th scope="row">AvgHR, MaxHR</th><td>Beats per minute.</td></tr>' +
'<tr><th scope="row">AvgPower, NormPower, AvgPace</th><td>Whatever the sport gives.</td></tr>' +
'<tr><th scope="row">Load</th><td>Source load figure, labelled by source. TRIMP from OpenAthlete, suffer score from Strava. They are not the same unit.</td></tr>' +
'<tr><th scope="row">CreatedAt</th><td>When the script first saw it.</td></tr>' +
'</tbody></table></div>' +
'<p>OpenAthlete also returns laps, cadence and your feedback answers. The first version leaves those out.</p>' +
'<h3>Sport to discipline</h3>' +
'<ul>' +
'<li><b>run:</b> RUNNING, TRAIL_RUNNING, VIRTUAL_RUN. Strava: Run, TrailRun, VirtualRun.</li>' +
'<li><b>bike:</b> CYCLING, VIRTUAL_RIDE, GRAVEL_RIDE, MOUNTAIN_BIKE_RIDE, E_BIKE_RIDE. Strava: Ride, VirtualRide, GravelRide, MountainBikeRide, EBikeRide.</li>' +
'<li><b>swim:</b> SWIMMING. Strava: Swim.</li>' +
'<li><b>strength:</b> STRENGTH, WEIGHT_TRAINING, WORKOUT, CROSSFIT. Strava: WeightTraining, Workout, Crossfit.</li>' +
'<li><b>Not matched:</b> walks, hikes, yoga, mobility and multisport types. Stored, never matched. Add a mapping later if one earns it.</li></ul>' +
'<h2>Phases</h2>' +
'<ol class="flow">' +

  P.forEach(function (p) { M[p.id] = p; p.c = []; });
  P.forEach(function (p) { if (p.p && M[p.p]) M[p.p].c.push(p.id); else if (p.id !== 'home') roots.push(p.id); });
  (function walk(ids) { ids.forEach(function (id) { order.push(id); walk(M[id].c); }); })(['home'].concat(roots));
  P.forEach(function (p) {
    var d = document.createElement('div');
    d.innerHTML = typeof p.h === 'function' ? p.h() : p.h;
    searchIdx.push({ id: p.id, t: p.t, x: (d.textContent || '').replace(/\s+/g, ' ').trim() });
  });

  var doc = document.getElementById('doc'), main = document.getElementById('main');
  var treeEl = document.getElementById('tree'), resEl = document.getElementById('results');
  var q = document.getElementById('q'), crumbsEl = document.getElementById('crumbs'), tocEl = document.getElementById('toc');

  var open = {};
  try { open = JSON.parse(localStorage.getItem('trim-wiki-open') || '{}') || {}; } catch (e) { open = {}; }
  function saveOpen() { try { localStorage.setItem('trim-wiki-open', JSON.stringify(open)); } catch (e) { /* storage blocked */ } }
  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    for (var k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function buildTree(ids, depth) {
    var ul = el('ul', { 'class': 'tl' });
    ids.forEach(function (id) {
      var m = M[id], kids = m.c;
      var node = el('li', { 'class': 'ti' + (depth === 0 ? ' top' : ''), 'data-id': id });
      var row = el('div', { 'class': 'row' });
      if (kids.length) {
        var b = el('button', { 'class': 'tg', type: 'button', 'aria-expanded': 'false', 'aria-label': 'Show pages under ' + m.t });
        b.addEventListener('click', function () { setOpen(id, !open[id]); saveOpen(); });
        row.appendChild(b);
      } else row.appendChild(el('span', { 'class': 'tg sp' }));
      row.appendChild(el('a', { 'class': 'item', href: '#' + id }, m.t));
      node.appendChild(row);
      if (kids.length) { var sub = buildTree(kids, depth + 1); sub.hidden = true; node.appendChild(sub); }
      ul.appendChild(node);
      li[id] = node;
    });
    return ul;
  }
  function setOpen(id, on) {
    var node = li[id]; if (!node) return;
    var b = node.querySelector(':scope > .row > button'), sub = node.querySelector(':scope > ul');
    if (!b || !sub) return;
    open[id] = !!on;
    b.setAttribute('aria-expanded', on ? 'true' : 'false');
    sub.hidden = !on;
  }
  treeEl.appendChild(buildTree(['home'].concat(roots), 0));
  Object.keys(open).forEach(function (id) { if (open[id]) setOpen(id, true); });

  function markCurrent(id) {
    if (current && li[current]) li[current].querySelector(':scope > .row > .item').removeAttribute('aria-current');
    current = id;
    var node = li[id]; if (!node) return;
    var it = node.querySelector(':scope > .row > .item');
    it.setAttribute('aria-current', 'page');
    var p = M[id].p;
    while (p) { setOpen(p, true); p = M[p].p; }
    setOpen(id, true);
    var box = treeEl.getBoundingClientRect(), r = it.getBoundingClientRect();
    if (r.top < box.top || r.bottom > box.bottom) it.scrollIntoView({ block: 'center' });
  }

  function pathOf(id) {
    var out = [], p = M[id].p;
    while (p) { out.unshift(M[p].t); p = M[p].p; }
    return out.join(' › ');
  }
  function runSearch() {
    var raw = q.value.trim().toLowerCase();
    if (raw.length < 2) { resEl.hidden = true; treeEl.hidden = false; return; }
    var toks = raw.split(/\s+/), hits = [];
    searchIdx.forEach(function (s) {
      var title = s.t.toLowerCase(), body = s.x.toLowerCase(), score = 0, ok = true;
      toks.forEach(function (t) {
        var inT = title.indexOf(t) > -1, n = body.split(t).length - 1;
        if (!inT && !n) ok = false;
        score += (inT ? 6 : 0) + Math.min(n, 5);
      });
      if (ok) hits.push({ s: s, score: score });
    });
    hits.sort(function (a, b) { return b.score - a.score; });
    resEl.innerHTML = '';
    if (!hits.length) resEl.appendChild(el('p', { 'class': 'none' }, 'No pages match “' + q.value.trim() + '”.'));
    hits.slice(0, 20).forEach(function (h) {
      var s = h.s, a = el('a', { href: '#' + s.id });
      a.appendChild(el('b', {}, s.t));
      a.appendChild(el('span', { 'class': 'path' }, pathOf(s.id) || 'Home'));
      var i = s.x.toLowerCase().indexOf(toks[0]);
      if (i > -1) {
        var from = Math.max(0, i - 50), snip = (from ? '…' : '') + s.x.slice(from, i + 90) + '…';
        var sp = el('span', { 'class': 'snip' }), html = esc(snip);
        toks.forEach(function (t) { html = html.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); });
        sp.innerHTML = html; a.appendChild(sp);
      }
      resEl.appendChild(a);
    });
    treeEl.hidden = true; resEl.hidden = false;
  }
  q.addEventListener('input', runSearch);
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { q.value = ''; runSearch(); }
    if (e.key === 'Enter') { var a = resEl.querySelector('a'); if (a) location.hash = a.getAttribute('href'); }
  });
  resEl.addEventListener('click', function (e) { if (e.target.closest('a')) { q.value = ''; runSearch(); } });

  function renderCrumbs(id) {
    var chain = [], p = id;
    while (p) { chain.unshift(p); p = M[p].p; }
    if (chain[0] !== 'home') chain.unshift('home');
    var ol = el('ol', { 'class': 'crumbs' });
    chain.forEach(function (c, i) {
      var item = el('li');
      if (i === chain.length - 1) { item.setAttribute('aria-current', 'page'); item.textContent = M[c].t; }
      else item.appendChild(el('a', { href: '#' + c }, M[c].t));
      ol.appendChild(item);
    });
    crumbsEl.innerHTML = ''; crumbsEl.appendChild(ol);
  }
  function kidsHTML(id) {
    var kids = M[id].c;
    if (!kids.length) return '';
    var out = '<section aria-labelledby="kids-h"><h2 id="kids-h">In this section</h2><ul class="kidgrid">';
    kids.forEach(function (k) {
      var m = M[k];
      out += '<li><a class="kid" href="#' + k + '"><b>' + esc(m.t) + '</b>' + (m.d ? '<span class="kd">' + esc(m.d) + '</span>' : '') + '</a></li>';
    });
    return out + '</ul></section>';
  }
  function pagerHTML(id) {
    var i = order.indexOf(id), p = order[i - 1], n = order[i + 1], out = '';
    if (p) out += '<a class="pv" rel="prev" href="#' + p + '"><small>Previous</small><b>' + esc(M[p].t) + '</b></a>';
    if (n) out += '<a class="nx" rel="next" href="#' + n + '"><small>Next</small><b>' + esc(M[n].t) + '</b></a>';
    return '<nav class="pager" aria-label="Previous and next page">' + out + '</nav>';
  }

  var spy = [], ticking = false;
  function buildToc() {
    tocEl.innerHTML = ''; spy = [];
    var hs = [].slice.call(doc.querySelectorAll('h2, h3')).filter(function (h) {
      return !h.closest('.kidgrid') && h.id !== 'kids-h' && !h.closest('.panel') && !h.closest('.tblwrap');
    });
    if (hs.length < 3 || doc.querySelector('.bp')) { tocEl.hidden = true; return; }
    tocEl.hidden = false;
    tocEl.appendChild(el('h2', {}, 'On this page'));
    var ol = el('ol');
    hs.forEach(function (h) {
      var a = el('a', { href: '#', 'class': 'd' + h.tagName.charAt(1) }, h.textContent.replace(/\s+/g, ' ').trim());
      a.addEventListener('click', function (e) { e.preventDefault(); h.scrollIntoView({ block: 'start' }); });
      var item = el('li'); item.appendChild(a); ol.appendChild(item);
      spy.push({ h: h, a: a });
    });
    tocEl.appendChild(ol);
    onScroll();
  }
  function onScroll() {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      var top = main.getBoundingClientRect().top + 90, on = null;
      spy.forEach(function (s) { if (s.h.getBoundingClientRect().top <= top) on = s; });
      spy.forEach(function (s) { s.a.classList.toggle('on', s === on); });
    });
  }
  main.addEventListener('scroll', onScroll, { passive: true });

  /* Ids on headings become in-page anchors. Resolve "#anchor" to its page. */
  var anchors = {};
  P.forEach(function (p) {
    var d = document.createElement('div');
    d.innerHTML = typeof p.h === 'function' ? p.h() : p.h;
    [].forEach.call(d.querySelectorAll('[id]'), function (n) { if (n.id !== 'kids-h') anchors[n.id] = p.id; });
  });

  function resolve(h) {
    if (!h) return { id: 'home' };
    if (M[h]) return { id: h };
    if (anchors[h]) return { id: anchors[h], anchor: h };
    return { id: 'home' };
  }
  function show(id, anchor) {
    var m = M[id], html = typeof m.h === 'function' ? m.h() : m.h;
    html = html.indexOf('<div data-children></div>') > -1 ? html.replace('<div data-children></div>', kidsHTML(id)) : html;
    if (m.c.length && html.indexOf('class="kidgrid"') === -1) html += kidsHTML(id);
    doc.innerHTML = html + pagerHTML(id);
    [].forEach.call(doc.querySelectorAll('img[data-shot]'), function (im) { im.src = SHOTS[im.getAttribute('data-shot')]; });
    document.querySelector('.mainin').classList.toggle('full', !!doc.querySelector('.bp'));
    document.title = (id === 'home' ? '' : m.t + ' · ') + 'TRI Momentum Wiki';
    renderCrumbs(id); markCurrent(id); buildToc();
    var target = anchor && document.getElementById(anchor);
    if (target && doc.contains(target)) {
      target.scrollIntoView({ block: 'start' });
      target.classList.add('flash');
      setTimeout(function () { target.classList.remove('flash'); }, 2600);
    } else {
      main.scrollTop = 0;
      if (!first) { var h1 = doc.querySelector('h1'); if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); } }
    }
    first = false;
    document.body.removeAttribute('data-nav');
    document.getElementById('menu').setAttribute('aria-expanded', 'false');
    document.getElementById('scrim').hidden = true;
  }
  function route() {
    var h = '';
    try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { h = ''; }
    var r = resolve(h);
    show(r.id, r.anchor);
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    var h = a.getAttribute('href');
    if (h.length > 1 && h.slice(1) === decodeURIComponent(location.hash.slice(1))) { e.preventDefault(); route(); }
  });

  function nav(on) {
    if (on) document.body.setAttribute('data-nav', 'open'); else document.body.removeAttribute('data-nav');
    document.getElementById('menu').setAttribute('aria-expanded', on ? 'true' : 'false');
    document.getElementById('scrim').hidden = !on;
    if (on) q.focus({ preventScroll: true });
  }
  document.getElementById('menu').addEventListener('click', function () { nav(!document.body.hasAttribute('data-nav')); });
  document.getElementById('sideclose').addEventListener('click', function () { nav(false); });
  document.getElementById('scrim').addEventListener('click', function () { nav(false); });
  document.getElementById('skip').addEventListener('click', function () { main.focus(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.body.hasAttribute('data-nav')) nav(false);
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName || '') && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      if (window.matchMedia('(max-width: 900px)').matches) nav(true); else q.focus();
    }
  });

  route();
})();
</script>
</body>
</html>
